<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Conecta Barenbrug</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
:root{
  --amarelo:#FFDB00; --azul:#00A8E2; --azul-escuro:#00557A; --preto:#1E1E1E;
  --branco:#FFFFFF; --papel:#F3F7F9; --linha:#D5E1E7; --apagado:#5A6B74; --bloqueado:#A9B7BE;
  --azul-claro:#E3F5FC; --amarelo-claro:#FFF7BF;
  --fonte:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--preto);font-family:var(--fonte);font-size:16px;line-height:1.55}
button,input,select{font:inherit}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}
img{max-width:100%}
:focus-visible{outline:3px solid var(--azul-escuro);outline-offset:2px}
.sci{font-style:italic}

.topo{background:var(--amarelo);padding:12px 16px 0}
.topo-in{max-width:880px;margin:0 auto}
.topo-linha{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.logo{height:34px;width:auto;display:block;align-self:flex-start;flex:0 0 auto}
.quem{font-size:13px;text-align:right}
.quem button{background:none;border:0;padding:0;color:var(--preto);text-decoration:underline;cursor:pointer;font-size:13px}
.nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.nav button{background:none;border:0;padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--preto);border-radius:6px 6px 0 0;white-space:nowrap}
.nav button[aria-current=page]{background:var(--papel)}
main{max-width:880px;margin:0 auto;padding:26px 16px 56px;display:grid;gap:24px}
main>*{min-width:0}
.titulo{color:var(--azul);font-weight:800;font-size:clamp(26px,6vw,36px)}
.sub{color:var(--apagado);max-width:62ch;margin-top:6px}
h2.sec{color:var(--azul);font-size:21px;font-weight:800}
.voltar{background:none;border:0;padding:0;color:var(--azul-escuro);font-weight:700;cursor:pointer;justify-self:start}
.btn{background:var(--azul-escuro);color:var(--branco);border:0;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer;display:inline-block}
.btn:disabled{background:var(--bloqueado);cursor:not-allowed}
.btn.preto{background:var(--preto)}
.link{text-align:left;background:none;border:0;padding:0;color:var(--azul-escuro);text-decoration:underline;cursor:pointer}
.carregando{min-height:70vh;display:grid;place-items:center;color:var(--apagado)}

.acesso{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--branco)}
.acesso-marca{background:var(--amarelo);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.acesso-marca h1{font-size:clamp(30px,5vw,42px);font-weight:800;color:var(--preto)}
.acesso-form{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.acesso-form h2{color:var(--azul);font-weight:800;font-size:24px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:6px;background:var(--branco);color:var(--preto)}
input:disabled{background:var(--papel);color:var(--apagado)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.erro{background:var(--amarelo-claro);padding:10px 12px;font-size:14px;border-left:4px solid var(--preto)}
.dica{font-size:13px;color:var(--apagado)}

.proximo{background:var(--amarelo);padding:22px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.proximo>div{min-width:0;flex:1 1 260px}
.rot{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.proximo h2{font-size:24px;font-weight:800;color:var(--preto);margin-top:3px}
.barra{height:8px;background:var(--linha);overflow:hidden;border-radius:4px}
.barra i{display:block;height:100%;background:var(--azul)}
.resumo{display:grid;gap:7px;font-size:14px;color:var(--apagado)}

.trilha{list-style:none;margin:0;padding:0;display:grid}
.trilha li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:12px}
.trilha li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--linha)}
.trilha li.feita:not(:last-child)::before{background:var(--azul)}
.marco{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--branco);color:var(--bloqueado);box-shadow:inset 0 0 0 3px var(--linha);font-variant-numeric:tabular-nums}
.feita .marco{background:var(--azul);color:var(--branco);box-shadow:none}
.atual .marco{background:var(--amarelo);color:var(--preto);box-shadow:inset 0 0 0 3px var(--preto)}
.etapa-b{background:none;border:0;padding:6px 0 10px;text-align:left;width:100%;display:grid;gap:2px;color:inherit;min-width:0}
button.etapa-b{cursor:pointer}
button.etapa-b:hover h3{text-decoration:underline}
.etapa-b h3{font-size:19px;font-weight:700}
.etapa-b p{font-size:14px;color:var(--apagado)}
.bloq .etapa-b h3{color:var(--apagado)}
.est{font-size:12px;font-weight:700;color:var(--azul-escuro)}

.player{background:var(--azul-escuro);color:var(--branco);aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;text-align:center}
.play{width:0;height:0;border-left:30px solid var(--amarelo);border-top:18px solid transparent;border-bottom:18px solid transparent}
.player h3{font-size:clamp(18px,4vw,24px);color:var(--branco)}
.player p{font-size:13px;opacity:.9}
.lista{display:grid;background:var(--branco);border-radius:6px;overflow:hidden}
.linha{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);justify-content:space-between;flex-wrap:wrap}
.linha:last-child{border-bottom:0}
.linha>div{min-width:0;flex:1 1 200px}
.linha.ativa{background:var(--azul-claro)}
.linha strong{display:block}
.meta{font-size:13px;color:var(--apagado)}
.check{display:flex;gap:7px;align-items:center;font-size:14px;margin:0;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--azul-escuro)}
.bloco{display:grid;gap:12px}

.perg{background:var(--branco);padding:16px;border:0;margin:0;border-radius:6px}
.perg legend{font-weight:700;padding:0;margin-bottom:10px}
.perg .op{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-weight:400;font-size:15px;cursor:pointer;margin:0}
.perg .op input{margin-top:4px;width:auto;accent-color:var(--azul-escuro)}
.mark{font-size:13px;font-weight:700;margin-top:8px}
.resultado{padding:16px;border-radius:6px}
.resultado.ok{background:var(--azul);color:var(--branco)}
.resultado.nao{background:var(--amarelo)}
.resultado h3{font-size:22px;font-weight:800}
.resultado.ok h3 b{color:var(--amarelo)}

.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--linha);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--preto);width:auto}
.chip[aria-pressed=true]{background:var(--azul-escuro);color:var(--branco);box-shadow:none}
.vazio{padding:20px;background:var(--branco);color:var(--apagado);border-radius:6px}

.form-card{background:var(--branco);padding:18px;border-radius:6px;display:grid;gap:14px;max-width:520px}

.cert{background:var(--azul);color:var(--branco);padding:clamp(24px,6vw,48px);display:grid;gap:14px;border-radius:6px}
.cert .rot{color:var(--amarelo)}
.cert h2{font-size:clamp(26px,6vw,40px);font-weight:800;color:var(--branco)}
.cert h2 b{color:var(--amarelo)}
.cert .slogan{font-weight:800;font-size:20px;margin-top:10px}
.cert .slogan b{color:var(--amarelo)}

.tab{overflow-x:auto;background:var(--branco);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado);padding:10px 12px;border-bottom:2px solid var(--linha)}
td{padding:10px 12px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
.selo{font-size:12px;font-weight:700;padding:2px 8px;background:var(--azul-claro);color:var(--azul-escuro);border-radius:4px;white-space:nowrap}
.nota-admin{background:var(--amarelo-claro);border-left:4px solid var(--amarelo);padding:12px 14px;font-size:14px;border-radius:4px}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--preto);color:var(--branco);padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);z-index:20;border-radius:6px}

@media (max-width:640px){
  .acesso{grid-template-columns:1fr;min-height:0}
  .logo{height:28px}
  .nav button{padding:9px 8px;font-size:14px}
}
</style>
</head>

        q("Para qual produtor o Carcará é mais indicado?",["Quem corrige o solo, aduba e maneja a lotação","Quem não pretende adubar","Quem busca a semente mais barata"],0)]},
 {id:"vender",n:"Como vender",d:"Objeções, preço e argumentação.",
  v:[["Vender valor, não saco",5],["Objeções mais comuns no campo",5],["Preço e papel de cada canal",5]],mat:["Apostila"],
  quiz:[q("O que avaliar antes de indicar um cultivar?",["Só o preço do saco","Solo, sistema e janela de plantio do produtor","A cor da embalagem"],1),
        q("Peso do saco de Sabiá, Cayana e Carcará?",["3 kg","10 kg","25 kg"],1),
        q("A comunicação pode citar cultivares concorrentes?",["Não","Sim, sempre","Sim, nos impressos"],0)]},
 {id:"prova",n:"Prova final",d:"Oito perguntas sobre a jornada. Aprovação com 6 acertos.",v:[],mat:[]}
];
const PROVA=[["boas",1],["hibrido",1],["sabia",0],["sabia",1],["cayana",1],["carcara",0],["carcara",1],["vender",0]]
  .map(([e,i])=>ETAPAS.find(x=>x.id===e).quiz[i]);
const ORDEM=ETAPAS.map(e=>e.id);

const BASE=[];
["Sabiá","Cayana","Carcará"].forEach(c=>[["Apostila","PDF"],["Podcast","Áudio"],["Banco de imagens","Fotos"],["Posts","Artes prontas"]].forEach(([t,f])=>BASE.push({c,t,f,n:`${t} ${c}`})));
BASE.push({c:"Geral",t:"Apostila",f:"PDF",n:"Glossário do pasto"},{c:"Geral",t:"Apostila",f:"PDF",n:"Perguntas frequentes do vendedor"});

const REQUIRED=["nome","telefone"];

let S={user:null, profile:null, perfil:null, feitas:[], notas:{}, pag:"trilha", etapa:null, video:0, vistos:{}, res:null,
       fCult:"Todos", fTipo:"Todos", busca:"", equipe:null, _erro:null};

function aviso(t){document.querySelector(".aviso")?.remove();const d=document.createElement("div");d.className="aviso";d.setAttribute("role","status");d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3400);}
const feitasOrdenadas=()=>ORDEM.filter(id=>S.feitas.includes(id));
const qtdFeitas=()=>feitasOrdenadas().length;
const indiceAtual=()=>{for(let i=0;i<ORDEM.length;i++){if(!S.feitas.includes(ORDEM[i]))return i;}return ORDEM.length;};
const estado=i=>{const a=indiceAtual();return i<a?"feita":i===a?"atual":"bloq";};
const ehAdmin=()=>S.perfil==="Administrador";
const cadastroCompleto=()=>REQUIRED.every(f=>S.profile&&(S.profile[f]||"").trim());

/* ---------- boot ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){render();return;}
  await carregarUsuario(session.user);
  render();
}
async function carregarUsuario(u){
  S.user=u;
  let {data:prof}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(!prof){
    await sb.from("profiles").insert({id:u.id,nome:(u.email||"").split("@")[0],email:u.email});
    ({data:prof}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle());
  }
  S.profile=prof||{};
  S.perfil=(prof&&prof.perfil)||"RC";
  const {data:prog}=await sb.from("progresso").select("etapa,nota").eq("user_id",u.id);
  S.feitas=(prog||[]).map(r=>r.etapa);
  S.notas={};(prog||[]).forEach(r=>S.notas[r.etapa]=r.nota);
  S.pag=ehAdmin()?"acomp":"trilha";
}

/* ---------- acesso ---------- */
function vLogin(erro){
  return `<div class="acesso"><div class="acesso-marca"><img class="logo" src="${LOGO}" alt="Barenbrug">
    <div><h1>Portal Conecta Barenbrug</h1><p style="margin-top:10px">O ponto de partida de quem vende Sabiá, Cayana e Carcará.</p></div></div>
    <form class="acesso-form" id="f-login"><h2>Entrar</h2><p>Use o e-mail e a senha que você recebeu.</p>
      <div><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div>
      <div><label for="senha">Senha</label><input id="senha" type="password" required autocomplete="current-password"></div>
      ${erro?`<div class="erro" role="alert">${esc(erro)}</div>`:""}
      <button class="btn" type="submit">Entrar</button>
      <p class="dica">Esqueceu a senha? Fale com o administrador da plataforma para gerar uma nova.</p>
    </form></div>`;
}
function vTrocaSenha(erro){
  return `<div class="acesso"><div class="acesso-marca"><img class="logo" src="${LOGO}" alt="Barenbrug">
    <div><h1>Portal Conecta Barenbrug</h1><p style="margin-top:10px">Primeiro acesso: defina sua senha.</p></div></div>
    <form class="acesso-form" id="f-senha"><h2>Crie sua senha</h2><p>Por segurança, troque a senha que você recebeu por uma só sua.</p>
      <div><label for="s1">Nova senha</label><input id="s1" type="password" required minlength="8" autocomplete="new-password"></div>
      <div><label for="s2">Repita a nova senha</label><input id="s2" type="password" required minlength="8" autocomplete="new-password"></div>
      ${erro?`<div class="erro" role="alert">${esc(erro)}</div>`:""}
      <button class="btn" type="submit">Salvar e continuar</button>
      <p class="dica">Pelo menos 8 caracteres.</p>
    </form></div>`;
}
function camposPerfil(){
  const p=S.profile||{};
  const campo=(id,lbl,val,req,tipo)=>`<div><label for="${id}">${lbl}${req?" *":""}</label><input id="${id}" type="${tipo||"text"}" value="${esc(val)}" ${req?"required":""}></div>`;
  return campo("c_nome","Nome completo",p.nome,true)
    +`<div><label for="c_email">E-mail</label><input id="c_email" value="${esc(S.user.email)}" disabled></div>`
    +campo("c_tel","Telefone / WhatsApp",p.telefone,true,"tel")
    +`<div class="dupla">${campo("c_cidade","Cidade",p.cidade,false)}${campo("c_uf","UF",p.uf,false)}</div>`
    +campo("c_funcao","Função / cargo",p.funcao,false);
}
function vCadastroObrig(){
  return `<div class="acesso"><div class="acesso-marca"><img class="logo" src="${LOGO}" alt="Barenbrug">
    <div><h1>Portal Conecta Barenbrug</h1><p style="margin-top:10px">Primeiro acesso: complete seu cadastro para continuar.</p></div></div>
    <form class="acesso-form" id="f-cadastro"><h2>Complete seu cadastro</h2><p>Os campos com <strong>*</strong> são obrigatórios.</p>
      ${camposPerfil()}
      ${S._erro?`<div class="erro" role="alert">${esc(S._erro)}</div>`:""}
      <button class="btn" type="submit">Salvar e continuar</button>
    </form></div>`;
}
function vPerfil(){
  return `<div><h1 class="titulo">Meu perfil</h1><p class="sub">Mantenha seus dados atualizados. Os campos com <strong>*</strong> são obrigatórios. Seu perfil de acesso é <strong>${esc(S.perfil)}</strong>.</p></div>
  <form class="form-card" id="f-cadastro">${camposPerfil()}
    ${S._erro?`<div class="erro" role="alert">${esc(S._erro)}</div>`:""}
    <div><button class="btn" type="submit">Salvar</button></div></form>`;
}

/* ---------- app ---------- */
function cabecalho(){
  const comuns=[["base","Base de conhecimento"],["perfil","Meu perfil"]];
  const it=ehAdmin()?[["acomp","Acompanhamento"],...comuns]:[["trilha","Minha trilha"],...comuns];
  return `<header class="topo"><div class="topo-in"><div class="topo-linha"><img class="logo" src="${LOGO}" alt="Barenbrug">
    <div class="quem"><strong>${esc(S.profile.nome||S.user.email)}</strong> · ${esc(S.perfil)}<br><button data-a="sair">Sair</button></div></div>
    <nav class="nav" aria-label="Principal">${it.map(([k,t])=>`<button data-a="pag" data-v="${k}" ${S.pag===k?'aria-current="page"':""}>${t}</button>`).join("")}</nav></div></header>`;
}
function vTrilha(){
  const f=qtdFeitas(),tot=ORDEM.length,fim=f>=tot,at=ETAPAS[indiceAtual()];
  return `<div><h1 class="titulo">Trilha de treinamento</h1><p class="sub">Siga as etapas na ordem. Cada questionário aprovado libera a próxima.</p></div>
  ${fim?`<section class="proximo"><div><span class="rot">Jornada concluída</span><h2>Seu certificado está pronto</h2></div><button class="btn preto" data-a="cert">Ver certificado</button></section>`
  :`<section class="proximo"><div><span class="rot">Sua próxima etapa · ${f+1} de ${tot}</span><h2>${at.n}</h2><p>${at.d}</p></div><button class="btn preto" data-a="abrir" data-v="${indiceAtual()}">Continuar</button></section>`}
  <div class="resumo"><div class="barra"><i style="width:${f/tot*100}%"></i></div><span>${f} de ${tot} etapas concluídas</span></div>
  <ol class="trilha">${ETAPAS.map((e,i)=>{const s=estado(i),nota=S.notas[e.id];
    const corpo=`<h3>${e.n}</h3><p>${e.d}</p><span class="est">${s==="feita"?`Concluída${nota!=null?" · "+nota+" acertos":""}`:s==="atual"?"Etapa atual":"Bloqueada"}</span>`;
    return `<li class="${s}"><span class="marco" aria-hidden="true">${s==="feita"?"✓":i+1}</span>${s==="bloq"?`<div class="etapa-b">${corpo}</div>`:`<button class="etapa-b" data-a="abrir" data-v="${i}">${corpo}</button>`}</li>`;}).join("")}</ol>`;
}
function vQuiz(lista,id){
  const r=S.res;
  return `<form id="f-quiz" class="bloco" data-id="${id}">${lista.map((x,i)=>`<fieldset class="perg"><legend>${i+1}. ${x.p}</legend>${x.ops.map((o,j)=>`<label class="op"><input type="radio" name="p${i}" value="${j}" required ${r&&r.resp[i]===j?"checked":""}><span>${o}</span></label>`).join("")}${r&&!r.ok?`<div class="mark">${r.resp[i]===x.c?"Correta":"Revise esta resposta"}</div>`:""}</fieldset>`).join("")}
  ${r?`<div class="resultado ${r.ok?"ok":"nao"}" role="status">${r.ok?`<h3>Aprovado: <b>${r.ac} de ${lista.length}</b></h3><p>A próxima etapa foi liberada.</p>`:`<h3>${r.ac} de ${lista.length} acertos</h3><p>Você precisa de ${r.min}. Revise os vídeos e tente de novo.</p>`}</div>`:""}
  ${r&&r.ok?`<button type="button" class="btn" data-a="pos-quiz">${qtdFeitas()>=ORDEM.length?"Ver certificado":"Ir para a trilha"}</button>`:`<button class="btn" type="submit">${r?"Tentar de novo":"Enviar respostas"}</button>`}</form>`;
}
function vEtapa(){
  const i=S.etapa,e=ETAPAS[i],vistos=S.vistos[e.id]||[],s=estado(i);
  if(e.id==="prova")return `<button class="voltar" data-a="pag" data-v="trilha">‹ Minha trilha</button><div><span class="rot">Etapa ${i+1} de ${ORDEM.length}</span><h1 class="titulo">Prova final</h1><p class="sub">${e.d}</p></div>${vQuiz(PROVA,"prova")}`;
  const todos=e.v.every((_,k)=>vistos.includes(k)),v=e.v[S.video];
  return `<button class="voltar" data-a="pag" data-v="trilha">‹ Minha trilha</button>
  <div><span class="rot">Etapa ${i+1} de ${ORDEM.length}</span><h1 class="titulo">${e.n}</h1><p class="sub">${e.d}</p></div>
  <div class="player"><span class="play" aria-hidden="true"></span><h3>${v.t}</h3><p>${v.m} min · O vídeo do YouTube entra aqui</p></div>
  <section class="bloco"><h2 class="sec">Vídeos</h2><div class="lista">${e.v.map((x,k)=>`<div class="linha ${k===S.video?"ativa":""}"><div><button class="link" data-a="video" data-v="${k}">${k+1}. ${x.t}</button><span class="meta"> · ${x.m} min</span></div><label class="check"><input type="checkbox" data-a="visto" data-v="${k}" ${vistos.includes(k)?"checked":""}>Assisti</label></div>`).join("")}</div></section>
  ${e.mat.length?`<section class="bloco"><h2 class="sec">Materiais de apoio</h2><div class="lista">${e.mat.map(m=>`<div class="linha"><div><strong>${m}</strong></div><button class="link" data-a="mat">Abrir</button></div>`).join("")}</div></section>`:""}
  <section class="bloco"><h2 class="sec">Questionário</h2>${s==="feita"&&!S.res?`<div class="vazio">Você concluiu esta etapa${S.notas[e.id]!=null?" com "+S.notas[e.id]+" acertos":""}.</div>`:todos?vQuiz(e.quiz,e.id):`<div class="vazio">Marque todos os vídeos como assistidos para liberar o questionário. Aprovação com 2 de 3 acertos.</div>`}</section>`;
}
function vBase(){
  const b=S.busca.toLowerCase();
  const l=BASE.filter(x=>(S.fCult==="Todos"||x.c===S.fCult)&&(S.fTipo==="Todos"||x.t===S.fTipo)&&x.n.toLowerCase().includes(b));
  const chips=(a,sel,act)=>a.map(x=>`<button class="chip" data-a="${act}" data-v="${x}" aria-pressed="${sel===x}">${x}</button>`).join("");
  return `<div><h1 class="titulo">Base de conhecimento</h1><p class="sub">Materiais de apoio à venda, liberados desde o primeiro acesso.</p></div>
  <div><label for="busca">Buscar material</label><input id="busca" type="search" value="${esc(S.busca)}" placeholder="Ex.: apostila Sabiá"></div>
  <div class="filtros">${chips(["Todos","Sabiá","Cayana","Carcará","Geral"],S.fCult,"fcult")}</div>
  <div class="filtros">${chips(["Todos","Apostila","Podcast","Banco de imagens","Posts"],S.fTipo,"ftipo")}</div>
  <div class="lista" id="res-base">${l.length?l.map(x=>`<div class="linha"><div><strong>${x.n}</strong><span class="meta">${x.c} · ${x.f}</span></div><button class="link" data-a="mat">Abrir</button></div>`).join(""):`<div class="vazio">Nenhum material encontrado.</div>`}</div>`;
}
function vCert(){
  return `<button class="voltar" data-a="pag" data-v="trilha">‹ Minha trilha</button><section class="cert"><span class="rot">Certificado de conclusão</span><h2>Portal <b>Conecta</b> Barenbrug</h2><p>Certificamos que <strong>${esc(S.profile.nome||S.user.email)}</strong> concluiu a trilha de Sabiá, Cayana e Carcará${S.notas.prova!=null?", com "+S.notas.prova+" acertos na prova final":""}.</p><p class="slogan">CULTIVE <b>CONFIANÇA</b></p></section>`;
}
function vAcomp(){
  if(!S.equipe)return `<div class="carregando">Carregando equipe…</div>`;
  const nEtapa=x=>x.feitas>=ORDEM.length?"Concluiu":(ETAPAS[x.feitas]?ETAPAS[x.feitas].n:"—");
  const conc=S.equipe.filter(x=>x.feitas>=ORDEM.length).length;
  return `<div><h1 class="titulo">Acompanhamento</h1><p class="sub">${S.equipe.length} pessoas com acesso · ${conc} concluíram a trilha.</p></div>
  <div class="nota-admin">O painel para você cadastrar novas pessoas (com o perfil de cada uma e a senha gerada automaticamente) é o próximo passo. Por enquanto, os acessos são criados junto comigo.</div>
  <section class="bloco"><h2 class="sec">Pessoas</h2><div class="tab"><table><thead><tr><th>Pessoa</th><th>Perfil</th><th>Etapa atual</th><th>Concluídas</th><th>Prova</th></tr></thead><tbody>${S.equipe.map(x=>`<tr><td>${esc(x.nome)}<br><span class="meta">${esc(x.email||"")}${x.telefone?" · "+esc(x.telefone):""}</span></td><td>${esc(x.perfil)}</td><td><span class="selo">${nEtapa(x)}</span></td><td>${x.feitas} de ${ORDEM.length}</td><td>${x.prova!=null?x.prova+" acertos":"—"}</td></tr>`).join("")}</tbody></table></div></section>`;
}
async function carregarEquipe(){
  const {data:profs}=await sb.from("profiles").select("id,nome,email,perfil,telefone");
  const {data:prog}=await sb.from("progresso").select("user_id,etapa,nota");
  const porUser={};(prog||[]).forEach(r=>{(porUser[r.user_id]=porUser[r.user_id]||[]).push(r);});
  S.equipe=(profs||[]).map(p=>{const rs=porUser[p.id]||[];const prova=rs.find(r=>r.etapa==="prova");return {nome:p.nome||p.email,email:p.email,telefone:p.telefone,perfil:p.perfil,feitas:rs.length,prova:prova?prova.nota:null};})
    .sort((a,b)=>b.feitas-a.feitas);
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S.user){app.innerHTML=vLogin(S._erro);S._erro=null;return;}
  if(S.profile&&S.profile.precisa_trocar_senha){app.innerHTML=vTrocaSenha(S._erro);S._erro=null;return;}
  if(!cadastroCompleto()){app.innerHTML=vCadastroObrig();S._erro=null;return;}
  const corpo={trilha:vTrilha,etapa:vEtapa,base:vBase,cert:vCert,acomp:vAcomp,perfil:vPerfil}[S.pag]||(ehAdmin()?vAcomp:vTrilha);
  app.innerHTML=cabecalho()+`<main>${corpo()}</main>`;
  if(S.pag==="acomp"&&!S.equipe){carregarEquipe().then(render);}
}
const ir=p=>{S.pag=p;S.res=null;S._erro=null;render();window.scrollTo(0,0);};
async function concluir(id,nota){
  if(!S.feitas.includes(id)){S.feitas.push(id);S.notas[id]=nota;
    await sb.from("progresso").upsert({user_id:S.user.id,etapa:id,nota},{onConflict:"user_id,etapa"});}
}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="visto")return;
  if(a==="sair"){await sb.auth.signOut();S={user:null,profile:null,perfil:null,feitas:[],notas:{},pag:"trilha",etapa:null,video:0,vistos:{},res:null,fCult:"Todos",fTipo:"Todos",busca:"",equipe:null,_erro:null};render();}
  if(a==="pag")ir(v);
  if(a==="abrir"){S.etapa=+v;S.video=0;ir("etapa");}
  if(a==="video"){S.video=+v;render();}
  if(a==="mat")aviso("No lançamento, este botão abre o material.");
  if(a==="pos-quiz")ir(qtdFeitas()>=ORDEM.length?"cert":"trilha");
  if(a==="cert")ir("cert");
  if(a==="fcult"){S.fCult=v;render();}
  if(a==="ftipo"){S.fTipo=v;render();}
});
document.addEventListener("change",ev=>{
  const c=ev.target;if(c.dataset.a!=="visto")return;
  const id=ETAPAS[S.etapa].id,k=+c.dataset.v;S.vistos[id]=S.vistos[id]||[];
  S.vistos[id]=c.checked?[...new Set([...S.vistos[id],k])]:S.vistos[id].filter(x=>x!==k);
  if(c.checked&&k+1<ETAPAS[S.etapa].v.length)S.video=k+1;render();
});
document.addEventListener("input",ev=>{
  if(ev.target.id!=="busca")return;S.busca=ev.target.value;const pos=ev.target.selectionStart;render();
  const i=document.getElementById("busca");if(i){i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener("submit",async ev=>{
  const f=ev.target;ev.preventDefault();
  if(f.id==="f-login"){
    const email=f.querySelector("#email").value.trim();const senha=f.querySelector("#senha").value;
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){S._erro=/invalid login/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar. Tente de novo.";render();return;}
    const {data:{session}}=await sb.auth.getSession();await carregarUsuario(session.user);render();
  }
  if(f.id==="f-senha"){
    const s1=f.querySelector("#s1").value,s2=f.querySelector("#s2").value;
    if(s1!==s2){S._erro="As senhas não são iguais.";render();return;}
    if(s1.length<8){S._erro="Use pelo menos 8 caracteres.";render();return;}
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.auth.updateUser({password:s1});
    if(error){S._erro="Não foi possível salvar a senha. Tente de novo.";render();return;}
    await sb.from("profiles").update({precisa_trocar_senha:false}).eq("id",S.user.id);
    S.profile.precisa_trocar_senha=false;render();
  }
  if(f.id==="f-cadastro"){
    const g=id=>f.querySelector(id).value.trim();
    const dados={nome:g("#c_nome"),telefone:g("#c_tel"),cidade:g("#c_cidade"),uf:g("#c_uf"),funcao:g("#c_funcao")};
    if(!dados.nome||!dados.telefone){S._erro="Preencha os campos obrigatórios (*).";render();return;}
    const eraObrig=!cadastroCompleto();
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.from("profiles").update(dados).eq("id",S.user.id);
    if(error){S._erro="Não foi possível salvar. Tente de novo.";render();return;}
    Object.assign(S.profile,dados);S._erro=null;
    if(eraObrig){S.pag=ehAdmin()?"acomp":"trilha";render();aviso("Cadastro completo. Bem-vindo!");}
    else{render();aviso("Dados salvos.");}
  }
  if(f.id==="f-quiz"){
    const id=f.dataset.id,lista=id==="prova"?PROVA:ETAPAS.find(e=>e.id===id).quiz,min=id==="prova"?6:2;
    const fd=new FormData(f),resp=lista.map((_,i)=>+fd.get("p"+i)),ac=resp.filter((r,i)=>r===lista[i].c).length,ok=ac>=min;
    S.res={resp,ac,ok,min};if(ok)await concluir(id,ac);render();
    document.querySelector(".resultado")?.scrollIntoView({block:"center"});
  }
});
boot();
</script>
</body>
</html>
