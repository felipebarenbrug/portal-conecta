const QUIZ_MELHOR=[
  q(`Ao comparar o melhoramento de forrageiras tropicais com o de grandes culturas como o milho, Dr. Ulisses Figueiredo traça um paralelo temporal e genético. Qual é a principal diferença destacada quanto ao tempo de domesticação e à base do avanço produtivo dessas culturas?`,[`O milho é domesticado há milhares de anos e obteve saltos expressivos com o vigor híbrido (heterose) nos últimos 100–120 anos, enquanto as forrageiras tropicais de valor econômico no Brasil são espécies não domesticadas de introdução recente.`,`As forrageiras tropicais foram domesticadas simultaneamente ao milho pelos povos pré-colombianos, mas careceram de investimentos em biotecnologia celular durante o século XX.`,`As forrageiras tropicais dispensam a heterose devido ao seu genoma diploide simples, ao passo que o milho exige poliploidização induzida para expressar ganho genético.`,`O milho avançou exclusivamente pela seleção massal de populações crioulas, enquanto as forrageiras tropicais desenvolveram linhagens puras endogâmicas desde o século XIX.`]),
  q(`As principais forrageiras tropicais cultivadas no Brasil (gêneros Brachiaria/Urochloa e Panicum/Megathyrsus) têm origem no continente africano. Qual pressão evolutiva histórica conferiu a essas plantas superioridade em suporte de carga e pisoteio em relação às forrageiras nativas brasileiras?`,[`Coevolução com grandes populações de grandes herbívoros (como bisões, zebras e outros mamíferos de grande porte), desenvolvendo tolerância ao pisoteio intenso e superpastejo.`,`Coevolução em solos vulcânicos hiperférteis e ausência de fogo natural.`,`Adaptação a climas temperados com geadas rigorosas que induziram dormência de gemas basais profundas.`,`Seleção artificial milenar por povos nômades pastores que selecionavam genótipos de alta digestibilidade.`]),
  q(`Por que espécies forrageiras nativas brasileiras, como as do gênero Paspalum (ex.: grama Batatais), apresentam limitações de capacidade de suporte quando submetidas a pastejo de alta densidade animal na pecuária moderna?`,[`Porque possuem sistema radicular pivotante que se rompe facilmente com qualquer carga animal superior a 0,5 UA/ha.`,`Porque não realizam fotossíntese do tipo C4, tornando-se fisiologicamente ineficientes sob o calor tropical do Cerrado.`,`Porque coevoluíram com mamíferos herbívoros nativos de médio porte (sendo a anta o maior deles) e em densidades populacionais reduzidas, não tendo pressão seletiva para tolerar pisoteio massivo.`,`Porque são espécies exclusivamente anuais que dependem de ressemeadura natural a cada estação chuvosa.`]),
  q(`A maioria do germoplasma base que deu sustentação aos programas de melhoramento de gramíneas forrageiras no Brasil chegou ao país a partir de qual marco histórico descrito pelo palestrante?`,[`Importações comerciais de sementes híbridas certificadas oriundas da Austrália na década de 1920.`,`Expedições botânicas patrocinadas por empresas multinacionais de biotecnologia na década de 2010.`,`Missões jesuíticas no século XVI que traziam sementes nas caravelas portuguesas.`,`Coletas sistemáticas de variabilidade natural realizadas no continente africano e centralizadas pelo CIAT na Colômbia, sendo posteriormente introduzidas no Brasil na década de 1980.`]),
  q(`Durante a apresentação, Dr. Ulisses cita atualizações taxonômicas que reclassificaram os principais gêneros de forrageiras tropicais. Assinale a correlação taxonômica atual correta citada pelo pesquisador:`,[`Urochloa foi extinta taxonomicamente, unificando todos os capins tropicais sob o gênero Andropogon.`,`Brachiaria passou a ser classificada como Cynodon; Panicum maximum foi alocado em Digitaria.`,`Brachiaria passou a ser denominada botanicamente como Urochloa; Panicum maximum passou a ser denominado Megathyrsus maximus.`,`Brachiaria foi renomeada para Pennisetum; Panicum maximum manteve-se inalterado.`]),
  q(`Nas décadas de 1960 e 1970, a ocupação das pastagens do Brasil Central ocorreu inicialmente com Brachiaria decumbens e Andropogon gayanus. O que caracterizou a onda subsequente de lançamentos a partir da década de 1980?`,[`O cruzamento controlado entre linhagens endogâmicas F10 de Urochloa ruziziensis.`,`O início imediato de programas de transgenia e edição gênica via CRISPR.`,`O lançamento de cultivares derivados da seleção massal sobre a variabilidade natural introduzida da África, destacando-se o cultivar Marandu.`,`A substituição total de gramíneas por consórcios exclusivos com leguminosas de clima temperado.`]),
  q(`Dr. Ulisses ressalta que o cultivar Marandu (lançado há mais de 40 anos) ainda ocupa uma extensão estimada de 40 a 50 milhões de hectares no Brasil. Qual é a principal implicação técnica e o risco agronômico dessa realidade?`,[`Incapacidade do Marandu de florescer e produzir sementes viáveis sob fotoperíodo curto.`,`Incompatibilidade com o ganho de peso em bovinos, inviabilizando qualquer sistema de terminação intensiva.`,`Esgotamento irreversível de micronutrientes do solo, pois o Marandu excreta aleloquímicos tóxicos ao milho.`,`Vulnerabilidade fitossanitária extrema, pois se uma praga ou doença devastadora quebrar a resistência do Marandu, cerca de 30% a 40% das pastagens do país podem ser dizimadas.`]),
  q(`Um dos maiores gargalos biológicos para o melhoramento de forrageiras tropicais reside no seu sistema reprodutivo. O que define a apomixia presente na maioria das espécies comerciais de braquiárias e pânicos?`,[`A união obrigatória de dois gametas haploides masculinos com uma oosfera estéril.`,`A autoesterilidade genética provocada pela incompatibilidade esporofítica entre estigma e pólen.`,`A reprodução assexuada via sementes na qual o embrião é formado por partenogênese, gerando uma progênie que é um clone genético exato da planta-mãe.`,`A propagação vegetativa exclusiva por estolões subterrâneos sem nenhuma emissão de inflorescência.`]),
  q(`Do ponto de vista prático do melhorista de forrageiras, o que acontece quando se tenta realizar o cruzamento artificial entre duas plantas que são exclusivamente apomíticas?`,[`Ocorre depressão por endogamia imediata, inviabilizando a germinação das sementes colhidas.`,`Não há recombinação gênica entre os genomas parentais, pois o embrião se forma por partenogênese a partir da mãe, impedindo a geração de nova variabilidade genética.`,`Gera-se uma superpopulação de triploides estéreis de alto valor forrageiro mas sem viabilidade comercial.`,`As plantas resultantes perdem a capacidade de tolerar o alumínio tóxico presente no solo.`]),
  q(`Para superar o impedimento reprodutivo da apomixia e viabilizar a recombinação gênica nos blocos de cruzamento da Barenbrug, qual estratégia biológica é estritamente obrigatória?`,[`Realizar a fusão de protoplastos em cultura de tecidos sob estresse osmótico contínuo.`,`Utilizar plantas com reprodução sexual como parentais femininos (receptoras de pólen) e cruzá-las com plantas apomíticas como parentais masculinos (doadores de pólen).`,`Utilizar apenas machos sexuais diploides e fêmeas apomíticas tetraploides em cruzamentos recíprocos.`,`Tratar as sementes apomíticas com radiação gama para induzir mutações pontuais que restaurem a meiose na oosfera.`]),
  q(`Diferente de culturas graníferas onde as sementes ficam presas na espiga ou vagem até a colheita, as forrageiras tropicais exibem deiscência acentuada. Quais impactos isso acarreta tanto no programa de melhoramento quanto na produção comercial de sementes?`,[`Exige colheita antes da antese floral, o que impede a fecundação e formação do cariopse.`,`Provoca dormência fisiológica permanente que só pode ser quebrada com choque térmico em autoclave.`,`A semente madura cai naturalmente no chão; no melhoramento exige envelopamento individual das inflorescências para colher os cruzamentos, e no campo comercial resulta em lotes colhidos com solo e baixa pureza inicial.`,`Impede a multiplicação de sementes no Brasil, exigindo importação anual de sementes dos Estados Unidos.`]),
  q(`Ao detalhar a arquitetura dos blocos de cruzamento no campo experimental da Barenbrug, Dr. Ulisses descreve a disposição espacial das plantas e o fluxo de pólen. Como esse bloco é estruturado?`,[`A planta fêmea (sexual) fica posicionada no centro do bloco, cercada por diversas linhas do parental macho (apomítico, doador de pólen), combinando polinização natural e manual.`,`Apenas uma planta macho apomítica fica no centro cercada por 50 fêmeas sexuais estéreis.`,`Linhas alternadas de plantas fêmeas e machos apomíticos espaçadas a 10 metros com barreira de eucalipto.`,`Todas as plantas são mantidas em estufas herméticas com liberação controlada de abelhas polinizadoras sem ferrão.`]),
  q(`À medida que a variabilidade natural direta dos bancos de germoplasma introduzidos da África se esgota, qual metodologia de melhoramento populacional passa a predominar nos programas avançados de forrageiras tropicais?`,[`Micropropagação meristemática em biorreatores de imersão temporária.`,`Produção de linhagens duplohaploides via cultura de anteras para obtenção de homozigose completa.`,`Seleção recorrente com recombinação periódica entre genótipos superiores e início do uso de seleção genômica ampla.`,`Retrocruzamentos sucessivos para fixação de um único gene de nanismo.`]),
  q(`De acordo com o cronograma detalhado do programa de desenvolvimento de cultivares da Barenbrug, quantos anos, no mínimo, são necessários desde os cruzamentos iniciais até o lançamento comercial do cultivar no mercado?`,[`8 anos.`,`No mínimo 12 anos.`,`5 a 6 anos.`,`3 a 4 anos.`]),
  q(`Qual é a principal distinção ressaltada pelo palestrante entre os ensaios de VCU (Valor de Cultivo e Uso) de espécies forrageiras e os de culturas convencionais de grãos (como soja e milho)?`,[`Em forrageiras o produto final avaliado não é o grão ou a semente, mas sim a produtividade animal (carne ou leite), exigindo ensaios com animais sob pastejo além do corte de massa.`,`Em grãos avalia-se apenas a biomassa vegetativa, enquanto em forrageiras avalia-se o índice de colheita de grãos.`,`Em forrageiras o VCU é dispensado pelo MAPA, bastando comprovar a germinação fisiológica das sementes.`,`Em forrageiras os ensaios duram apenas três meses em vasos de casa de vegetação sem repetição a campo.`]),
  q(`Dentro do programa da Barenbrug, quantas etapas e quantos anos de avaliações rigorosas são requeridos antes que a empresa esteja formalmente apta a solicitar o registro do cultivar no Ministério da Agricultura (MAPA)?`,[`Apenas 1 ano de ensaio em parcelas simples.`,`15 anos ininterruptos de ensaios sem necessidade de pastejo animal.`,`No mínimo 9 anos de avaliações, contemplando 2 anos de ensaios de VCU sob corte e 2 anos de ensaios sob pastejo.`,`Exatamente 5 anos de testes exclusivos em laboratório de biologia molecular.`]),
  q(`Após cumprir os 9 anos de avaliações e obter a aptidão ao registro no MAPA, o que o programa da Barenbrug realiza durante os 3 anos subsequentes antes do lançamento comercial?`,[`Submete o cultivar a novos ciclos de hibridação com espécies de gramíneas de clima temperado.`,`Armazena as sementes em câmara fria aguardando a concessão de patente internacional.`,`Interrompe todas as pesquisas de campo e inicia campanhas publicitárias em redes sociais.`,`Realiza testes a campo em escala de fazenda (áreas maiores com produtores parceiros), comparando com padrões de mercado e avaliando em sistemas integrados (ILP) e conservação de forragem.`]),
  q(`Dr. Ulisses apresentou o croqui de um ensaio de pastejo experimental representativo para teste de desempenho animal de novos genótipos. Qual é a dimensão típica desses ensaios e o tempo mínimo de condução?`,[`Piquetes de 100 m² conduzidos por 30 dias com ovinos estabulados.`,`Campos demonstrativos de 0,5 hectare sem animais, medidos exclusivamente com disco forrageiro.`,`Áreas experimentais de 16 a 20 hectares, com módulos de piquetes de 2 hectares por tratamento/repetição, conduzidos por no mínimo 2 anos completos.`,`Gaiolas de exclusão de 1 m² instaladas em pastagens nativas do Pantanal por 6 meses.`]),
  q(`Por que a Barenbrug conduz uma rede de ensaios regionais em parceria com universidades e produtores em biomas contrastantes (como o Sul do país, Cerrado e Amazônia)?`,[`Para comprovar que um único genótipo apresenta idêntica taxa de crescimento em qualquer solo sem adubação.`,`Para atender a exigências tributárias interestaduais de circulação de mudas vegetativas.`,`Para identificar a adaptabilidade e estabilidade genotípica dos novos clones em ambientes edafoclimáticos diversos (incluindo frio no Sul e calor/umidade na Amazônia), definindo o posicionamento técnico seguro.`,`Para testar se os genótipos conseguem se transformar espontaneamente em plantas anuais dependendo do fotoperíodo.`]),
  q(`A cigarrinha-das-pastagens é a principal praga dos pastos brasileiros. No protocolo de triagem da Barenbrug para avaliar o mecanismo de antibiose contra essa praga, como o ensaio é conduzido?`,[`Pulveriza-se extrato de folhas maceradas sobre ninfas adultas em placas de Petri por 24 horas.`,`Avalia-se a espessura da cutícula foliar através de microscopia eletrônica de varredura sem contato biológico com o inseto.`,`Coletam-se ovos da praga e incubam-se na base da planta; após 30 dias de desenvolvimento ninfal, quantifica-se a taxa de sobrevivência das ninfas para determinar resistência ou suscetibilidade.`,`Mede-se a emissão de compostos voláteis pelas folhas intactas quando iluminadas por radiação ultravioleta.`]),
  q(`Além do teste de antibiose em ninfas, a Barenbrug realiza o teste de dano causado por insetos adultos sugadores. Qual espécie de cigarrinha associada à cana-de-açúcar foi destacada no teste apresentado por atacar também as pastagens?`,[`Anticarsia gemmatalis.`,`Spodoptera frugiperda.`,`Dichelops melacanthus.`,`Mahanarva (como Mahanarva fimbriolata / spectabilis).`]),
  q(`Na fase de avaliação de famílias e indivíduos no campo experimental após a germinação das progênies recombinadas, quais caracteres fenotípicos chave são prioritariamente avaliados e selecionados?`,[`Exclusivamente a cor das anteras e o comprimento da arista da espigueta.`,`Porte da planta, vigor vegetativo, proporção folha:colmo, capacidade de perfilhamento e potencial de produção de sementes.`,`Capacidade de fixação simbiótica de nitrogênio nodular por bactérias Rhizobium.`,`Comprimento dos estolões flutuantes para uso em áreas alagadas marinhas.`]),
  q(`O cultivar Sabiá é fruto do programa de melhoramento genético da Barenbrug. A qual geração de cruzamento ele pertence e qual é o seu principal perfil agronômico e recomendação no campo?`,[`7ª geração de cruzamento; forrageira de ciclo anual indicada estritamente para pousio de inverno no Rio Grande do Sul.`,`4ª geração de cruzamento; planta muito rústica, de porte mais baixo, excelente perfilhamento, baixo risco e ampla adaptação a diferentes solos, com excelente retenção e acúmulo de forragem na seca.`,`Mutação espontânea irradiada; gramínea sem folhas indicada para controle de erosão em taludes de rodovias.`,`1ª geração de cruzamento; planta de porte gigante recomendada unicamente para corte mecanizado e silagem em áreas irrigadas.`]),
  q(`Nas fotos do ensaio de pastejo comparando o cultivar Sabiá com o Marandu durante a estação seca e início das águas, que diferença na estrutura do dossel forrageiro foi evidenciada por Dr. Ulisses?`,[`O Sabiá floresceu antecipadamente em maio, paralisando a produção de folhas durante toda a transição águas-seca.`,`O Marandu apresentou acúmulo excessivo de colmo fibroso e estrutura esbranquiçada/seca, enquanto o Sabiá manteve dossel mais verde, melhor estrutura foliar de fácil apreensão e rebrota superior no início das chuvas.`,`O Marandu manteve-se verde sem senescência, enquanto o Sabiá perdeu toda a parte aérea.`,`Ambos os cultivares apresentaram exatamente a mesma altura residual e relação colmo:folha idêntica.`]),
  q(`O cultivar Cayana representa o avanço genético de qual geração de cruzamentos da Barenbrug e qual advertência fundamental Dr. Ulisses enfatiza sobre seu manejo nutricional?`,[`5ª geração de cruzamento; tem altíssimo teto produtivo mas 'não é uma planta milagrosa', sendo altamente exigente em fertilidade e indicada para sistemas intensificados com adubação de manutenção.`,`6ª geração; dispensa correção do solo e tolera alagamento permanente de até 2 metros de lâmina d'água.`,`3ª geração; espécie com baixa resposta à adubação nitrogenada recomendada apenas para solos de restinga.`,`2ª geração; é uma planta que sobrevive em areia pura sem necessidade de calcário ou adubação fosfatada.`]),
  q(`Na média dos dois anos de avaliação oficial de VCU sob pastejo com animais em recria, qual foi o ganho em produtividade animal alcançado pelo cultivar Cayana em comparação com a testemunha Marandu?`,[`Produção de 8 arrobas a mais por hectare/ano (aumento de 42%), sendo 2 arrobas a mais no período seco e 6 arrobas a mais no período chuvoso.`,`Apenas 0,5 arroba a mais por hectare ao final de três anos de pastejo contínuo.`,`Aumento de 25 arrobas/ha exclusivamente no período de inverno sob irrigação por pivô.`,`Ganho idêntico ao Marandu na seca e perda de 1 arroba/ha nas águas.`]),
  q(`Nos testes de triagem e notas de dano apresentados por Dr. Ulisses envolvendo as espécies de cigarrinhas Notozulia entreriana e Mahanarva, qual foi a resposta observada para o cultivar Cayana?`,[`Mostrou tolerância intermediária a pulgões mas mortalidade severa sob ataque de ninfas de Notozulia.`,`Demonstrou atratividade aumentada às cigarrinhas, funcionando apenas como planta armadilha.`,`Apresentou notas de dano muito baixas, sendo caracterizado como genótipo resistente a ambas as espécies de cigarrinha, superando testemunhas tradicionais.`,`Classificou-se como altamente suscetível, exigindo até 5 aplicações de inseticida sistêmico por ano.`]),
  q(`Segundo o palestrante, 'de nada adiantaria gerar um cultivar superior se a empresa não entregasse um pacote tecnológico completo'. Quais parâmetros indispensáveis integram a recomendação agronômica gerada pela Barenbrug para cada novo material?`,[`Garantia contratual de chuva mínima durante o período de semeadura.`,`Somente o catálogo de cores e fotos comerciais das sementes.`,`Exclusivamente a indicação de quais agroquímicos dessecantes devem ser aplicados após o pastejo.`,`Hábito de crescimento, recomendação de fertilidade de solo, parâmetros nutricionais (PB e digestibilidade), taxa e profundidade de semeadura, e metas de manejo de pastejo (alturas de entrada e saída no rotacionado ou altura média no contínuo).`]),
  q(`Além da utilização em pastejo direto em fazendas de corte e leite, em quais outros sistemas produtivos modernos os novos cultivares da Barenbrug são testados e validados no campo?`,[`Integração Lavoura-Pecuária (ILP) consorciado com milho para formação de palhada e saúde do solo, e conservação de forragem na forma de pré-secado.`,`Florestamento puro para corte de madeira de lei em ciclos de 30 anos.`,`Substituição da cana-de-açúcar na produção de etanol de primeira geração em usinas sucroalcooleiras.`,`Consórcio com eucalipto em espaçamento adensado de 50 cm para supressão total da luz solar.`]),
  q(`No fechamento da palestra, Dr. Ulisses discute o impacto das tecnologias industriais de pós-colheita e tratamento de sementes. Em um ensaio de 18 meses com 7 cortes sucessivos, qual foi o incremento de biomassa decorrente exclusivamente do uso da tecnologia de sementes revestidas (com macro/micronutrientes e defensivos) em comparação à semente nua?`,[`Redução de produtividade devido ao peso da camada inerte de calcário do revestimento.`,`Ganho acumulado de aproximadamente 3 a 4 toneladas de matéria seca a mais por hectare ao longo dos 7 cortes.`,`Aumento modesto de 200 kg de matéria seca no primeiro corte, desaparecendo nos cortes subsequentes.`,`Não houve nenhuma diferença produtiva entre semente nua e semente revestida.`])
 ];
const QUIZ_QUALCAPIM=[
  q(`Cenário de Venda / Estudo de Caso: Durante uma visita a um pecuarista tradicional do Centro-Oeste, o cliente afirma: 'Meu pai sempre plantou Marandu desde os anos 80 e eu não vejo motivo para trocar de capim. O que funcionou por 40 anos vai continuar funcionando perfeitamente na minha fazenda.' Com base na evolução histórica das forrageiras no Brasil e nos riscos de mercado discutidos no treinamento, qual é o contra-argumento técnico-comercial mais sólido e preciso que o vendedor deve utilizar?`,[`A Brachiaria decumbens abriu o Cerrado nas décadas de 60/70, mas entrou em crise com surtos severos de cigarrinhas; o Marandu foi adotado justamente pela resistência à praga. No entanto, o melhoramento genético avançou nos últimos 15 anos trazendo cultivares híbridos com maior produção de matéria seca e folhas, enquanto o monocultivo de Marandu expõe a fazenda a riscos graves de morte e quebras forrageiras.`,`O Marandu é uma forrageira estéril de difícil propagação que só deve ser recomendada para consórcio exclusivo com milheto em áreas de ILP pós-safra.`,`O Marandu já perdeu totalmente seu registro oficial e foi banido das recomendações técnicas devido à sua incapacidade de produzir no período chuvoso em comparação ao cultivar Xaraés.`,`O Marandu foi lançado nos anos 80 pela Embrapa exclusivamente para substituir o Tanzânia em áreas de baixa fertilidade, não tendo nenhuma relação com controle de pragas ou solo de Cerrado.`]),
  q(`Cenário de Venda / Estudo de Caso: O vendedor está estruturando uma proposta de reforma de 400 hectares para um cliente que possui 100% da sua propriedade coberta com Brachiaria brizantha cv. Marandu. De acordo com os dados setoriais e os relatos de eventos climáticos recentes apresentados no vídeo, como o vendedor deve embasar a tese de DIVERSIFICAÇÃO forrageira?`,[`O monocultivo de Marandu só representa risco se a propriedade estiver localizada no bioma Sul, pois no Cerrado não há histórico de anomalias climáticas ou mortes de pastagens.`,`O Brasil possui cerca de 120 milhões de hectares de pastagens cultivadas e cerca de metade dessa área ainda é ocupada pelo Marandu; episódios como a seca severa recente no Triângulo Mineiro e Goiás provocaram morte em massa de braquiárias, deixando propriedades inteiras sem forragem, o que comprova que diversificar com novas opções genéticas é uma salvaguarda vital do patrimônio.`,`A área total de pastagens no Brasil cresceu mais de 50 milhões de hectares nos últimos 10 anos, gerando excesso de oferta de bezerros e exigindo capins com menor teor de proteína bruta para evitar intoxicação.`,`A diversificação é obrigatória por legislação ambiental federal, sob pena de perda de crédito agrícola caso o pecuarista mantenha mais de 30% da área com uma única espécie forrageira.`]),
  q(`Cenário de Venda / Estudo de Caso: Um produtor rural pergunta ao vendedor na revenda: 'Estou ouvindo falar de capim híbrido Sabiá, Cayana e Carcará. Isso é transgênico? O que significa ser um capim híbrido na prática?' Qual é a explicação técnica e comercial correta que o consultor de vendas deve apresentar para tranquilizar e valorizar o produto perante o cliente?`,[`São plantas transgênicas modificadas em laboratório com inserção de genes bacterianos para tolerância a glifosato e dessecação zero.`,`Híbridos são forrageiras anuais de ciclo curto que morrem após 120 dias, obrigando o produtor a realizar nova semeadura a cada safra.`,`Híbrido é o resultado do cruzamento entre dois indivíduos selecionados para combinar o melhor de características complementares (como produtividade, proporção de folhas e resistência). O Sabiá e o Cayana são híbridos interespecíficos (cruzamento entre espécies distintas de braquiária), enquanto o Carcará é um híbrido intraespecífico (cruzamento dentro da mesma espécie Megathyrsus maximus).`,`Híbrido significa apenas que as sementes foram tratadas com inseticida e fungicida industrial, não havendo qualquer alteração ou seleção genética entre plantas.`]),
  q(`Cenário de Venda / Estudo de Caso: Um cliente recebe uma recomendação técnica onde constam os nomes 'Urochloa' e 'Megathyrsus'. Ele liga irritado para o vendedor dizendo que pediu braquiária e pânico, e que o agrônomo recomendou espécies estranhas que ele desconhece. Como o vendedor deve conduzir a comunicação comercial para esclarecer a dúvida e fechar o pedido com segurança?`,[`Concordar com o cliente e cancelar o orçamento, explicando que Urochloa e Megathyrsus são ervas daninhas invasoras de difícil controle.`,`Informar que Megathyrsus é uma leguminosa fixadora de nitrogênio e Urochloa é uma gramínea de clima temperado importada da Europa.`,`Explicar didaticamente que se trata apenas da atualização da nomenclatura botânica científica: as tradicionais braquiárias agora são classificadas como Urochloa e os antigos pânicos (Panicum maximum) como Megathyrsus maximus; comercialmente e agronomicamente continuam sendo as mesmas forrageiras de alto valor, mantendo total confiabilidade.`,`Afirmar que a nomenclatura mudou porque essas plantas não aceitam pastejo direto, servindo unicamente para fenação industrial.`]),
  q(`Cenário de Venda / Estudo de Caso: O vendedor está negociando a reforma de pastagem com um recriador que avalia o investimento baseado estritamente na produtividade de carcaça gerada por hectare ao ano. Quais são os dados comparativos concretos de desempenho zootécnico (média de 2 anos com sal mineral) que o vendedor deve apresentar para comprovar a superioridade do Sabiá frente ao Marandu?`,[`O Sabiá apresenta ganho superior apenas se for mantido sob pastejo contínuo com carga animal fixa de 0,5 UA/ha durante todo o ano.`,`O Sabiá produz 20 arrobas a mais por hectare que o Marandu, mas exige obrigatoriamente suplementação concentrada de 2% do peso vivo para expressar qualquer ganho.`,`O Sabiá entrega exatamente a mesma quantidade de arrobas que o Marandu, diferenciando-se apenas pela cor verde mais escura da forragem.`,`O Sabiá produz 7 arrobas a mais por hectare/ano em relação ao Marandu na média dos ambientes avaliados em recria com sal mineral, fruto da seleção genética de maior acúmulo de matéria seca e elevada proporção de lâmina foliar.`]),
  q(`Cenário de Venda / Estudo de Caso: Um pecuarista relata: 'Na minha fazenda no inverno falta capim desesperadamente, e nas águas sobra capim passando do ponto.' Como o vendedor deve utilizar os percentuais de distribuição estacional de matéria seca apresentados por Ulisses Figueiredo para posicionar o Sabiá como ferramenta de nivelamento forrageiro?`,[`O Sabiá reduz a produção de seca a apenas 5%, sendo recomendado exclusivamente para fazendas que realizam confinamento total de inverno.`,`Tanto o Marandu quanto o Sabiá produzem exatamente 50% nas águas e 50% na seca, não havendo diferença estacional entre as cultivares.`,`O Marandu concentra 80% da sua produção anual nas águas e apenas 20% na seca, enquanto o Sabiá apresenta menor variação estacional, produzindo cerca de 65% a 70% nas águas e expressivos 30% a 35% na seca, garantindo maior estabilidade no período crítico.`,`O Sabiá produz 100% da sua forragem no período da seca e dorme no período das águas, invertendo o ciclo forrageiro tropical.`]),
  q(`Cenário de Venda / Estudo de Caso: O cliente deseja vedar (diferir) uma área de pasto no final das águas para que o gado pasteje durante o período seco, mas reclama que no Marandu diferido o pasto fica 'muito taludo, fibroso e sem folha'. Qual é a entrega técnica e o ganho em arrobas esperado ao posicionar o Sabiá para diferimento de pastagem?`,[`O diferimento de Sabiá resulta em 5 arrobas a mais por hectare na seca, mas o pasto morre após o pastejo e precisa ser ressemeado.`,`O Sabiá diferido produz até 1 tonelada a mais de matéria seca de folhas em comparação ao Marandu, projetando uma contribuição zootécnica de 0,5 a 0,8 arroba a mais por hectare no período seco devido à melhor estrutura de pastejo.`,`O Sabiá não aceita diferimento sob nenhuma hipótese, pois suas folhas caem espontaneamente ao menor sinal de estiagem.`,`O Sabiá diferido perde toda a proteína bruta, exigindo fornecimento de ração comercial a 3% do peso vivo no cocho.`]),
  q(`Cenário de Venda / Estudo de Caso: Um produtor de solo arenoso e sujeito a veranicos prolongados teme perder o investimento na formação do pasto por morte radicular ou queima durante estiagens. Com base nos dados de acúmulo de biomassa radicular apresentados na fonte, como o vendedor deve posicionar o Sabiá e o Cayana frente às cultivares tradicionais?`,[`As braquiárias híbridas produzem menos raízes que a Ruziziensis, pois concentram toda a energia na formação de sementes aéreas.`,`Enquanto a Brachiaria ruziziensis produz cerca de 4 t/ha de MS de raiz e o Marandu cerca de 6 t/ha, o Sabiá e o Cayana alcançam cerca de 8 toneladas de matéria seca de raiz por hectare (30% a 40% a mais que a Ruzi), conferindo maior agressividade, exploração profunda de água e nutrientes e reciclagem de matéria orgânica no solo.`,`O sistema radicular do Cayana e do Sabiá é pivotante profundo de 15 metros, idêntico ao da cultura do eucalipto, dispensando qualquer fertilidade de superfície.`,`A quantidade de matéria seca de raiz de todas as forrageiras tropicais é idêntica (fixada em 2 t/ha), independentemente da genética.`]),
  q(`Cenário de Venda / Estudo de Caso: O vendedor atende um pecuarista de recria que busca atingir índices de alta performance zootécnica e deseja comparar o ganho potencial do Cayana com o do Marandu. De acordo com as pesquisas de 2 anos avaliadas com animais de recria em pasto bem manejado e suplementados com sal mineral, qual é a resposta produtiva do Cayana?`,[`O Cayana entrega apenas ganho na seca, sem nenhuma resposta adicional durante o período chuvoso.`,`O Cayana entrega 8 arrobas a menos que o Marandu nas águas, compensando com 15 arrobas na seca.`,`O Cayana apresenta desempenho inferior ao Marandu quando suplementado apenas com sal mineral, exigindo creep-feeding obrigatório.`,`O Cayana entrega 8 arrobas a mais por hectare/ano em relação ao Marandu, sendo quase 2 arrobas a mais no período da seca e 6 arrobas a mais no período das águas.`]),
  q(`Cenário de Venda / Estudo de Caso: Um cliente com solo degradado, ácido, saturação por bases (V%) de 35% e teor de fósforo de 3 ppm quer comprar sementes de Cayana na ilusão de que 'o capim moderno vai milagrosamente resolver a fraqueza da terra'. Qual é a postura e recomendação técnica correta do vendedor consultivo para evitar frustração do cliente e insucesso comercial?`,[`Esclarecer que o Cayana é uma planta altamente produtiva e extrativa, que exige fertilidade de solo superior: saturação por bases (V%) mínima de 55% a 60% e fósforo acima de 7 a 8 ppm. Em um solo com V% de 35% e P de 3 ppm, o Cayana não expressará seu potencial; o correto é realizar calagem e fosfatagem prévias ou, se o cliente não puder investir tanto na correção de início, avaliar o Sabiá (que exige V% mínimo de 45% e P de 5 a 7 ppm).`,`Recomendar o plantio de Carcará sem adubação, pois os pânicos toleram acidez extrema melhor que as braquiárias.`,`Orientar o cliente a dobrar a taxa de semeadura do Cayana para compensar a baixa fertilidade química do solo.`,`Vender imediatamente o Cayana sem comentar sobre o solo, pois qualquer cultivar híbrido consegue produzir 30 arrobas/ha mesmo em solo degradado.`]),
  q(`Cenário de Venda / Estudo de Caso: Um produtor de grãos (soja/milho) no Mato Grosso ou Goiás decide integrar a pecuária na entressafra para fazer 'boi safrinha' em áreas com excelente histórico de adubação agrícola. Por que o Cayana é a indicação número um do consultor para esse cenário específico?`,[`Porque o Cayana é a única braquiária que não rebrota após o pastejo, facilitando a dessecação sem uso de herbicidas.`,`Porque o Cayana fixa nitrogênio atmosférico em simbiose direta com bactérias rizóbio, dispensando fertilizantes para a soja seguinte.`,`Porque o Cayana possui sementes comestíveis que podem ser colhidas pela colheitadeira de grãos antes da entrada do gado.`,`Porque por ser uma planta de alta exigência e altíssima capacidade de resposta, o Cayana responde com máxima eficiência ao residual fértil da lavoura ('terra de cultura'), entregando rápida formação de biomassa, alta taxa de lotação e excelente produção de arrobas no boi safrinha.`]),
  q(`Cenário de Venda / Estudo de Caso: Um cliente possui um pivô central voltado à recria intensiva de novilhas e deseja saber se compensa colocar Cayana ou Sabiá no lugar do Marandu sob irrigação contínua. Quais resultados apresentados no encontro comprovam o valor das novas forrageiras em sistemas irrigados?`,[`Sob irrigação, o Marandu produz mais que os híbridos porque não tolera lâmina de água excessiva.`,`O ganho de peso em pivô irrigado independe da genética da forrageira, sendo determinado exclusivamente pelo teor de cloro na água de irrigação.`,`A irrigação em pastagens tropicais é contraindicada no estudo porque provoca o apodrecimento instantâneo das raízes de braquiárias híbridas.`,`Em média de 2 anos no sistema irrigado, as novas forrageiras produziram cerca de 7 arrobas a mais que o Marandu; além disso, a produção é composta quase em sua totalidade por lâmina foliar (alto perfilhamento e grande área foliar), permitindo ganhos de peso individuais de 0,8 kg/dia apenas com sal mineral em ocupações de longa duração (ex.: 300 dias no pivô).`]),
  q(`Cenário de Venda / Estudo de Caso: Um produtor tradicional de leite ou engorda intensiva é fã fervoroso do cultivar Mombaça, mas está aberto a novidades desde que comprovadas em números de produção de carne por hectare. Qual é a entrega zootécnica comprovada do híbrido Carcará em relação ao Mombaça?`,[`Na seca, o Carcará mantém desempenho semelhante ao Mombaça; no entanto, no período das águas ele expressa superioridade e fecha o acumulado anual com 4 arrobas a mais por hectare (+20% em produção de carne) em animais de recria suplementados.`,`O Carcará produz exatamente o mesmo que o Mombaça em todas as estações do ano, sem qualquer ganho adicional de arrobas.`,`O Carcará apresenta 50% menos proteína bruta que o Mombaça, compensando apenas na resistência à geada severa.`,`O Carcará entrega 15 arrobas a mais na seca e zera a produção nas águas, invertendo o comportamento do Mombaça.`]),
  q(`Cenário de Venda / Estudo de Caso: O vendedor está qualificando um cliente interessado em comprar sementes de Carcará para uma área extensa de relevo acidentado e sem histórico de adubação. Quais são os critérios mandatórios de solo, adubação e manejo de pastejo que devem ser alinhados ANTES de fechar a venda de Carcará?`,[`O Carcará pode ser manejado com sobras altas de 1,5 metro de altura sem perder qualquer valor nutricional ou aceitabilidade animal.`,`O Carcará exige saturação por bases (V%) acima de 55-60%, mínimo de 8 a 10 ppm de fósforo e não aceita apenas adubação de manutenção: requer adubação de produção (mínimo de 150 a 200 kg de N/ha/ano), além de manejo de pastejo rigoroso e ágil, pois se o manejo atrasar, a planta passa do ponto (encanamento rápido).`,`O Carcará exige solo com V% de no máximo 30% e não tolera adubação nitrogenada acima de 20 kg de N/ha.`,`O Carcará é idêntico à braquiarinha (Decumbens) em exigência nutricional e pode ser semeado em solos arenosos esgotados sem qualquer correção.`]),
  q(`Cenário de Venda / Estudo de Caso: Um consultor técnico de vendas é desafiado por um cliente: 'Qual capim é melhor: Carcará ou Sabiá? Quero escolher um único capim para plantar na fazenda inteira.' Como o vendedor deve desarmar essa falsa dicotomia e propor um planejamento forrageiro complementar de alto impacto?`,[`Afirmar que a braquiária é sempre superior ao pânico em qualquer época do ano e eliminar completamente os pânicos do projeto.`,`Explicar que os pânicos devem ser plantados exclusivamente em morros pedregosos e as braquiárias somente em várzeas encharcadas.`,`Afirmar que misturar pânicos e braquiárias no mesmo planejamento forrageiro causa intoxicação alimentar no rebanho bovino.`,`Explicar que pânicos (como Carcará) e braquiárias (como Sabiá/Cayana) são espécies complementares: os pânicos concentram cerca de 90% da sua produção nas águas (excelentes para maximizar lotação e intensificação nas águas), enquanto braquiárias como o Sabiá produzem de 30% a 35% na seca (ideais para suporte, diferimento e transição). A 'casadinha' estratégica entre as duas espécies potencializa o sistema o ano todo.`]),
  q(`Cenário de Venda / Estudo de Caso: Um pecuarista de ciclo intensivo precisa produzir silagem de baixo custo e com menor risco agronômico na safrinha (semeadura de março em Guaíra/SP) para alimentar animais em semiconfinamento/confinamento. Quais foram os resultados práticos de produção de matéria seca e ponto de colheita obtidos no ensaio apresentado por Ulisses Figueiredo?`,[`Colhido em julho (rente ao solo com 25-27% de MS), o Cayana produziu 10 t de MS/ha contra 8 t da Ruziziensis (+2 t MS/ha); estendendo a colheita para setembro, o Cayana atingiu 15 t de MS/ha contra ~12 t da Ruzi, enquanto o milheto completou o ciclo precocemente, senesceu e perdeu produção.`,`O milheto superou todas as braquiárias em produção de massa e qualidade quando colhido aos 6 meses de ciclo.`,`A ensilagem de braquiárias híbridas gerou teor de matéria seca de apenas 5%, inviabilizando a fermentação anaeróbica.`,`A Ruziziensis produziu 25 toneladas de MS/ha em julho, superando todas as outras gramíneas e inviabilizando o Cayana.`]),
  q(`Cenário de Venda / Estudo de Caso: Ao ofertar sementes de Cayana para produção de volumoso conservado para 'sequestro' de animais, o cliente questiona: 'Silagem de capim compensa financeiramente frente à tradicional silagem de milho?' Qual é a comparação de custo do quilo de matéria seca apresentada no encontro para embasar essa venda?`,[`A silagem de braquiária é 100% gratuita para o produtor, pois o capim cresce sem necessidade de qualquer adubo, trator ou maquinário.`,`Os custos de ambas as silagens são rigorosamente iguais, fixados em R$ 1,20 por kg de matéria seca pela CONAB.`,`A silagem de milho custa em torno de R$ 0,05/kg MS, enquanto a silagem de braquiária custa R$ 0,80/kg MS.`,`Em levantamento prático citado no vídeo (região do Sul de Minas), enquanto a silagem de milho custava cerca de R$ 0,36 por kg de matéria seca, a silagem de braquiária ficou na casa de R$ 0,10 a R$ 0,11 por kg de matéria seca — uma forragem barata, de menor exigência e baixíssimo risco operacional.`]),
  q(`Cenário de Venda / Estudo de Caso: Um agricultor que faz integração com pecuária demonstra receio: 'Gosto de capim vigoroso, mas morro de medo de plantar um capim muito agressivo na safrinha e depois não conseguir dessecar na hora de plantar a soja no verão.' Qual é a orientação técnica correta que o consultor de vendas deve fornecer para garantir o sucesso na dessecação da braquiária híbrida?`,[`O produtor deve queimar o pasto com fogo na véspera do plantio da soja para eliminar qualquer vestígio de palha residual.`,`Recomenda-se plantar Carcará ou Mombaça no lugar de braquiária para palhada da soja, pois os pânicos não formam touceiras e são mais fáceis de dessecar.`,`Cayana e Sabiá são plantas muito agressivas e produtivas; se deixadas apenas para palhada sem pastejo e o produtor errar a janela ('timing') de dessecação com excesso de massa velha, pode ter problemas operacionais. Porém, quando se utiliza o 'boi safrinha' para rebaixar o pasto ('rapar'), a rebrota jovem pós-pastejo é dessecada com extrema facilidade para a semeadura da soja.`,`As braquiárias híbridas são imunes ao glifosato e só podem ser eliminadas por aração e gradagem pesada em profundidade de 50 cm.`]),
  q(`Cenário de Venda / Estudo de Caso: Um cliente pecuarista afirma: 'Vou comprar o capim híbrido porque o vendedor da concorrência disse que capim bom não precisa de adubo nunca mais depois que nasce.' Como o vendedor deve reeducar o cliente sobre a necessidade de adubação de manutenção para sustentar a longevidade e o investimento da pastagem?`,[`Afirmar que o nitrogênio prejudica o perfilhamento das braquiárias híbridas, devendo ser totalmente excluído da fazenda.`,`Orientar que adubação de manutenção só é necessária se o pasto for irrigado com água salobra.`,`Esclarecer que a margem da pecuária estreitou e pasto sem reposição tende a declinar em produção; para qualquer forrageira (Marandu, Sabiá ou Cayana), preconiza-se uma adubação anual de manutenção de 50 a 80 kg de N/ha/ano para manter a produtividade. Já para pânicos de alta extração como Carcará, a adubação é de produção (150 a 200 kg de N/ha/ano no mínimo).`,`Concordar com o cliente, pois as forrageiras modernas extraem nutrientes do ar e dispensam adubação por 20 anos consecutivos.`]),
  q(`Cenário de Venda / Estudo de Caso: Em uma dinâmica de encerramento do treinamento, o gerente comercial apresenta 3 perfis de clientes para o vendedor posicionar a cultivar correta: • Cliente 1: Pecuária de ciclo completo, solo de fertilidade média (V%=45-50%, P=6 ppm), busca estabilidade na seca, diferimento e segurança contra quebras forrageiras. • Cliente 2: Fazenda de grãos integrando boi safrinha ('terra de cultura', V% &gt; 60%, P &gt; 8 ppm), foco em máxima produção de arrobas e alta resposta na recria. • Cliente 3: Módulo rotacionado intensivo de águas, alta adubação nitrogenada (&gt;150 kg N/ha), busca substituir um piquete de Mombaça por uma opção mais produtiva. Qual é a combinação de posicionamento comercial PERFEITA e tecnicamente recomendada pelo treinamento para os Clientes 1, 2 e 3, respectivamente?`,[`Cliente 1: Carcará | Cliente 2: Marandu | Cliente 3: Sabiá`,`Cliente 1: Sabiá | Cliente 2: Cayana | Cliente 3: Carcará`,`Cliente 1: Cayana | Cliente 2: Carcará | Cliente 3: Brachiaria decumbens`,`Cliente 1: Marandu | Cliente 2: Sabiá | Cliente 3: Cayana`])
 ];
// Provas dos cursos dos programas (sem perguntas de prazo; gabarito só no banco; fora do ranking da Academia)
const QUIZ_CONECTA_RC=[
  q(`O que é o Conecta RC?`,[`Um programa de bonificação em sementes para o produtor rural que compra da Barenbrug.`,`Um programa de incentivo para representantes comerciais de campo, em que a comissão sobre híbridos sobe conforme o volume acumulado na safra.`,`Um sistema de salário fixo mensal para quem vende sementes Barenbrug.`,`Uma plataforma online em que o produtor compra direto da Barenbrug, sem representante.`]),
  q(`Quais produtos contam para definir o seu tier (faixa)?`,[`Todos os produtos da linha, convencionais e híbridos.`,`Apenas Sabiá e Cayana.`,`Sabiá, Cayana, Carcará e Cynodon.`,`Ruziziensis, azevéns e trevos.`]),
  q(`Como o tier é medido?`,[`Pelo volume em kg de híbridos acumulado na safra, somando vendas a produtor e a canal.`,`Pelo faturamento em R$ de todos os produtos no mês.`,`Pelo número de clientes ativos na carteira.`,`Pelo número de pedidos emitidos na safra.`]),
  q(`Um RC acumulou 7.200 kg de híbridos na safra. Em qual tier ele está?`,[`Blue (até 3.000 kg).`,`Yellow (3.001 a 6.000 kg).`,`Yellow Pro (6.001 a 9.000 kg).`,`Yellow Master (acima de 9.000 kg).`]),
  q(`Durante a safra, o que o RC recebe todo mês sobre as vendas de híbridos?`,[`A taxa do tier em que está naquele momento.`,`Nada: tudo é pago só no fechamento da safra.`,`A taxa do Yellow Master, adiantada.`,`O piso do Blue (10% produtor / 8% canal) sobre as notas pagas pelo cliente no mês, em qualquer tier.`]),
  q(`No fechamento da safra, a taxa do tier final é aplicada:`,[`Somente sobre os kg que passaram do limite da faixa, como no imposto de renda.`,`Sobre 100% do acumulado da safra, retroativamente (taxa "flat").`,`Somente sobre o último trimestre.`,`Somente sobre as vendas a produtor.`]),
  q(`Caso: um RC vendeu R$ 600 mil a produtores e R$ 400 mil a canais em híbridos e fechou em Yellow Master (15% produtor / 11% canal). Ele já recebeu R$ 92.000 no piso mensal. Quanto recebe de excedente no fechamento?`,[`R$ 42.000.`,`R$ 134.000.`,`R$ 92.000.`,`R$ 30.000.`]),
  q(`Um RC fecha a safra com 2.600 kg de híbridos. O que acontece?`,[`Ele devolve parte do que recebeu no piso.`,`Ele recebe o excedente do Yellow mesmo assim.`,`Ele perde a comissão do último mês.`,`Ele mantém o que recebeu no piso mensal e não há excedente; o RC nunca recebe menos que o piso.`]),
  q(`Sobre os produtos convencionais (incrustadas, grafitadas, azevéns, trevos, nuas), está correto afirmar:`,[`Contam kg para o tier, com peso menor.`,`São pagos só no fechamento da safra.`,`Não entram no tier e são pagos na própria nota, sem acerto no fim da safra.`,`Não geram comissão.`]),
  q(`Um RC vendeu R$ 50.000 de azevém a um produtor. Qual a comissão? (azevéns e trevos: 6% produtor / 5% canal)`,[`R$ 2.500.`,`R$ 3.000.`,`R$ 4.000.`,`R$ 5.000.`]),
  q(`O que a regra de exclusividade veda ao RC?`,[`Representar híbridos concorrentes das mesmas espécies (Sabiá, Cayana, Carcará, Cynodon) de marcas concorrentes.`,`Vender qualquer produto de outra marca.`,`Atender mais de um cliente na mesma cidade.`,`Vender híbridos para canais e distribuidores.`]),
  q(`Dois RCs Barenbrug atendem clientes na mesma cidade. Isso, por si só, é conflito de canal?`,[`Sim: quem cadastrou a cidade primeiro tem exclusividade.`,`Sim: sempre decide o Gerente Comercial.`,`Sim: vale quem tem o maior tier.`,`Não. Não há exclusividade territorial; a lista de municípios do contrato é descritiva, e a sobreposição não é conflito.`]),
  q(`Então, quando existe conflito de canal de fato?`,[`Quando outro RC já atendeu o mesmo cliente alguma vez.`,`Quando alguém vende em área dos distribuidores Yellow Master (Supera Agro, Duagro, Imperagro, Agrosanta, Juparanã).`,`Quando dois RCs estão no mesmo estado.`,`Quando o município tem mais de um RC cadastrado.`]),
  q(`Qual é o cadastro esperado de um RC novo para fechar contrato?`,[`Pessoa jurídica ME/EPP (não MEI), CNAE principal 4611-7/00 (secundário 4618-4/99), Simples Nacional Anexo III e registro ativo no CORE.`,`MEI, sem necessidade de CORE.`,`Pessoa física com vínculo CLT.`,`Qualquer CNPJ, sem exigência de CNAE ou CORE.`])
 ];
const QUIZ_CONECTA_RV=[

async function carregarCidades(uf){
  if(!uf||S.cidadesCache[uf]) return;
  S.cidadesCache[uf]="__LOADING__";
  try{
    const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
    const j=await r.json();S.cidadesCache[uf]=j.map(x=>x.nome);
  }catch(e){ S.cidadesCache[uf]="__ERRO__"; }
}

}

/* ---------- sessão: expiração por inatividade / tempo ---------- */
const SESSAO_INATIV_MIN=30, SESSAO_MAX_H=12;
function marcarAtividade(){try{localStorage.setItem("pc_lastact",String(Date.now()));}catch(e){}}
function sessaoExpirada(){try{
  const la=+localStorage.getItem("pc_lastact")||0, ss=+localStorage.getItem("pc_sessstart")||0, n=Date.now();
  if(ss&&n-ss>SESSAO_MAX_H*3600000)return"tempo";
  if(la&&n-la>SESSAO_INATIV_MIN*60000)return"inativ";
}catch(e){}return null;}
function iniciarSessao(){try{const n=String(Date.now());localStorage.setItem("pc_sessstart",n);localStorage.setItem("pc_lastact",n);}catch(e){}}
async function expirarSessao(motivo){
  try{await sb.auth.signOut();}catch(e){}
  try{localStorage.removeItem("pc_lastact");localStorage.removeItem("pc_sessstart");}catch(e){}
  S.user=null;S.profile=null;S.perfil=null;S.secao=null;S.pag="hub";S.tour=null;
  S._erro=motivo==="tempo"?"Sua sessão expirou por tempo de conexão. Entre de novo.":"Sua sessão expirou por inatividade. Entre de novo.";
  render();
}
let _wdog=null;
function iniciarWatchdog(){
  marcarAtividade();
  if(!window._pcAtiv){window._pcAtiv=1;["click","keydown","scroll","mousemove","touchstart"].forEach(ev=>document.addEventListener(ev,marcarAtividade,{passive:true}));}
  if(_wdog)clearInterval(_wdog);
  _wdog=setInterval(()=>{const m=sessaoExpirada();if(m&&S.user)expirarSessao(m);},60000);
}

const RANK_FORA=/^\s*mayane\b/i;
async function carregarRanking(){try{const {data}=await sb.from("rc_ranking").select("*").order("kg",{ascending:false});const M={};(data||[]).filter(r=>!RANK_FORA.test(r.crm||"")&&!RANK_FORA.test(r.nome||"")).forEach(r=>{const k=repCanon(r.crm);const x=M[k]||(M[k]={crm:k,nome:repCanon(r.nome)||k,fat:0,aFat:0,kg:0,cFat:0,cAFat:0,cKg:0,em:null});
      x.fat+=+r.fat||0;x.aFat+=+r.a_fat||0;x.kg+=+r.kg||0;x.cFat+=+r.conv_fat||0;x.cAFat+=+r.conv_afat||0;x.cKg+=+r.conv_kg||0;if(r.atualizado_em&&(!x.em||r.atualizado_em>x.em))x.em=r.atualizado_em;});
    RC_RANKING=Object.values(M).sort((a,b)=>b.kg-a.kg);}catch(e){RC_RANKING=[];}}
async function carregarUsuario(u){
  S.user=u;sb=sbReal;S.demo=false;
  let prof=null,profErr=null;
  for(let t=0;t<4;t++){
    if(t){await new Promise(r=>setTimeout(r,600*t));try{await sb.auth.refreshSession();}catch(e){}}
    const r=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
    profErr=r.error;prof=r.data;if(prof||!profErr)break;
  }
  if(!prof&&!profErr){
    await sb.from("profiles").insert({id:u.id,nome:(u.email||"").split("@")[0],email:u.email});
    ({data:prof}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle());
  }
  if(!prof){S.user=null;S.profile=null;S.perfil=null;try{await sbReal.auth.signOut();}catch(e){}S._erro="Não conseguimos carregar o seu perfil agora. Entre de novo; se continuar, fale com o Marketing Barenbrug.";render();return;}
  if(prof&&prof.ativo===false){try{await sbReal.auth.signOut();}catch(e){}S.user=null;S.profile=null;S._erro="Seu acesso está desativado. Fale com o administrador do portal.";render();return;}
  S.profile=prof;S.perfil=prof.perfil||"RC";aplicaPerfis(prof);S.form=null;S.formAlvo="form";
  if(S.profile.demo){
    try{
      if(!window.demoIniciar)await new Promise((ok,er)=>{const sc=document.createElement("script");sc.src="demo.js?v="+APP_VER;sc.onload=ok;sc.onerror=er;document.head.appendChild(sc);});
      sb=await window.demoIniciar(sbReal,S);S.demo=true;window.demoVer(S,"Administrador");await window.demoCarregar(S);
    }catch(e){sb=sbReal;S.demo=false;S.demoFalhou=true;}
  }
  const {data:prog}=await sb.from("progresso").select("etapa,nota").eq("user_id",u.id);
  S.feitas=(prog||[]).map(r=>r.etapa);
  S.notas={};(prog||[]).forEach(r=>S.notas[r.etapa]=r.nota);
  try{
    const agora=new Date().toISOString();const patch={ultimo_acesso:agora};
    if(!S.profile.acesso_desde){patch.acesso_desde=agora;S.profile.acesso_desde=agora;}
    sb.from("profiles").update(patch).eq("id",u.id).then(()=>{},()=>{});
    S.profile.ultimo_acesso=agora;
  }catch(e){}
  await carregarRanking();
  S.secao=null;S.pag="hub";
}

    return `<div>${lbl}<select id="f_${c.k}" data-fk="${c.k}" ${dis} ${c.req?"required":""}>${inner}</select></div>`;

async function enviarFoto(file){
  if(!file||!/^image\//.test(file.type)){aviso("Escolha um arquivo de imagem.");return;}
  try{
    const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(file);});
    const L=Math.min(img.naturalWidth,img.naturalHeight),cv=document.createElement("canvas");cv.width=cv.height=320;
    cv.getContext("2d").drawImage(img,(img.naturalWidth-L)/2,(img.naturalHeight-L)/2,L,L,0,0,320,320);
    const blob=await new Promise(ok=>cv.toBlob(ok,"image/jpeg",.85));
    const caminho=S.user.id+"/foto-"+Date.now()+".jpg";
    const up=await sb.storage.from("avatares").upload(caminho,blob,{contentType:"image/jpeg"});
    if(up.error){aviso("Não foi possível enviar a foto.");return;}
    const url=sb.storage.from("avatares").getPublicUrl(caminho).data.publicUrl;
    const {error}=await sb.from("profiles").update({foto_url:url}).eq("id",S.user.id);
    if(error){aviso("A foto subiu, mas não foi possível gravar no seu perfil.");return;}
    S.profile.foto_url=url;S.dir=S.dir||{};S.dir[S.user.id]={...(S.dir[S.user.id]||{id:S.user.id,nome:S.profile.nome,perfil:S.perfil}),foto_url:url};render();aviso("Foto atualizada.");
  }catch(e){aviso("Não foi possível ler esta imagem.");}
}

function classificaMkt(rel){

  const sem=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();const t=sem(topo);const caminho=sem(rel);
  let secao="posts",tema="Institucional";

  else if(t==="banners"||t==="placa de campo"||/banner roll up|outdoor/.test(caminho)){secao="banners";tema=null;}

}

function vFaq(){
  if(S.faq===undefined)return `<div class="carregando">Carregando as perguntas…</div>`;

  const cults=Object.keys(S.faq);const c=cults.includes(S.faqCult)?S.faqCult:cults[0];const busca=(S.faqBusca||"").trim();
  const nz=t=>String(t).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"");const b=nz(busca);
  const alvo=b?cults:[c];let achadas=0;
  const corpo=alvo.map(k=>{const blocos=S.faq[k].map(bl=>{const qs=bl.q.filter(([p,r])=>!b||nz(p).includes(b)||nz(r).includes(b));if(!qs.length)return "";achadas+=qs.length;
      return `<section class="bloco"><div><h2 class="sec">${b?esc(k)+" · ":""}${esc(bl.t)}</h2>${bl.d?`<p class="sub" style="margin:4px 0 0">${esc(bl.d)}</p>`:""}</div>${qs.map(([p,r])=>`<details class="faq-item" ${b&&qs.length<=3?"open":""}><summary>${esc(p)}</summary><p style="white-space:pre-wrap;color:var(--preto)">${esc(r)}</p></details>`).join("")}</section>`;}).join("");return blocos;}).join("");

  ${b?`<p class="sub" style="margin:0">${achadas} ${achadas===1?"pergunta encontrada":"perguntas encontradas"} para "${esc(busca)}" nas três cultivares. <button class="link" data-a="faq-limpar">Limpar busca</button></p>`:`<div class="filtros">${cults.map(k=>`<button class="chip" data-a="faq-cult" data-v="${esc(k)}" aria-pressed="${c===k}">${esc(k)}</button>`).join("")}</div>`}

const RENT_SAFRAS=4;
function rentEstado(){if(!S.rent)S.rent={c:"cayana",v:{area:"100",lot:"1,5",dias:"730",peso:"18",pa:"320",ph:"45",pc:"15",th:"10",tc:"10"},res:null};return S.rent;}
function rentConta(c,v){
  const n=k=>{const x=parseFloat(String(v[k]==null?"":v[k]).replace(/\./g,"").replace(",","."));return isFinite(x)&&x>0?x:0;};
  const C=RENT_CULT[c],area=n("area"),lot=n("lot"),dias=n("dias"),peso=n("peso"),pa=n("pa"),ph=n("ph"),pc=n("pc"),th=n("th"),tc=n("tc"),custo=n("custo");
  if(!lot||!dias||!peso||!pa)return null;
  const anos=dias/365,lotH=lot*C.m,prodC=lot*peso/anos,prodH=lotH*peso/anos,recC=prodC*pa,recH=prodH*pa;
  const semC=tc*pc/RENT_SAFRAS,semH=th*ph/RENT_SAFRAS,extraHa=(recH-semH)-(recC-semC);
  const invExtra=th*ph-tc*pc,ganhoRec=recH-recC;
  return {C,area,lot,lotH,prodC,prodH,recC,recH,semC,semH,extraHa,extraArea:extraHa*area,invExtra,ganhoRec,
    pctSem:custo&&prodH?semH/(prodH*custo):0,pctSemC:custo&&prodC?semC/(prodC*custo):0,
    retorno:invExtra>0?ganhoRec*RENT_SAFRAS/invExtra:0,payback:invExtra>0&&ganhoRec>0?invExtra/(ganhoRec/12):0,custo,pa};
}

function vBase(){
  const b=S.busca.toLowerCase();
  const txtPlano=s=>String(s).replace(/<[^>]+>/g,"").toLowerCase();
  const mats=MATERIAIS.filter(x=>(S.fCult==="Todos"||x.c===S.fCult)&&(S.fTipo==="Todos"||x.tipo===S.fTipo)&&txtPlano(x.n).includes(b));
  const vidsG=VIDEOS_BASE.filter(x=>x.g!=="Caso de sucesso"&&(S.fCult==="Todos"||x.c===S.fCult)&&(S.fTipo==="Todos"||S.fTipo==="Vídeo")&&txtPlano(x.t).includes(b));
  const casos=VIDEOS_BASE.filter(x=>x.g==="Caso de sucesso"&&(S.fCult==="Todos"||S.fCult==="Geral")&&(S.fTipo==="Todos"||S.fTipo==="Vídeo")&&txtPlano(x.t).includes(b));
  const vatual=S.baseVideo?VIDEOS_BASE.find(x=>x.yt===S.baseVideo):null;
  const chips=(a,sel,act)=>a.map(x=>`<button class="chip" data-a="${act}" data-v="${x}" aria-pressed="${sel===x}">${x}</button>`).join("");
  const mostraMat=S.fTipo==="Todos"||["Apostila","Podcast"].includes(S.fTipo);
  const mostraVid=S.fTipo==="Todos"||S.fTipo==="Vídeo";
  const vidRow=x=>`<div class="linha ${x.yt===S.baseVideo?"ativa":""}"><div><strong>${x.t}</strong><span class="meta">${x.c} · Vídeo</span></div><button class="link" data-a="bvideo" data-v="${x.yt}">${x.yt===S.baseVideo?"Assistindo":"Assistir"}</button></div>`;

  <div class="filtros">${chips(["Todos","Vídeo","Apostila","Podcast"],S.fTipo,"ftipo")}</div>
  ${vatual?`<section class="bloco"><div class="video-wrap"><iframe src="https://www.youtube.com/embed/${vatual.yt}?rel=0" title="${esc(vatual.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div></section>`:""}
  ${mostraVid&&casos.length?`<section class="bloco"><h2 class="sec">Cases de Sucesso</h2><p class="sub" style="margin:0 0 10px">Produtores reais contando o resultado dos híbridos Barenbrug no campo. Toque para assistir.</p><div class="casos-grid">${casos.map(casoCard).join("")}</div></section>`:""}
  ${mostraVid?`<section class="bloco"><h2 class="sec">Vídeos</h2>${vidHTML}</section>`:""}
  ${mostraMat?`<section class="bloco"><h2 class="sec">Materiais</h2>

async function carregarEquipe(){
  const {data:profs}=await sb.from("profiles").select("id,nome,email,perfil,telefone,ultimo_acesso,canal_id");
  try{const {data:cl}=await sb.from("canais").select("id,nome,tier").order("nome");S.canaisLista=cl||[];}catch(e){S.canaisLista=[];}
  const {data:prog}=await sb.from("progresso").select("user_id,etapa,nota,concluido_em");
  const porUser={},quando={};(prog||[]).forEach(r=>{(porUser[r.user_id]=porUser[r.user_id]||{})[r.etapa]=r.nota;(quando[r.user_id]=quando[r.user_id]||{})[r.etapa]=r.concluido_em;});
  S.progPorUser=porUser;
  // pontos do ranking: 10 por acerto em prova aprovada + 20 se aprovado na primeira tentativa
  let tent=[];try{const {data:tt}=await sb.from("prova_tentativas").select("user_id,prova,aprovado,criado_em").eq("aprovado",false);tent=tt||[];}catch(e){}
  const falhou=(u,id)=>tent.some(t=>t.user_id===u&&t.prova===id&&(!quando[u]||!quando[u][id]||t.criado_em<quando[u][id]));
  S.pontosPorUser={};Object.entries(porUser).forEach(([u,rs])=>{const o={};ETAPAS_ATIVAS.forEach(id=>{if(rs[id]!=null)o[id]=rs[id]*10+(falhou(u,id)?0:20);});S.pontosPorUser[u]=o;});
  try{const {data:so}=await sb.from("solicitacoes_acesso").select("*").eq("status","Pendente").order("criado_em",{ascending:true});S.solic=so||[];}catch(e){S.solic=[];}
  try{const {data:cd}=await sb.from("crm_painel").select("dono").order("dono");S.crmDonos=(cd||[]).map(x=>x.dono);}catch(e){S.crmDonos=[];}
  S.equipe=(profs||[]).map(p=>{
    const rs=porUser[p.id]||{};
    const feitasAtivas=ETAPAS_ATIVAS.filter(id=>rs[id]!=null);
    let soma=0; feitasAtivas.forEach(id=>soma+=(rs[id]/totalQ(id))*100);
    const conhecimento=feitasAtivas.length?Math.round(soma/feitasAtivas.length):null;
    const cult={};ETAPAS_ATIVAS.forEach(id=>{cult[id]=rs[id]!=null?Math.round(rs[id]/totalQ(id)*100):null;});
    return {id:p.id,nome:p.nome||p.email,email:p.email,telefone:p.telefone,perfil:p.perfil,ultimo_acesso:p.ultimo_acesso,canal_id:p.canal_id||null,
            feitas:feitasAtivas.length, conhecimento, cult, pontos:Object.values((S.pontosPorUser||{})[p.id]||{}).reduce((a,v)=>a+v,0)};
  }).sort((a,b)=> (b.feitas-a.feitas) || ((b.conhecimento||0)-(a.conhecimento||0)) || a.nome.localeCompare(b.nome));
}

/* ---------- Ranking da Academia ---------- */
const RANK_FALTA=e=>/PGRST202|Could not find the function|does not exist/i.test(String((e&&(e.code+" "+e.message))||e||""));
async function carregarRankAcad(f){
  S.rank=S.rank||{};if(S.rank["_busy_"+f])return;S.rank["_busy_"+f]=true;
  try{const {data,error}=await sb.rpc("ranking_academia",{p_filtro:f});
    if(error){if(RANK_FALTA(error))S.rankOff=true;S.rank[f]={erro:true};}
    else if(data&&typeof data==="object"&&Array.isArray(data.top)){S.rank[f]=data;S.rankOff=false;}
    else{S.rankOff=true;S.rank[f]={erro:true};}
  }catch(e){S.rank[f]={erro:true};}
  S.rank["_busy_"+f]=false;
}
const rankFiltro=()=>S.rankF||"geral";
const rankIni=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function rankLinha(x,eu){
  const med=x.pos<=3?` med${x.pos}`:"";
  return `<li class="rk-l${eu?" eu":""}"><span class="rk-pos${med}" aria-label="Posição ${x.pos}">${x.pos}º</span><span class="rk-av" aria-hidden="true">${esc(rankIni(x.nome))}</span>
    <span class="rk-nome"><strong>${esc(x.nome||"Participante")}${eu?" · você":""}</strong><span class="meta">${esc([x.perfil,x.uf].filter(Boolean).join(" · "))}${x.selos&&x.selos.length?" · "+esc(x.selos.join(", ")):""}</span></span>
    <span class="rk-pts"><strong>${(Number(x.pontos)||0).toLocaleString("pt-BR")}</strong><span class="meta">pontos</span></span></li>`;
}
function vRanking(){
  const f=rankFiltro(),R=S.rank&&S.rank[f];

  if(R.erro)return `<div><h2 class="sec">Ranking da Academia</h2></div><div class="vazio">${S.rankOff?"O ranking abre em breve.":"Não foi possível carregar o ranking agora."}</div>`;
  const provas=Array.isArray(R.provas)?R.provas:[];

  const eu=R.eu||null,top=R.top||[];const naLista=eu&&top.some(x=>x.eu);

  <div class="filtros" role="group" aria-label="Escolha o ranking">${chips.map(([k,t])=>`<button class="chip" data-a="rank-f" data-v="${esc(k)}" aria-pressed="${k===f}">${esc(t)}</button>`).join("")}</div>
  <section class="rk-eu">${eu&&eu.pos?`<span class="rot">Sua posição</span><strong>${eu.pos}º de ${R.total}</strong><span>${(Number(eu.pontos)||0).toLocaleString("pt-BR")} pontos${eu.provas!=null?" · "+eu.provas+(eu.provas===1?" prova":" provas"):""}</span>`
    :`<span class="rot">Sua posição</span><strong>Ainda sem pontos</strong><span>${f==="geral"?"Conclua uma prova da trilha para entrar no ranking.":"Conclua esta prova para entrar neste ranking."}</span>`}
    ${R.meus_selos&&R.meus_selos.length?`<div class="rk-selos">${R.meus_selos.map(s=>`<span class="selo">${esc(s)}</span>`).join("")}</div>`:""}</section>

function rankMini(){
  if(S.rankOff)return "";const R=S.rank&&S.rank.geral;

async function carregarIntAud(){
  if(S.intAudBusy)return;S.intAudBusy=true;
  try{const [a,b,c]=await Promise.all([sb.from("canal_auditoria").select("*"),sb.from("concorrente_precos").select("*").order("marca"),sb.from("concorrente_cond").select("*")]);
    S.intAud={cond:a.data||[],conc:b.data||[],concCond:c.data||[]};}catch(e){S.intAud={cond:[],conc:[],concCond:[]};}
  S.intAudBusy=false;
}

const audVar=(a,b)=>a&&b?(b/a-1):null;
const audVarTxt=v=>v==null?"—":`<span style="color:${v<=-0.1?"var(--vermelho)":v>=0.1?"var(--verde,#1b7f3b)":"inherit"}">${v>0?"+":""}${(v*100).toLocaleString("pt-BR",{maximumFractionDigits:0})}%</span>`;

    ${evRows.map(([k,o])=>`<tr><td><strong>${esc(k)}</strong></td>${CU.map(cu=>{const a=o[cu+"|1"],b=o[cu+"|3"];return `<td class="val">${a?fmtR(a):"—"} → ${b?fmtR(b):"—"}<br>${audVarTxt(audVar(a,b))}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="precos-nota">Vermelho: queda de 10% ou mais. Verde: alta de 10% ou mais.</p></section>`:""}
  ${conds.length?`<section class="bloco"><h2 class="sec">Condições comerciais e margem · 3ª rodada</h2><div class="tab"><table class="sim-t fin-t"><thead><tr><th>Revenda</th><th>Cartão</th><th>A prazo</th><th>Frete</th><th>Linha cotada</th><th class="val">Margem Sabiá</th><th class="val">Cayana</th><th class="val">Carcará</th></tr></thead><tbody>
    ${conds.map(x=>{const m=x.margem||{};return `<tr><td><strong>${esc(x.canal)}</strong></td><td>${esc(x.cartao||"—")}</td><td>${esc(x.prazo||"—")}</td><td>${esc(x.frete||"—")}</td><td>${esc(x.linha||"—")}</td><td class="val">${pct(m["Sabiá"])}</td><td class="val">${pct(m["Cayana"])}</td><td class="val">${pct(m["Carcará"])}</td></tr>`;}).join("")}</tbody></table></div>

  ${notas.length?`<section class="bloco"><h2 class="sec">Observações de campo</h2><div class="aud-notas">${notas.map(x=>`<div class="aud-nota ${x.nota_tipo==="Atenção"?"at":x.nota_tipo==="Destaque"?"de":""}"><span class="selo">${esc(x.nota_tipo||"")}</span><strong>${esc(x.canal)}</strong><p>${esc(x.nota)}</p></div>`).join("")}</div></section>`:""}`;

function vBrindes(){
  if(S.pag==="brindes-reqs")return vBdReqs();
  if(S.pag==="brindes-pedir")return vBdPedir();
  if(S.pag==="brindes-item"&&ehMkt())return vBdItem();
  if(S.pag==="brindes-painel"&&ehMkt())return vBdPainel();
  if(S.pag==="brindes-emp"&&ehMkt())return vBdEmp();
  if(S.pag==="brindes-emp-novo"&&ehMkt())return vBdEmpNovo();
  return vBdCatalogo();
}

const fmtTam=n=>{n=Number(n)||0;return n>=1048576?(n/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(n/1024))+" KB";};
const pgdUrl=p=>{if(!p)return "";S.pgdUrls=S.pgdUrls||{};const u=S.pgdUrls[p];if(u&&u.exp>Date.now())return u.url;
  S.pgdFila=S.pgdFila||new Set();S.pgdFila.add(p);clearTimeout(S.pgdT);S.pgdT=setTimeout(pgdFlush,40);return "";};
async function pgdFlush(){const f=[...(S.pgdFila||[])];S.pgdFila=new Set();if(!f.length)return;S.pgdUrls=S.pgdUrls||{};
  f.forEach(p=>{S.pgdUrls[p]={url:"",exp:Date.now()+300e3};});
  try{const {data}=await sb.storage.from("pgd").createSignedUrls(f,3600);(Array.isArray(data)?data:[]).forEach(x=>{if(x&&x.signedUrl&&x.path)S.pgdUrls[x.path]={url:x.signedUrl,exp:Date.now()+3300e3};});}catch(e){}

function vAcaoArquivos(a,emb){

      ${pode?`<div class="pgd-capa-acoes"><label class="btn sec pgd-up">${a.foto_path?"Trocar foto de capa":"Enviar foto de capa"}<input type="file" accept="image/jpeg,image/png,image/webp" data-pgd="capa" data-v="${esc(a.id)}"></label>${a.foto_path?del(a.foto_path):""}<span class="meta">JPG, PNG ou WEBP. Aparece no cartão da ação.</span></div>`:""}

      +links.map(x=>`<div class="anexo-item"><div class="pgd-doc"><span class="selo">Link</span> <a class="link" href="${esc(urlOk(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.nome||x.url)}</a></div>${adm?`<button type="button" class="link perigo" data-a="delanexo" data-v="${x.i}">remover</button>`:""}</div>`).join(""):`<span class="meta">Nenhum documento enviado.</span>`}</div>
    ${pode?`<div class="pgd-envio"><div><label for="pgd_tipo_${esc(a.id)}">Tipo de documento</label><select id="pgd_tipo_${esc(a.id)}">${PGD_TIPOS.map(t=>`<option>${t}</option>`).join("")}</select></div><label class="btn pgd-up">Escolher arquivos<input type="file" multiple accept="${PGD_ACEITA}" data-pgd="doc" data-v="${esc(a.id)}"></label></div>

const pgdAcao=id=>Object.values(S.acoesCanal||{}).flat().find(x=>String(x.id)===String(id));
document.addEventListener("change",async ev=>{
  const inp=ev.target&&ev.target.closest?ev.target.closest("input[data-pgd]"):null;if(!inp)return;
  const files=[...(inp.files||[])];if(!files.length)return;
  const a=pgdAcao(inp.dataset.v);if(!a){aviso("Ação não encontrada. Recarregue a página.");return;}
  const capa=inp.dataset.pgd==="capa";const sel=document.getElementById("pgd_tipo_"+a.id);const tipo=capa?"Foto de capa":(sel?sel.value:"Outro");
  inp.disabled=true;let ok=0;
  for(const f of (capa?files.slice(0,1):files)){
    const xml=/\.xml$/i.test(f.name),ct=f.type||(xml?"application/xml":"");
    if(f.size>15*1048576){aviso(`"${f.name}" passa de 15 MB.`);continue;}
    if(!PGD_MIMES.includes(ct)||(capa&&!/^image\//.test(ct))){aviso(`Tipo de arquivo não aceito: ${f.name}`);continue;}
    const limpo=f.name.normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").slice(-80)||"arquivo";
    const path=`${a.canal_id}/${a.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}-${limpo}`;
    aviso(`Enviando ${f.name}…`);
    try{
      const up=await sb.storage.from("pgd").upload(path,f,{contentType:ct,upsert:false});
      if(up.error)throw up.error;
      const r=await sb.rpc("pgd_anexar",{p_acao:String(a.id),p_path:path,p_nome:f.name.slice(0,120),p_tipo:tipo,p_tam:f.size,p_capa:capa});
      if(r.error){await sb.storage.from("pgd").remove([path]);throw r.error;}
      if(capa&&typeof r.data==="string"&&r.data)await sb.storage.from("pgd").remove([r.data]);
      ok++;
    }catch(e){aviso(`Não foi possível enviar ${f.name}.`);}
  }
  inp.value="";inp.disabled=false;
  if(ok){S.canais=null;render();aviso(capa?"Foto de capa salva.":ok===1?"Documento salvo.":`${ok} documentos salvos.`);}
});
