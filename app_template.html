  if(f.id==="f-usuario"){
    const perfil=S.adminForm.perfil;const schema=schemaDoPerfil(perfil);
    if(schema.some(c=>c.req&&!((S.adminForm[c.k]||"").trim()))){S._erro="Preencha todos os campos obrigatórios (*).";render();window.scrollTo(0,0);return;}
    const dados={perfil};schema.forEach(c=>{if(c.t!=="email_fixo")dados[c.k]=(S.adminForm[c.k]||"").trim();});
    dados.acessos=[...f.querySelectorAll("[data-acesso]:checked")].map(c=>c.getAttribute("data-acesso"));
    dados.exige_curso=!!(f.querySelector("[data-exige]")&&f.querySelector("[data-exige]").checked);
    const elIsv=f.querySelector("#f_isv");if(elIsv)dados.is_vendedora=elIsv.value||null;
    const elCd=f.querySelector("#f_crmdono");if(elCd)dados.crm_dono=elCd.value||null;
    const elCn=f.querySelector("#f_canal");if(elCn)dados.canal_id=elCn.value||null;
    const elUfs=f.querySelector("#f_ufs");if(elUfs)dados.ufs_atendidas=elUfs.value.split(",").map(x=>x.trim().toUpperCase()).filter(x=>/^[A-Z]{2}$/.test(x));
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.from("profiles").update(dados).eq("id",S.adminUser.id);
    if(error){S._erro="Não foi possível salvar. Tente de novo.";render();return;}
    const elRc=f.querySelector("#f_rccrm");
    if((perfil==="RC"||perfil==="Assessor de Vendas Digital")&&elRc){const rc=elRc.value||null;const {error:e2}=await sb.from("profiles").update({rc_crm:rc}).eq("id",S.adminUser.id);if(!e2)dados.rc_crm=rc;}
    Object.assign(S.adminUser,dados);S.equipe=null;S._erro=null;render();aviso("Dados atualizados.");
  }
  if(f.id==="f-criar"){
    const nome=f.querySelector("#n_nome").value.trim();
    const email=f.querySelector("#n_email").value.trim();
    const perfil=f.querySelector("#n_perfil").value;
    const acessos=[...f.querySelectorAll(".n_acesso:checked")].map(c=>c.value);
    const rcCrm=(perfil==="RC"||perfil==="Assessor de Vendas Digital")?(f.querySelector("#n_rccrm").value||null):null;
    const exigeCurso=!!(f.querySelector("#n_exige_curso")&&f.querySelector("#n_exige_curso").checked);
    S._erroCriar=null;
    if(!acessos.length){S._erroCriar="Marque pelo menos uma seção de acesso.";render();return;}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Criando…";
    const {data,error}=await sb.functions.invoke("criar-usuario",{body:{nome,email,perfil}});
    let erro=null;
    if(error){try{const bd=await error.context.json();erro=bd.error||"Não foi possível criar o acesso.";}catch(_){erro="Não foi possível criar o acesso. Tente de novo.";}}
    else if(data&&data.error){erro=data.error;}
    if(erro){S._erroCriar=erro;S.novoAcesso=null;render();return;}
    await sb.from("profiles").update({acessos,exige_curso:exigeCurso}).eq("email",email);
    const elCdN=f.querySelector("#n_crmdono");if(perfil==="Comercial Barenbrug"&&elCdN&&elCdN.value){await sb.from("profiles").update({crm_dono:elCdN.value}).eq("email",email);}
    if(S.prefill&&S.prefill.solicId){await sb.from("solicitacoes_acesso").update({status:"Atendida"}).eq("id",S.prefill.solicId);}
    if(rcCrm){await sb.from("profiles").update({rc_crm:rcCrm}).eq("email",email);}
    S.novoAcesso={nome,email:data.email,senha:data.senha,telefone:S.prefill&&S.prefill.telefone};S.prefill=null;S._erroCriar=null;S.equipe=null;render();
    return;
  }
  if(f.id==="f-contato"){const r={canal_id:S.canalSel,papel:f.querySelector("#ct_papel").value,nome:f.querySelector("#ct_nome").value.trim(),telefone:f.querySelector("#ct_tel").value.trim(),email:f.querySelector("#ct_email").value.trim()};if(!r.nome){aviso("Informe o nome.");return;}const {error}=await sb.from("canal_contatos").insert(r);if(error){aviso("Erro ao salvar.");return;}S.novoContato=false;S.canais=null;render();aviso("Contato adicionado.");return;}
  if(f.id==="f-filial"){const r={canal_id:S.canalSel,nome:f.querySelector("#fl_nome").value.trim(),cidade:f.querySelector("#fl_cidade").value.trim(),uf:f.querySelector("#fl_uf").value.trim().toUpperCase(),endereco:f.querySelector("#fl_end").value.trim(),responsavel:f.querySelector("#fl_resp").value.trim(),contato:f.querySelector("#fl_contato").value.trim()};const {error}=await sb.from("canal_filiais").insert(r);if(error){aviso("Erro ao salvar.");return;}S.novaFilial=false;S.canais=null;render();aviso("Filial adicionada.");return;}
  if(f.id==="f-estoque"){const r={canal_id:S.canalSel,cultivar:f.querySelector("#es_cult").value.trim(),quantidade_kg:+f.querySelector("#es_qtd").value||0,data:f.querySelector("#es_data").value||null,obs:f.querySelector("#es_obs").value.trim()};const {error}=await sb.from("canal_estoque").insert(r);if(error){aviso("Erro ao salvar.");return;}S.novoEstoque=false;S.canais=null;render();aviso("Estoque registrado.");return;}
  if(f.id==="f-preco"){const r={canal_id:S.canalSel,cultivar:f.querySelector("#pr_cult").value.trim(),preco:+f.querySelector("#pr_preco").value||0,data_pesquisa:f.querySelector("#pr_data").value||null,fonte:f.querySelector("#pr_fonte").value.trim()||"Cliente oculto"};const {error}=await sb.from("canal_precos").insert(r);if(error){aviso("Erro ao salvar.");return;}S.novoPreco=false;S.canais=null;render();aviso("Preço registrado.");return;}
  if(f.id==="f-calc"){
    const kg=+f.querySelector("#calc_kg").value||0;const rs=+f.querySelector("#calc_rs").value||0;
    const faixa=TIERS_RC.find(x=>kg>=x.min&&kg<=x.max)||TIERS_RC[0];
    const ti=RC_TIERS.find(x=>x.t===faixa.t)||RC_TIERS[0];
    const prox=TIERS_RC.find(x=>x.min>kg);
    const pctProd=(parseFloat(String(ti.prod).replace("%","").replace(",","."))||0)/100;
    const fmtRl=n=>"R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
    S.calcRes={kg,rs,tier:faixa.t,prod:ti.prod,canal:ti.canal,comissao:rs?fmtRl(rs*pctProd):null,falta:prox?(prox.min-kg).toLocaleString("pt-BR")+" kg":null,prox:prox?prox.t:null};
    render();window.scrollTo(0,0);return;
  }
  if(f.id==="f-post"){
    const texto=f.querySelector("#p_texto").value.trim();
    const anexo=f.querySelector("#p_anexo").value.trim();
    const publico=[...f.querySelectorAll(".p_pub:checked")].map(c=>c.value);
    const fixado=f.querySelector("#p_fix").checked;
    if(!texto){S._erro="Escreva a mensagem.";render();return;}
    if(!publico.length){S._erro="Escolha ao menos um público.";render();return;}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Publicando…";
    const {error}=await sb.from("posts").insert({autor_nome:S.profile.nome||"Barenbrug",texto,anexo_url:anexo||null,publico,fixado,tipo:"comunicado"});
    if(error){S._erro="Não foi possível publicar. Verifique se você é administrador.";render();return;}
    S._erro=null;S.posts=null;render();aviso("Comunicado publicado.");return;
  }
  if(f.id==="f-mkt"){
    const titulo=f.querySelector("#m_tit").value.trim();
    const url=f.querySelector("#m_url").value.trim();
    const descricao=f.querySelector("#m_desc").value.trim();
    const tipo=f.querySelector("#m_tipo").value;
    const temaEl=f.querySelector("#m_tema");const tema=temaEl?temaEl.value:null;
    if(!titulo||!url){S._erro="Preencha título e URL.";render();return;}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Adicionando…";
    const reg={secao:S.mktNovo,titulo,descricao,tipo,url};if(tema)reg.tema=tema;
    const {error}=await sb.from("materiais_mkt").insert(reg);
    if(error){S._erro="Não foi possível salvar. Verifique se você é administrador.";render();return;}
    S.mktNovo=null;S.mkt=null;S._erro=null;render();aviso("Material adicionado.");
    return;
  }
  if(f.id==="f-quiz"){
    const id=f.dataset.id,lista=id==="prova"?PROVA:ETAPAS.find(e=>e.id===id).quiz,min=Math.ceil(lista.length*0.7);
    const fd=new FormData(f),resp=lista.map((_,i)=>+fd.get("p"+i)),ac=resp.filter((r,i)=>r===lista[i].c).length,ok=ac>=min;
    S.res={resp,ac,ok,min};if(ok)await concluir(id,ac);render();
    document.querySelector(".resultado")?.scrollIntoView({block:"center"});
  }
});
boot();
</script>
</body>
</html>
