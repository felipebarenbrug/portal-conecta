<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive">
<title>Portal Conecta Barenbrug</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<style>
:root{
  --amarelo:#FFDB00; --azul:#00A8E2; --azul-escuro:#00557A; --preto:#1E1E1E;
  --branco:#FFFFFF; --papel:#F3F7F9; --linha:#D5E1E7; --apagado:#5A6B74; --bloqueado:#A9B7BE;
  --azul-claro:#E3F5FC; --amarelo-claro:#FFF7BF; --vermelho:#B4232A;
  --fonte:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--preto);font-family:var(--fonte);font-size:16px;line-height:1.55}
button,input,select{font:inherit}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}
img{max-width:100%}
:focus-visible{outline:3px solid var(--azul-escuro);outline-offset:2px}
.sci{font-style:italic}

.topo{background:var(--amarelo)}
.topo-in{max-width:880px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.topo-acoes{display:flex;align-items:center;gap:8px;min-width:0}
.topo-ic{position:relative;flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.07);color:var(--preto);display:grid;place-items:center;cursor:pointer;padding:0;font-weight:800;font-size:16px;line-height:1}
.topo-ic:hover{background:rgba(0,0,0,.14)}
.topo-ic b{position:absolute;top:-3px;right:-5px;background:var(--vermelho);color:#fff;font-size:11px;line-height:1;padding:3px 5px;border-radius:999px;font-weight:700}
.logo-b{background:none;border:0;padding:0;cursor:pointer;line-height:0;flex:0 0 auto}
/* Manual da marca: logo sempre sobre amarelo Barenbrug, com respiro >= 1x a altura do logotipo em todos os lados */
.logo{height:20px;width:auto;display:block;margin:20px 20px 20px 6px}
.quem{font-size:13px;text-align:right;min-width:0;line-height:1.35;margin-right:4px;overflow:hidden}
.quem .q1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem .q2{display:block;white-space:nowrap}
@media (max-width:560px){.quem .qp{display:none}.quem{font-size:12.5px}.topo-ic{width:36px;height:36px}.topo-acoes{gap:6px}}
@media (max-width:370px){.topo .logo{height:13px;margin:18px 4px 18px 0}.topo-in{gap:8px}}

.quem button{background:none;border:0;padding:0;color:var(--preto);text-decoration:underline;cursor:pointer;font-size:13px}

.subnav{background:var(--amarelo);border-top:1px solid rgba(0,0,0,.08)}
.subnav-in{max-width:880px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:0 10px;flex-wrap:wrap}
.voltar-inicio{background:none;border:0;padding:9px 0;color:var(--preto);font-weight:700;font-size:14px;cursor:pointer}
.nav{display:flex;gap:4px;flex:1 1 100%;order:2;min-width:0;flex-wrap:wrap}
.nav::-webkit-scrollbar{display:none}
.subnav .secao-nome{margin-left:auto}
.nav button{flex:0 0 auto;background:none;border:0;padding:9px 10px;font-weight:700;font-size:14px;cursor:pointer;color:var(--preto);border-radius:6px 6px 0 0;white-space:nowrap}
.nav button[aria-current=page]{background:var(--papel)}
@media (max-width:640px){.nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}}
.secao-nome{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--azul-escuro)}

main{max-width:880px;margin:0 auto;padding:26px 16px 56px;display:grid;gap:24px}
main>*{min-width:0}
.titulo{color:var(--azul);font-weight:800;font-size:clamp(26px,6vw,36px)}
.sub{color:var(--apagado);max-width:62ch;margin-top:6px}
h2.sec{color:var(--azul);font-size:21px;font-weight:800}
.voltar{background:none;border:0;padding:0;color:var(--azul-escuro);font-weight:700;cursor:pointer;justify-self:start}
.btn{background:var(--azul-escuro);color:var(--branco);border:0;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer;display:inline-block}
.btn:disabled{background:var(--bloqueado);cursor:not-allowed}
.btn.preto{background:var(--preto)}
.btn.perigo{background:var(--vermelho)}
.btn.sec{background:var(--branco);color:var(--azul-escuro);box-shadow:inset 0 0 0 2px var(--azul-escuro)}
.link{text-align:left;background:none;border:0;padding:0;color:var(--azul-escuro);text-decoration:underline;cursor:pointer}
.link.perigo{color:var(--vermelho)}
.carregando{min-height:70vh;display:grid;place-items:center;color:var(--apagado)}
.acoes{display:flex;gap:10px;flex-wrap:wrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{text-align:left;background:var(--branco);border:0;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 0 var(--linha);min-height:150px}
.card h3{font-size:20px;font-weight:800;color:var(--azul-escuro)}
.card p{font-size:14px;color:var(--apagado);flex:1}
.card-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--azul-escuro)}
.card-cta{font-weight:700;color:var(--azul)}
.card.off{cursor:default;opacity:.65;box-shadow:inset 0 0 0 1.5px var(--linha);background:transparent}
.card.off .card-tag{color:var(--apagado)}

.acesso{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--branco)}
.acesso-marca{background:var(--amarelo);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.acesso-marca h1{font-size:clamp(30px,5vw,42px);font-weight:800;color:var(--preto)}
.acesso-marca .logo{height:24px;margin:0;align-self:flex-start}
.acesso-form{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.acesso-form.rolavel{justify-content:flex-start}
.acesso-form h2{color:var(--azul);font-weight:800;font-size:24px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:6px;background:var(--branco);color:var(--preto)}
input:disabled,select:disabled{background:var(--papel);color:var(--apagado)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.erro{background:var(--amarelo-claro);padding:10px 12px;font-size:14px;border-left:4px solid var(--preto)}
.dica{font-size:13px;color:var(--apagado)}
.form-card{background:var(--branco);padding:18px;border-radius:6px;display:grid;gap:14px;max-width:560px}

.proximo{background:var(--amarelo);padding:22px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-radius:6px}
.proximo>div{min-width:0;flex:1 1 260px}
.rot{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.proximo h2{font-size:24px;font-weight:800;color:var(--preto);margin-top:3px}
.barra{height:8px;background:var(--linha);overflow:hidden;border-radius:4px}
.barra i{display:block;height:100%;background:var(--azul)}
.resumo{display:grid;gap:7px;font-size:14px;color:var(--apagado)}

.trilha{list-style:none;margin:0;padding:0;display:grid}
.trilha li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:12px}
.trilha li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--linha)}
.trilha li.feita:not(:last-child)::before{background:var(--azul)}
.marco{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--branco);color:var(--bloqueado);box-shadow:inset 0 0 0 3px var(--linha);font-variant-numeric:tabular-nums}
.feita .marco{background:var(--azul);color:var(--branco);box-shadow:none}
.atual .marco{background:var(--amarelo);color:var(--preto);box-shadow:inset 0 0 0 3px var(--preto)}
.etapa-b{background:none;border:0;padding:6px 0 10px;text-align:left;width:100%;display:grid;gap:2px;color:inherit;min-width:0}
button.etapa-b{cursor:pointer}
button.etapa-b:hover h3{text-decoration:underline}
.etapa-b h3{font-size:19px;font-weight:700}
.etapa-b p{font-size:14px;color:var(--apagado)}
.bloq .etapa-b h3{color:var(--apagado)}
.est{font-size:12px;font-weight:700;color:var(--azul-escuro)}

.player{background:var(--azul-escuro);color:var(--branco);aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;text-align:center;border-radius:6px}
.video-wrap{width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.play{width:0;height:0;border-left:30px solid var(--amarelo);border-top:18px solid transparent;border-bottom:18px solid transparent}
.player h3{font-size:clamp(18px,4vw,24px);color:var(--branco)}
.player p{font-size:13px;opacity:.9}
.lista{display:grid;background:var(--branco);border-radius:6px;overflow:hidden}
.linha{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);justify-content:space-between;flex-wrap:wrap}
.linha:last-child{border-bottom:0}
.linha>div{min-width:0;flex:1 1 200px}
.linha.ativa{background:var(--azul-claro)}
.linha strong{display:block}
.meta{font-size:13px;color:var(--apagado)}
.check{display:flex;gap:7px;align-items:center;font-size:14px;margin:0;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--azul-escuro)}
.bloco{display:grid;gap:12px}

.perg{background:var(--branco);padding:16px;border:0;margin:0;border-radius:6px}
.perg legend{font-weight:700;padding:0;margin-bottom:10px}
.perg .op{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-weight:400;font-size:15px;cursor:pointer;margin:0}
.perg .op input{margin-top:4px;width:auto;accent-color:var(--azul-escuro)}
.mark{font-size:13px;font-weight:700;margin-top:8px}
.resultado{padding:16px;border-radius:6px}
.resultado.ok{background:var(--azul);color:var(--branco)}
.resultado.nao{background:var(--amarelo)}
.resultado h3{font-size:22px;font-weight:800}
.resultado.ok h3 b{color:var(--amarelo)}

.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--linha);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--preto);width:auto}
.chip[aria-pressed=true]{background:var(--azul-escuro);color:var(--branco);box-shadow:none}
.vazio{padding:20px;background:var(--branco);color:var(--apagado);border-radius:6px}

.cert{background:var(--azul);color:var(--branco);padding:clamp(24px,6vw,48px);display:grid;gap:14px;border-radius:6px}
.cert .rot{color:var(--amarelo)}
.cert h2{font-size:clamp(26px,6vw,40px);font-weight:800;color:var(--branco)}
.cert h2 b{color:var(--amarelo)}
.cert .slogan{font-weight:800;font-size:20px;margin-top:10px}
.cert .slogan b{color:var(--amarelo)}

.tab{overflow-x:auto;background:var(--branco);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado);padding:10px 12px;border-bottom:2px solid var(--linha)}
td{padding:10px 12px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
.selo{font-size:12px;font-weight:700;padding:2px 8px;background:var(--azul-claro);color:var(--azul-escuro);border-radius:4px;white-space:nowrap}
.selo.is{background:var(--amarelo-claro);color:var(--preto)}
.nota-admin{background:var(--amarelo-claro);border-left:4px solid var(--amarelo);padding:12px 14px;font-size:14px;border-radius:4px}
.perigo-box{background:#FBE9EA;border-left:4px solid var(--vermelho);padding:12px 14px;font-size:14px;border-radius:4px;display:grid;gap:10px}
.linha.col{flex-direction:column;align-items:stretch}
.linha audio{width:100%;margin-top:2px}
.sub-vid{font-size:12px;font-weight:700;color:var(--azul-escuro);letter-spacing:.07em;text-transform:uppercase;margin:14px 0 2px}
.sub-vid:first-child{margin-top:0}
.banner-precos{background:var(--amarelo);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.banner-precos div{min-width:0}
.banner-precos h3{font-size:19px;font-weight:800;color:var(--preto)}
.banner-precos p{font-size:13px;color:#6b5e00}
.hero{background:var(--amarelo);border-radius:10px;padding:clamp(20px,5vw,36px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero.azul{background:var(--azul)}
.hero .hero-txt{min-width:0;flex:1 1 300px;display:grid;gap:8px}
.hero .rot{color:#6b5e00}
.hero.azul .rot{color:var(--amarelo)}
.hero.azul h1,.hero.azul p{color:var(--branco)}
.hero-logo{flex:0 0 auto;height:40px;width:auto;background:var(--branco);padding:12px 16px;border-radius:12px}
.slogan-b{font-weight:800;font-size:17px;color:var(--preto);margin-top:2px}
.slogan-b b{color:var(--azul)}
.hero-rc{background:var(--amarelo);border-radius:10px;padding:clamp(22px,5vw,40px);display:grid;gap:10px}
.hero-rc .rot{color:#6b5e00}
.hero-rc h1{color:var(--preto)}
.faq{display:grid;gap:8px}
.faq-item{background:var(--branco);border-radius:6px;padding:12px 14px}
.faq-item summary{font-weight:700;cursor:pointer}
.faq-item p{margin-top:8px;color:var(--apagado);font-size:15px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{background:var(--branco);border-radius:8px;padding:14px}
.metric span{font-size:12px;color:var(--apagado);text-transform:uppercase;letter-spacing:.04em}
.metric strong{display:block;font-size:20px;margin-top:4px;color:var(--azul-escuro)}
.acoes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.acao-card{background:var(--branco);border-radius:8px;padding:14px;display:grid;gap:6px;box-shadow:0 1px 0 var(--linha)}
.acao-card.sel{box-shadow:inset 0 0 0 2px var(--azul)}
.acao-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acao-bot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.stbadge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.stbadge.ok{background:#E3F7E8;color:#1E7A34}
.stbadge.no{background:#FBE9EA;color:var(--vermelho)}
.stbadge.an{background:var(--amarelo-claro);color:#6b5e00}
.anexo-item{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--linha)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.checks .check{font-weight:500}
.precos-nota{background:var(--azul-claro);border-left:4px solid var(--azul);padding:12px 14px;border-radius:4px;font-size:14px;display:grid;gap:6px}
.precos-cap{font-size:13px;color:var(--apagado);margin-top:6px}
table.precos td.cult{font-weight:700;color:var(--azul-escuro);white-space:nowrap}
table.precos th.mes,table.precos td.mes{text-align:right;white-space:nowrap}
table.precos th.mes-on,table.precos td.mes-on{background:var(--amarelo-claro)}
table.precos tbody tr:hover td{background:var(--azul-claro)}
table.frete td.val{text-align:right;font-weight:700;white-space:nowrap}
.cond{display:grid;gap:7px;font-size:14px;color:var(--apagado)}
.cond li{margin-left:18px}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--preto);color:var(--branco);padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);z-index:20;border-radius:6px}

@media (max-width:640px){
  .acesso{grid-template-columns:1fr;min-height:0}
  .logo{height:16px;margin:16px 8px 16px 2px}
  .acesso-marca .logo{height:20px;margin:0}
  .nav button{padding:9px 8px;font-size:14px}
  .secao-nome{display:none}
}
.cred{margin-top:12px}.cred .msg{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;background:var(--branco);padding:10px 12px;border-radius:6px;margin:8px 0;user-select:all}
a.btn{text-decoration:none;text-align:center}
details.lote{background:var(--branco);border-radius:8px;padding:12px 14px;margin-top:12px}
details.lote summary{cursor:pointer;font-weight:700;color:var(--azul-escuro)}
.linha .acoes .btn{padding:9px 14px}
.acesso-links{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mesbar{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.mesbar .trilho{height:16px;background:var(--linha,#eee);border-radius:8px;overflow:hidden;position:relative}
.mesbar .trilho i{display:block;height:100%;background:var(--azul-escuro)}
.mesbar .trilho b{position:absolute;left:0;top:0;height:100%;background:var(--amarelo,#ffdb00);opacity:.95}
.neg{display:grid;gap:2px;padding:12px 14px;border-bottom:1px solid var(--linha)}
.neg .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.neg .l1 span:last-child{white-space:nowrap}
.noticias{display:grid;background:var(--branco);border-radius:6px;overflow:hidden}
.noticia{display:grid;gap:6px;padding:14px 16px;border-bottom:1px solid var(--linha);color:inherit;text-decoration:none;min-width:0}
.noticia:last-child{border-bottom:0}
a.noticia:hover .nt-tit,a.noticia:focus-visible .nt-tit{text-decoration:underline}
.nt-tit{font-weight:700;font-size:1rem;line-height:1.35;color:var(--preto);overflow-wrap:anywhere;white-space:normal}
.nt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.8rem;color:var(--apagado)}
.nt-fonte{font-weight:700;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--azul-escuro)}
.nt-dia{font-weight:700;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--apagado);padding:14px 16px 6px;background:var(--papel)}
@media (max-width:560px){.noticia{padding:12px 14px}.nt-tit{font-size:.97rem}}
.estrelas{color:#c99700;letter-spacing:1px}
@media (max-width:640px){
  .btn{padding:13px 16px}
  .acoes .btn,.acoes a.btn{flex:1 1 140px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .metric{padding:12px 10px}.metric strong{font-size:18px;word-break:break-word}
  .form-card input,.form-card select,.form-card textarea,.acesso-form input{font-size:16px}
  .mesbar{grid-template-columns:52px 1fr;}.mesbar .v{grid-column:1/-1;text-align:right;margin-top:-4px}
}
.duv{background:var(--branco);border-radius:8px;padding:14px;display:grid;gap:8px}
.duv h3{margin:0;font-size:17px;line-height:1.35}
.duv .resp{border-left:3px solid var(--linha);padding:8px 0 8px 12px;display:grid;gap:4px}
.duv .resp.ok{border-left-color:#1e8449}
.duv .resp p{margin:0;white-space:pre-wrap;word-break:break-word}
.selo-ok{display:inline-block;font-size:12px;font-weight:700;color:#1e8449;border:1.5px solid #1e8449;border-radius:999px;padding:2px 9px}
.selo-pend{display:inline-block;font-size:12px;font-weight:700;color:#8a6d00;border:1.5px solid #c9a400;border-radius:999px;padding:2px 9px}
.duv .mini{display:flex;gap:14px;flex-wrap:wrap}

.rv-cen-c dl{margin:0;display:grid;gap:2px}.rv-cen-c dl div{display:flex;justify-content:space-between;gap:8px;font-size:13px}.rv-cen-c dt{color:var(--cinza,#5b6b7b)}.rv-cen-c dd{margin:0;font-weight:700}

<script>

const SB_KEY="__KEY__";

let sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true,autoRefreshToken:true}});

const sci=s=>`<span class="sci">${s}</span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const urlOk=u=>{const t=String(u==null?"":u).trim();return /^https?:\/\//i.test(t)?t:"#";};
const q=(p,ops)=>({p,ops}); // o gabarito fica so no banco (prova_gabarito); a correcao e no servidor
// Provas de certificação (20 questões, geradas no NotebookLM a partir das fontes Barenbrug; 70% = 14)
const QUIZ_SABIA=[
  q("O Cultivar Sabiá foi desenvolvido pelo programa de melhoramento genético de forrageiras tropicais da Barenbrug do Brasil. Em relação à sua base biológica, genealogia e método de seleção, assinale a alternativa correta:",["Trata-se de uma seleção massal pura de ecótipo silvestre de Brachiaria brizantha coletada no Cerrado brasileiro e registrada após dois anos de avaliações clonais.","É um híbrido interespecífico resultante do cruzamento artificial entre Brachiaria brizantha e Brachiaria ruziziensis, tendo sua seleção final fixada na 4ª geração de cruzamentos.","Trata-se de uma linhagem sintética obtida pela hibridação de Brachiaria humidicola com Brachiaria decumbens cv. Basilisk após seis retrocruzamentos sucessivos.","É uma cultivar resultante de mutação induzida por radiação sobre sementes comerciais de Brachiaria brizantha cv. Marandu, selecionada especificamente na 2ª geração."]),
  q("Para atender às exigências regulatórias do Ministério da Agricultura e Pecuária (MAPA) para o Registro Nacional de Cultivares (RNC), quais ensaios obrigatórios foram conduzidos com o Cultivar Sabiá?",["Apenas ensaios de campo em parcelas isoladas por um ano, dispensando ensaios com animais por se tratar de planta apomítica.","Ensaios laboratoriais in vitro de digestibilidade ruminal durante 36 meses e avaliação sensorial com ovinos confinados.","Dois anos de ensaios de Valor de Cultivo e Uso (VCU) sob corte comparados a testemunhas comerciais, seguidos da etapa oficial de VCU sob pastejo contínuo para avaliação do desempenho animal.","Quatro anos de ensaios exclusivos de produção de sementes e germinação em câmara climática sem pastejo direto."]),
  q("Em ensaios oficiais conduzidos durante dois anos em cinco ambientes representativos do Brasil Central (Colinas do Tocantins/TO, Pontes e Lacerda/MT, UNEMAT/MT, Uberlândia/MG e Xinguara/PA), qual foi o comportamento produtivo do Sabiá em comparação ao cv. Marandu?",["Produziu exatamente a mesma massa anual, diferenciando-se apenas por menor exigência de adubação fosfatada.","Acumulou em média 18,11 t MS/ha/ano (+34% em relação aos 13,47 t MS/ha/ano do Marandu), superando a testemunha em +31% na época das águas e +42% na estação seca.","Apresentou produção 50% superior na estação chuvosa, porém com queda drástica e inferioridade de 25% na época da estiagem.","Obteve média de 25,50 t MS/ha/ano nas águas e estabilizou em apenas 5% de acúmulo no inverno em todas as regiões."]),
  q("A perda drástica de qualidade da forragem no período de estiagem é o principal fator responsável pelo efeito 'boi sanfona'. Nos ensaios regionais, qual foi a entrega de lâminas foliares (folhas verdes) do Cultivar Sabiá no período seco em comparação ao Marandu?",["Entrega de +50% a mais de toneladas de matéria seca de lâmina foliar no período seco em relação ao Marandu.","Redução de 15% na proporção de folhas verdes, compensada por maior acúmulo de colmo fibroso.","Acúmulo de folhas idêntico ao Marandu, porém com maior teor de umidade no colmo principal.","Produção de lâminas foliares superior apenas quando submetido a irrigação por pivô central durante o inverno."]),
  q("A curva de estacionalidade de produção define a capacidade de suporte de uma fazenda ao longo do ano. Como se compara a distribuição percentual anual de forragem entre o Cultivar Sabiá e o Cultivar Marandu?",["Sabiá: 90% águas / 10% seca; Marandu: 70% águas / 30% seca.","Sabiá: 50% águas / 50% seca; Marandu: 50% águas / 50% seca.","Sabiá: cerca de 65% a 66% nas águas e 34% a 35% na seca; Marandu: cerca de 80% nas águas e apenas 19% a 20% na seca.","Sabiá: 40% nas águas e 60% na seca; Marandu: 85% nas águas e 15% na seca."]),
  q("Nos ensaios de VCU sob pastejo com bovinos de corte, qual foi o ganho de produtividade animal médio nacional e o maior valor regional alcançado pelo Sabiá?",["Média de +2,0 @/ha/ano (+10%), com teto de 20 @/ha/ano em Uberlândia/MG.","Média de +7,0 @/ha/ano (+36,1% em ganho de carne), com teto produtivo de 38,5 @/ha/ano em Xinguara/PA (+11,1 @/ha/ano a mais que o Marandu).","Média de +15,0 @/ha/ano (+80%), com teto de 50 @/ha/ano no Tocantins.","Média de +4,5 @/ha/ano (+18%), atingindo no máximo 27,9 @/ha/ano em Pontes e Lacerda/MT."]),
  q("Em experimento avaliando o incremento de fertilização nitrogenada no Cultivar Sabiá ao elevar a dose de 50 kg de N/ha para 200 kg de N/ha, quais foram os resultados observados no acúmulo de biomassa?",["Incremento de apenas 10% na massa total, demonstrando baixa capacidade responsiva ao nitrogênio.","Ocorrência de acamamento precoce sem alteração estatística no acúmulo de lâminas foliares.","Incremento de 44,8% (cerca de 45%) no acúmulo total de forragem e de 77,5% (quase o dobro) no acúmulo de lâminas foliares.","Redução de 20% na relação folha/colmo em virtude do alongamento hipertrofiado dos entrenós."]),
  q("Em ensaios entomológicos controlados em gaiolas para mensuração de notas de dano por cigarrinhas (escala de 1 a 5, onde 1 = altamente resistente e 5 = altamente suscetível), como o Sabiá se comportou frente às espécies Notozulia entreriana e Mahanarva fimbriolata (cigarrinha-da-cana)?",["Apresentou nota 5 (morte total de perfilhos) para ambas as espécies, demonstrando alta suscetibilidade.","Apresentou nota 2 (altamente resistente com sintomas mínimos de clorose foliar), superando o Marandu (nota 3) e o Basilisk/Decumbens (nota 4) para Mahanarva.","Mostrou-se resistente à Notozulia, mas totalmente suscetível à Mahanarva fimbriolata com nota de dano 4.","Comportou-se de forma idêntica à Brachiaria decumbens cv. Basilisk, necessitando de pulverização química preventiva constante."]),
  q("No ensaio de pastejo diferido conduzido pelo IFTO em Colinas do Tocantins (TO), simulando vedação iniciada em 20 de março ao longo de 168 dias de estiagem, qual foi o acúmulo de matéria seca alcançado pelo Sabiá?",["Produção entre 11 e 14,7 toneladas de MS/ha ao longo dos cortes periódicos, superando o Marandu e a B. decumbens.","Produção constante de apenas 5 toneladas de MS/ha devido à senescência precoce das touceiras aos 56 dias.","Produção inferior à Brachiaria decumbens após 84 dias de diferimento por perda excessiva de colmos basais.","Acúmulo máximo de 8 t MS/ha restrito ao corte inicial de 56 dias, caindo a zero aos 168 dias."]),
  q("Ao final dos 168 dias de pastejo diferido no ensaio do IFTO, quais foram os diferenciais de proporção e acúmulo de lâminas foliares do Sabiá em relação às testemunhas (Marandu e Decumbens)?",["Proporção de folhas 50% menor, com acúmulo de folhas 10% inferior ao Marandu.","Mais de 100% de proporção de lâmina foliar e mais de 130% de acúmulo de matéria seca de folhas ao término da seca.","Ausência total de folhas verdes remanescentes, acumulando apenas bainhas e inflorescências secas.","Comportamento idêntico à Decumbens em massa de folhas, porém com colmos 40% mais lignificados."]),
  q("Nos dados de pesquisa de biomassa subterrânea e aérea sob diferimento (maio a outubro) conduzidos pelos professores Raphael Pavesi e Esdras Henrique (IFTO), como o Sabiá se destacou frente ao Marandu?",["Produziu menor massa de raízes (3,0 t MS/ha vs 5,0 t MS/ha do Marandu), concentrando energia apenas nas folhas.","Acumulou em média 6,4 t MS/ha de raízes vs 4,1 t MS/ha do Marandu (+56% ou +2,3 t/ha de raiz) e 3,2 t MS/ha de folhas vs 2,4 t do Marandu (+33%).","Apresentou sistema radicular pivotante profundo, porém com massa seca de raízes idêntica à do capim Marandu.","As raízes se degradaram integralmente no mês de agosto (140 dias de diferimento) em solos arenosos."]),
  q("Para maximizar a interceptação luminosa (95% de IL), evitar o alongamento de colmo e garantir rápida rebrota no pastejo rotacionado do Sabiá, quais são as alturas recomendadas de entrada e saída dos animais?",["Entrada a 50 cm e saída a 35 cm.","Entrada a 40 cm e saída a 25 cm.","Entrada a 30 cm e saída entre 15 e 20 cm.","Entrada a 20 cm e saída a 5 cm (pastejo rente ao solo)."]),
  q("No sistema de pastejo contínuo com lotação variável, qual é a altura média de manejo alvo para o dossel do Sabiá e qual decisão operacional deve ser tomada caso o pasto ultrapasse os 30 cm de altura?",["Manter entre 10 e 15 cm; se ultrapassar 30 cm, deve-se retirar o gado e realizar roçada mecânica imediata.","Manter entre 25 e 30 cm; caso a altura média ultrapasse 30 cm, deve-se aumentar a carga animal (colocar mais animais) para colher o excedente de forragem antes que haja perda de qualidade.","Manter entre 40 e 50 cm; se ultrapassar 30 cm, deve-se suspender o fornecimento de sal mineral no cocho.","Manter a 15 cm contínuos; alturas acima de 30 cm indicam superpastejo e exigem adubação de cobertura."]),
  q("A semeadura incorreta é uma das maiores causas de insucesso na implantação de pastagens. Qual é a regra estrita de profundidade para a deposição das sementes do Cultivar Sabiá?",["De 4 a 6 cm, para proteger as sementes contra a dessecação solar e ataque de pássaros.","De 1 a 2 cm de profundidade, nunca ultrapassando 2 cm para não retardar a emergência e não comprometer o estande de plantas.","Apenas na superfície sem nenhuma incorporação ou compactação, independentemente do implemento.","De 3 a 5 cm em solos arenosos e de 0,5 cm em solos argilosos pesados."]),
  q("A recomendação técnica da taxa de semeadura do Cultivar Sabiá varia de acordo com as condições de preparo de solo, tecnologia de maquinário e método de plantio. Quais são as taxas preconizadas?",["Taxa única de 5 kg/ha para qualquer condição de relevo e método de distribuição.","10 kg/ha para condição ideal (plantio em linha com boa regulagem); 12 kg/ha para condição intermediária; e 15 kg/ha para condições adversas, áreas de morro, semeadura a lanço ou via drone/avião.","20 kg/ha em linha e 30 kg/ha a lanço para compensar sementes sem tratamento.","8 kg/ha exclusivo para semeadura aérea e 18 kg/ha para plantio direto com dessecação prévia."]),
  q("Após a emergência do Cultivar Sabiá, em quanto tempo deve ser realizado o primeiro pastejo e qual é a diretriz zootécnica correta para essa operação?",["Aos 30 dias após o plantio, utilizando vacas pesadas e touros para acamar todo o capim.","Apenas após 180 dias de plantio, quando as plantas já tiverem produzido sementes maduras.","Entre 60 e 90 dias após a emergência, utilizando animais jovens e leves para realizar o desponte do capim e estimular o perfilhamento basal sem arrancar as plantas.","Aos 120 dias, com taxa de lotação máxima para rebaixar o capim até 5 cm do solo."]),
  q("Embora o Cultivar Sabiá seja altamente rústico e adaptável, existe uma contraindicação agronômica severa onde seu plantio NÃO deve ser realizado. Assinale-a:",["Solos com saturação por bases (V%) entre 50% e 60%.","Solos sujeitos a encharcamento prolongado, várzeas ou regiões com má drenagem onde a chuva acumulada ultrapassa 300 mm/mês sem escoamento (situações onde se indica B. humidicola).","Áreas com precipitação anual entre 1.000 mm e 1.500 mm no Centro-Oeste.","Sistemas de consórcio com milho safrinha em espaçamento entrelinhas de 50 cm."]),
  q("Quais são os parâmetros químicos de fertilidade de solo recomendados para permitir a expressão do potencial genético do Cultivar Sabiá?",["Solos de baixíssima fertilidade com V% de 20%, P de 1 mg/dm³ e tolerância ilimitada a alumínio tóxico.","Solos de média a alta fertilidade, com saturação por bases (V%) entre 50% e 60%, teor de fósforo [P] mínimo de 5 mg/dm³ e potássio [K] entre 3% e 5% da CTC.","Solos agrícolas ultraexigentes com V% acima de 80%, semelhantes à alfafa irrigada.","Necessidade restrita de solos hidromórficos com alto teor de matéria orgânica não mineralizada."]),
  q("Nos dados de pesquisa da Universidade Federal de Uberlândia (UFU), qual foi a contagem média de perfilhos do Sabiá em relação ao Marandu nas estações das águas e seca, e qual é o impacto disso no pastejo animal?",["Sabiá: 500 perfilhos/m² nas águas e 400 na seca; Marandu: 800 e 700; o gado precisa dar mais passos para encher o rúmen.","Sabiá: 850 perfilhos/m² nas águas e 760 na seca; Marandu: 760 nas águas e 600 na seca; mais pontos de crescimento aumentam a massa do bocado e fazem o animal caminhar menos para se alimentar.","Ambas as cultivares apresentaram exatamente 650 perfilhos/m² nas duas épocas do ano.","O Sabiá não produz perfilhos vegetativos na seca, emitindo exclusivamente perfilhos reprodutivos com sementes."]),
  q("O Cultivar Sabiá apresenta florescimento tardio no Brasil Central (a partir de abril). Qual é a principal vantagem zootécnica e operacional dessa característica fenológica para o produtor?",["Permite colher sementes comerciais no auge do verão (janeiro), antes do florescimento das plantas invasoras.","Induz a lignificação antecipada do dossel, transformando as folhas em palhada seca antes de maio.","Reduz a perda de valor nutritivo da forragem no final do período chuvoso, mantendo colmos macios e folhas verdes durante a transição crítica entre águas e seca.","Impede que a planta responda a qualquer adubação nitrogenada realizada após o mês de fevereiro."])
 ];
const QUIZ_CAYANA=[
  q("A Brachiaria híbrida cv. Cayana foi desenvolvida através de um programa pioneiro de melhoramento genético de forrageiras tropicais no Brasil. Do ponto de vista botânico e genético, assinale a alternativa que descreve corretamente a genealogia e a obtenção dessa cultivar:",["Trata-se de um híbrido simples F1 resultante do cruzamento direto entre Brachiaria decumbens e Brachiaria humidicola.","É uma seleção massal intracultivar a partir de populações naturais de Brachiaria brizantha coletadas nas savanas africanas.","É um híbrido interespecífico resultante do cruzamento entre Brachiaria brizantha e Brachiaria ruziziensis, selecionado na 5ª geração de cruzamentos (F5) após múltiplos ciclos de seleção.","Consiste em uma mutação induzida por radiação aplicada sobre sementes pré-germinadas de Brachiaria brizantha cv. Marandu."]),
  q("Para que um novo cultivar forrageiro seja devidamente registrado e comercializado no Brasil, o Ministério da Agricultura e Pecuária (MAPA) exige o cumprimento rigoroso de ensaios oficiais de Valor de Cultivo e Uso (VCU). Sobre o protocolo executado para o cv. Cayana, assinale a afirmação correta:",["Foram realizados exclusivamente ensaios em parcelas sob corte mecânico por 12 meses em casa de vegetação.","O desenvolvimento contemplou 2 anos de ensaios de VCU sob corte e, subsequentemente, 2 anos de ensaios de VCU sob pastejo com avaliação contínua de desempenho animal na Fazenda Experimental Capim Branco (UFU).","O registro oficial foi concedido por equiparação agronômica aos dados históricos do capim Basilisk, dispensando ensaios com animais.","Os ensaios de VCU sob pastejo foram realizados exclusivamente sob irrigação por pivô central com suplementação concentrada em confinamento."]),
  q("O cv. Cayana é frequentemente caracterizado pelos pesquisadores como uma 'máquina de perfilar'. Em avaliações agronômicas comparativas no período das águas frente ao cv. Marandu, qual é a densidade de perfilhamento atingida pelo Cayana e qual sua implicação direta no manejo?",["Atinge até 985 perfilhos/m², superando o Marandu em cerca de 200 perfilhos/m², promovendo rápido fechamento de solo, forte supressão de plantas daninhas e maior densidade de pontos de crescimento.","Produz exatamente 450 perfilhos/m², apresentando menor densidade que o Marandu, porém com colmos mais grossos e fibrosos.","Atinge 1.500 perfilhos/m² exclusivamente no período de seca severa, cessando completamente a emissão de novos perfilhos durante o período chuvoso.","O perfilhamento é exclusivamente estolonífero subterrâneo, o que impede a apreensão forrageira por bovinos sob pastejo rotacionado."]),
  q("A época de florescimento de uma gramínea forrageira afeta diretamente o valor nutricional do pasto no início do período seco. Em relação à fenologia do cv. Cayana no Brasil Central, assinale a alternativa correta:",["Apresenta florescimento precoce em dezembro e janeiro, exigindo dessecação imediata no início do verão.","Floresce abundantemente em fevereiro e março, com comportamento idêntico ao cv. Marandu e à B. decumbens.","Possui florescimento tardio, concentrado a partir de abril e maio, o que preserva a qualidade forrageira e reduz drasticamente a perda nutricional na transição das águas para a seca.","É uma planta completamente estéril que não desenvolve inflorescências sob nenhuma condição fotoperiódica."]),
  q("Durante as avaliações estruturais de dossel sob pastejo, a cultivar Cayana destacou-se pela alta proporção de lâminas foliares em relação ao tecido de suporte (colmos/bainhas). Qual o impacto zootécnico direto dessa característica morfológica?",["Obriga o animal a despender maior tempo de ruminação devido ao excesso de lignina presente na lâmina foliar.","Favorece a facilidade de apreensão do bocado, maximizando a ingestão de matéria seca com menor gasto energético de pastejo e acelerando a passagem ruminal.","Reduz a taxa de lotação por hectare em 50% em decorrência da quebra prematura de colmos no pastejo contínuo.","Estimula o consumo preferencial de colmos maduros pelo gado em detrimento das folhas jovens."]),
  q("Em ensaios oficiais de campo conduzidos sob condições edafoclimáticas favoráveis e alta fertilidade do solo, qual é a faixa de acúmulo de forragem (t de Matéria Seca/ha/ano) documentada para o cv. Cayana e como ela se compara às testemunhas?",["Produz entre 3,0 e 5,0 t MS/ha/ano, apresentando teto produtivo similar a pastagens nativas de campo sujo.","Produz entre 9,7 e 24,8 t MS/ha/ano, chegando a produzir até 8 a 9 toneladas de matéria seca a mais por hectare ao ano do que o cv. Marandu nos ensaios oficiais.","Atinge 45,0 t MS/ha/ano de matéria seca independentemente da realização de adubação ou do tipo de solo.","Acumula exatamente o mesmo volume de biomassa que a B. decumbens cv. Basilisk em todas as estações do ano."]),
  q("Em experimentos de dose-resposta à adubação nitrogenada avaliando a aplicação de 50 kg/ha de N contra 200 kg/ha de N no cv. Cayana, quais foram os impactos percentuais observados no acúmulo total e na produção de folhas?",["O incremento de nitrogênio provocou intoxicação por nitrato sem aumento na produção de forragem.","A produção total de forragem elevou-se em 15%, enquanto a produção de lâminas foliares decresceu pela metade.","O acúmulo total de forragem aumentou em 63%, enquanto o acúmulo de lâminas foliares mais do que dobrou (+100%), comprovando elevada eficiência de conversão nutricional.","O nitrogênio aumentou apenas a produção de raízes profundas, mantendo constante a biomassa aérea."]),
  q("A sazonalidade de produção de forragem é o principal fator causador do efeito 'boi sanfona'. No cv. Cayana, qual é a proporção média de distribuição de biomassa entre as épocas das águas e da seca e qual a vantagem sobre o Marandu?",["Produz 95% nas águas e apenas 5% na seca, paralisando totalmente a rebrota no outono.","Produz cerca de 70% nas águas e aproximadamente 30% na seca, mantendo até 10 pontos percentuais a mais de produção na seca quando comparado ao cv. Marandu.","Distribui exatamente 50% nas águas e 50% na seca de forma homogênea nos doze meses do ano.","A produção na seca é 100% constituída por colmos secos sem presença de lâminas foliares ativas."]),
  q("Em ensaios entomológicos controlados avaliando a sobrevivência ninfal e danos por notas contra os gêneros Notozulia e Mahanarva, como se comportou o cv. Cayana em comparação às testemunhas?",["Foi classificado como altamente suscetível (nota máxima de dano/morte), com desempenho inferior à B. decumbens cv. Basilisk.","Demonstrou alta resistência (nota 1 a 2) contra Notozulia e resistência superior à Mahanarva (cigarrinha-da-cana), igualando-se ou superando cultivares resistentes consagrados como o Marandu.","É resistente apenas se forem realizadas pulverizações químicas quinzenais de inseticidas sistêmicos na área.","Apresenta tolerância temporária apenas contra pulgões, sendo completamente destruído por ninfas de Notozulia."]),
  q("Na Fazenda Apoena (Mundo Novo/GO), o cv. Cayana foi submetido a condições reais de pressão de pragas e seca durante o período de março a setembro. Qual foi o resultado prático obtido?",["O pasto foi dizimado por cigarrinhas, forçando a venda emergencial de todo o rebanho.","Foi necessária a aplicação de quatro pulverizações de inseticidas para salvar o estande de plantas.","A fazenda optou por não pulverizar a área mesmo sob infestação regional de cigarrinhas, e o Cayana suportou a pressão sem perdas, mantendo 90 machos com taxa de lotação de 2,5 UA/ha na seca e ganho de 2 arrobas por cabeça.","Os animais perderam peso continuamente devido à rejeição forrageira provocada pela toxina das cigarrinhas."]),
  q("A qualidade da dieta ingerida determina a taxa de conversão alimentar no rúmen. Quais são os índices oficiais médios de Proteína Bruta (PB) e Digestibilidade in vitro da Matéria Seca documentados para o cv. Cayana?",["PB de 4,0% a 6,0% na MS total; Digestibilidade de 45,0% a 50,0%.","PB de 11,9% a 13,1% na MS total (atingindo 13,6% na lâmina foliar); Digestibilidade entre 76,1% e 80,1% na MS total (atingindo 80,6% a 81,1% na lâmina foliar).","PB fixa de 22,0% com digestibilidade inferior a 30,0% devido ao acúmulo de sílica epidérmica.","PB de 8,0% exclusiva para colmos senescentes, com digestibilidade nula na lâmina foliar."]),
  q("Nos ensaios oficiais de VCU sob pastejo conduzidos por dois anos na Universidade Federal de Uberlândia (UFU), qual foi o incremento de ganho de peso proporcionado pelo cv. Cayana em relação ao cv. Marandu?",["Produziu exatamente 1 arroba a menos por hectare devido à maior exigência em lotação.","Entregou 8 arrobas a mais por hectare ao ano, representando um acréscimo de 42,2% na produtividade de carne sob os mesmos recursos de adubação.","Aumentou a produção de carne em 150%, produzindo mais de 60 arrobas/ha/ano sem pastejo.","O ganho de peso foi idêntico ao do Marandu, diferenciando-se apenas na cor da forragem."]),
  q("Ao analisar isoladamente o período de estiagem nos ensaios oficiais sob pastejo animal, como se comportou o cv. Cayana frente ao capim Marandu?",["O Cayana produziu 66% a mais de carne na época seca, entregando cerca de 4,75 @/ha contra 2,86 @/ha da testemunha (aproximadamente 2 @/ha a mais).","Os animais perderam 1,5 kg/dia no Cayana devido ao desfolhamento precoce das plantas.","A produção de carne na seca foi nula em ambos os cultivares devido à paralisação das pesagens.","O Marandu produziu o dobro de arrobas que o Cayana durante o período seco."]),
  q("Em experimento de pastejo diferido (vedação de pasto em 20 de março) conduzido em Colinas do Tocantins (IFTO), quais atributos do cv. Cayana garantiram sua superioridade até setembro?",["Rápida lignificação que tornou o capim duro e impalátavel, impedindo o acamamento das touceiras.","Manutenção de massa seca de 10 a 14 t/ha com superioridade consistente na porcentagem de lâminas foliares (de 10% a 68% mais folhas) e mais de 40% de acúmulo de folhas na média das avaliações.","Florescimento precoce que produziu sementes para alimentação direta dos bovinos no cocho.","Secamento total da parte aérea simulando feno em pé sem valor protéico."]),
  q("As sementes comerciais do cv. Cayana são fornecidas com tecnologia industrial exclusiva de tratamento e incrustação Yellow Jacket®. Quais componentes integram essa tecnologia e qual sua função agronômica?",["Corante vegetal inerte com a única finalidade de identificar a marca no momento do plantio.","Tratamento em camadas contendo pureza mínima de 95%, fungicidas, inseticidas de amplo espectro, bioestimulantes e complexo de macro e micronutrientes para acelerar o enraizamento e proteger a plântula.","Camada espessa de gesso agrícola que reduz o valor cultural da semente para menos de 40%.","Inoculante bacteriano exclusivo para fixação de nitrogênio em leguminosas de clima temperado."]),
  q("Para a correta formação de pastagem com o cv. Cayana, quais são as recomendações oficiais de taxa de semeadura (kg/ha) e profundidade de deposição da semente no solo?",["Taxa de 3 a 5 kg/ha semeados a 5 a 8 cm de profundidade com arado de aiveca.","Taxa de 10 kg/ha para condições ideais, 12 kg/ha para condições intermediárias e 15 kg/ha para condições adversas, incorporados impreterivelmente na profundidade de 1 a 2 cm.","Taxa fixa de 30 kg/ha depositados exclusivamente na superfície sem nenhuma incorporação ou compactação.","Taxa de 2 kg/ha misturados com defensivo hormonal e enterrados a 10 cm."]),
  q("Para maximizar a eficiência de colheita da forragem sem comprometer a estrutura e a rebrota vigorosa do dossel, quais são as alturas-alvo de manejo recomendadas para o cv. Cayana?",["Rotacionado: entrada a 50 cm e saída a 5 cm; Contínuo: manter o pasto entre 10 e 15 cm.","Rotacionado: entrada a 32 cm e saída entre 16 e 20 cm; Contínuo: manter o dossel na faixa de 30 a 35 cm.","Rotacionado: entrada a 20 cm e saída a 2 cm; Contínuo: manter acima de 60 cm para forçar tombamento.","O manejo da Cayana não se baseia em alturas, devendo ser desfolhado até o nível do solo em qualquer época."]),
  q("O cv. Cayana é uma forrageira exigente em fertilidade e responsiva à intensificação. Para atingir seu teto produtivo de 24 t MS/ha/ano, quais são as metas mínimas de correção química do solo recomendadas pelo melhorista Dr. Ulisses Figueiredo?",["Saturação por bases (V%) entre 25% e 35%, Fósforo (P) abaixo de 2 ppm e Potássio (K) em 0,5% da CTC.","Saturação por bases (V%) acima de 60%, Fósforo (P) no solo de no mínimo 7 ppm e Potássio (K) representando de 3% a 5% da CTC.","Dispensa correção de calcário e adubação fosfatada, necessitando apenas de aplicação de micronutrientes foliares.","Exige obrigatoriamente solo hidromórfico ácido com saturação por alumínio (m%) superior a 40%."]),
  q("Apesar de seus excepcionais índices zootécnicos, em quais ambientes o cv. Cayana possui restrição estrita de uso e NÃO deve ser indicado pelos consultores técnicos?",["Áreas de altitude acima de 500 metros com solos corrigidos e planos.","Solos sujeitos a encharcamento/alagamento temporário (baixa tolerância à má drenagem) e regiões semiáridas com menos de 800 mm de chuva anual ou mais de 6 meses de seca severa sem manejo.","Sistemas de integração lavoura-pecuária com milho safrinha em solos argilosos férteis.","Propriedades leiteiras que utilizam adubação nitrogenada pós-pastejo."]),
  q("Em sistemas de Integração Lavoura-Pecuária (ILP) consorciando o cv. Cayana na entrelinha do milho safrinha, qual é a dinâmica de desenvolvimento inicial da forrageira e o manejo de dessecação preconizado?",["O Cayana tem crescimento inicial explosivo que abafa o milho nos primeiros 10 dias, inviabilizando qualquer consórcio.","Em milho espaçado a 50 cm, o sombreamento natural da cultura segura o capim (cujo crescimento inicial é mais tardio), dispensando herbicida; em espaçamentos largos (70-80 cm), maior incidência de luz exige monitoramento e possível subdoses de herbicida por precaução.","Deve-se dessecar totalmente a Cayana com dose cheia de glifosato antes da colheita do milho para não prejudicar as colheitadeiras.","O consórcio só funciona se o capim for semeado 45 dias antes da semeadura do milho."])
 ];
const QUIZ_CARCARA=[
  q("Sobre a classificação botânica e o histórico de melhoramento genético do cultivar Carcará desenvolvido pela Barenbrug, é correto afirmar:",["Trata-se de uma seleção massal tradicional de Brachiaria brizantha importada diretamente do continente africano.","É um híbrido intraespecífico de Megathyrsus maximus (syn. Panicum maximum) resultante de mais de 10 anos de rigorosos estudos laboratoriais e avaliações a campo.","Trata-se de uma variedade transgênica de Panicum com resistência introduzida quimicamente a herbicidas totais.","É um cruzamento interespecífico estéril entre Panicum e Brachiaria humidicola sem necessidade de manejo de fertilidade."]),
  q("Durante as etapas experimentais que antecederam o lançamento comercial do Carcará, qual foi a metodologia oficial adotada para validação agronômica?",["Ensaios exclusivos de laboratório em casa de vegetação durante 6 meses, sem contato direto com pastejo ou animais.","Testes rápidos a lanço sem repetições nem delineamento experimental formal em uma única propriedade.","Protocolo sequencial em etapas compreendendo Fase C (ensaios sob corte regional de 2 anos), Fase G (ensaios de VCU sob pastejo com animais em parcelas de 2,0 ha) e Fase T (validação agronômica em escala de fazenda comercial).","Apenas levantamentos bibliográficos com base nas tabelas zootécnicas do cultivar Mombaça."]),
  q("Nos ensaios regionais em múltiplos ambientes pelo Brasil (como Guaíra/SP, Araguaína/TO e Xinguara/PA), qual característica de adaptação a solos o Carcará comprovou:",["Exclusividade em solos hiperargilosos de várzea inundada com acidez extrema e sem calagem.","Ampla adaptabilidade e estabilidade de produção tanto em solos de textura argilosa quanto arenosa, desde que com as devidas correções de nutrientes.","Baixíssima resposta à adubação em solos corrigidos, exigindo apenas solos naturalmente inférteis.","Incompatibilidade total com regiões tropicais quentes de alta radiação solar."]),
  q("Qual é a proposta de valor central e o posicionamento de mercado do Panicum híbrido cv. Carcará para a fazenda do produtor rural?",["Capim de baixo investimento focado exclusivamente em áreas marginais e pastagens extensivas degradadas sem adubação.","Forrageira de ciclo anual para cobertura temporária de inverno sem viabilidade zootécnica.","Ferramenta para intensificação e alta performance, focada em maximizar o acúmulo de lâminas foliares, o rendimento animal e a rentabilidade do sistema de produção.","Espécie voltada exclusivamente para a contenção de voçorocas e erosões em taludes de estradas."]),
  q("No ensaio oficial de Valor de Cultivo e Uso (VCU) sob pastejo real (Fase G), qual foi a diferença em ganho por área (rendimento animal) do Carcará frente ao cultivar Mombaça?",["O Carcará empatou com o Mombaça em ganho de peso e arrobas totais por hectare.","O Carcará produziu 4,43 arrobas a mais por hectare ao ano (@/ha/ano), representando um aumento de 19,1% no rendimento animal.","O Mombaça superou o Carcará em 2,5 arrobas por hectare ao ano durante o período das águas.","O Carcará apresentou ganho animal inferior devido à menor aceitabilidade da forragem pelos bovinos."]),
  q("Qual foi a vantagem percentual em acúmulo de lâminas foliares produzidas pelo Carcará em relação ao cultivar Mombaça nas avaliações de um ano?",["Produziu 5% a menos de folhas, porém com caules mais grossos.","Produziu 10% a mais de lâminas foliares durante o período seco.","Produziu 26,0% a mais de lâminas foliares em um ano (+3,87 t MS/ha de folha verde).","Apresentou a mesma quantidade de folhas por touceira, sem diferença estatística."]),
  q("Em termos de acúmulo total de forragem anual (t MS/ha), qual foi o resultado comparativo do Carcará frente ao Mombaça no VCU sob pastejo?",["Acúmulo forrageiro total 22,1% superior, com +4,15 toneladas de matéria seca por hectare a mais.","Acúmulo 50% inferior em virtude do seu hábito de crescimento prostrado.","Produção idêntica de matéria seca, com variação apenas na época de florescimento.","Acúmulo 12% superior restrito unicamente ao período de estiagem severa."]),
  q("Quais são as faixas consolidadas de acúmulo anual de forragem e de produtividade animal oficial do Panicum cv. Carcará?",["5,0 a 8,0 t MS/ha/ano e 6,0 a 10,0 @/ha/ano.","12,5 a 22,9 t MS/ha/ano e 15,1 a 27,6 @/ha/ano.","30,0 a 45,0 t MS/ha/ano e 50,0 a 65,0 @/ha/ano.","1,5 a 4,0 t MS/ha/ano e 2,0 a 5,0 @/ha/ano."]),
  q("Qual é a principal característica estrutural do Carcará em relação à formação de talos frente aos Panicuns tradicionais (Mombaça e Massai)?",["Apresenta alongamento acelerado de colmo, criando uma estrutura altamente lenhosa logo no início da brotação.","Apresenta folhas mais largas, maior composição foliar e menor alongamento de colmo (forma menos talos grossos), retendo folhas verdes por mais tempo.","Não produz folhas verdadeiras, desenvolvendo unicamente colmos carnosos de baixa digestibilidade.","Possui hábito estolonífero rasteiro, sem touceiras nem colmos eretos."]),
  q("Como a arquitetura e a densidade de folhas da touceira do Carcará influenciam o comportamento de ingestão do bovino (facilidade de bocado)?",["Dificultam a apreensão da forragem devido à presença de espinhos nas nervuras das folhas.","Facilitam o bocado do animal, permitindo maior apreensão de massa verde com menor resistência mecânica, o que maximiza o ganho de peso individual.","Forçam o animal a gastar o dobro de energia mastigando colmos lenhosos para alcançar as folhas.","Induzem a rejeição precoce pelos animais devido à pilosidade urticante do capim."]),
  q("Nos testes oficiais bromatológicos de VCU, quais foram os teores de Proteína Bruta (PB) registrados para o Carcará na matéria seca total e nas lâminas foliares?",["2,0% a 4,0% na MS total e até 5,0% nas folhas.","6,9% a 16,6% na MS total e atingindo de 8,3% até 19,0% especificamente nas lâminas foliares.","Teores constantes e fixos de 28,0% em todas as frações da planta durante o ano todo.","Ausência completa de proteína bruta nas folhas na época das águas."]),
  q("Qual é a amplitude da digestibilidade da matéria seca das lâminas foliares do Carcará e qual seu reflexo no rúmen do animal?",["Digestibilidade foliar de 66,4% a 74,6%, proporcionando rápida degradação ruminal, maior taxa de passagem e estímulo a novos bocados.","Digestibilidade foliar inferior a 40%, provocando empanturramento e lenta taxa de passagem ruminal.","Digestibilidade de 95% similar à de grãos de milho moído, dispensando fontes de fibra.","A digestibilidade foliar não foi mensurada nos ensaios oficiais da Barenbrug."]),
  q("O que constitui o pacote tecnológico do tratamento e incrustamento de sementes Yellow Jacket® exclusivo da Barenbrug?",["Apenas um corante amarelo alimentar sem qualquer proteção química ou biológica.","Camada de areia compactada para aumentar o peso do saco de sementes sem aditivos.","Formulação com fungicidas, inseticidas de amplo espectro, bioestimulantes de crescimento radicular e complexo de macro e micronutrientes.","Inoculante bacteriano exclusivo para leguminosas de clima temperado."]),
  q("Qual é a taxa de pureza física mínima das sementes de Panicum Carcará garantida pela Barenbrug em relação à exigência legal do MAPA?",["Pureza mínima de 40%, atendendo exatamente ao piso legal do MAPA.","Pureza mínima de 90%, número consideravelmente superior aos 40% mínimos exigidos pelo MAPA.","Pureza mínima de 60% apenas em lotes especiais para exportação.","Pureza física de 20%, compensada com o aumento do volume de palha no saco."]),
  q("Quais são as taxas oficiais de semeadura recomendadas por hectare para o Carcará em condições ideais e intermediárias?",["1 a 2 kg/ha em condições ideais e 3 a 5 kg/ha em condições intermediárias.","8 a 10 kg/ha em condições ideais de solo/preparo e 12 a 15 kg/ha em condições intermediárias.","25 a 35 kg/ha em qualquer circunstância agronômica de plantio.","50 kg/ha devido à baixa germinação das sementes incrustadas."]),
  q("Em relação à profundidade de semeadura e à janela pluviométrica recomendada para implantação do Carcará:",["Semear entre 5 e 10 cm de profundidade e plantar no meio da estiagem para evitar apodrecimento.","Incorporar a semente estritamente a 0,5 a 1,0 cm de profundidade, plantando no início das águas com no mínimo 90 dias de chuvas subsequentes.","Lançar sobre solo descoberto sem enterrar e sem necessidade de chuvas nas primeiras 6 semanas.","Enterrar a semente a 15 cm com grade aradora pesada para garantir proteção contra o sol."]),
  q("Para maximizar a produtividade e a rebrota vigorosa no pastejo rotacionado do Carcará, quais são as alturas corretas de manejo?",["Entrada a 120 cm e saída rente ao solo a 5 cm.","Entrada entre 70 e 80 cm e retirada dos animais com altura de resíduo entre 35 e 40 cm.","Entrada a 40 cm e saída a 20 cm.","Entrada aos 150 cm quando o capim estiver totalmente penduado e sementado."]),
  q("Qual é a orientação técnica formal da Barenbrug sobre a utilização do cultivar Carcará sob sistema de pastejo contínuo?",["É o sistema mais recomendado para aumentar a longevidade do capim.","Não recomendado; por ser uma planta de alta exigência em manejo e fertilidade, requer pastejo rotacionado para expressar seu potencial e não degradar.","Pode ser utilizado livremente sem cerca de divisão desde que não se use adubação.","Recomendado unicamente no período seco do ano."]),
  q("Quanto às tolerâncias climáticas e ambientais oficiais (seca e encharcamento), como o Carcará é classificado na ficha técnica?",["Alta tolerância à seca (até 12 meses sem chuva) e tolerância nula à água no solo.","Tolerância média à seca (suportando até 6 meses sem chuva) e tolerância média à má drenagem (suportando encharcamento temporário, mas sem indicação para brejos).","Planta exclusiva para solos hidromórficos pantanosos com lâmina de água permanente.","Baixa tolerância a qualquer período sem chuva superior a 15 dias."]),
  q("Além do pastejo de bovinos de corte e leite, quais outras aptidões e características de sanidade foram comprovadas para o Carcará?",["Apenas produção de celulose para papel, sendo tóxico para bovinos e equinos.","Aptidão para silagem, feno pré-secado, integração lavoura-pecuária (ILP), boa aceitação por equinos e resistência moderada à cigarrinha-das-pastagens.","Imunidade genética total e absoluta a todas as pragas e lagartas do Cerrado sem necessidade de monitoramento.","Forrageira de uso exclusivo para ovinos em confinamento pleno."])
 ];
