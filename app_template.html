<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Conecta Barenbrug</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
:root{
  --amarelo:#FFDB00; --azul:#00A8E2; --azul-escuro:#00557A; --preto:#1E1E1E;
  --branco:#FFFFFF; --papel:#F3F7F9; --linha:#D5E1E7; --apagado:#5A6B74; --bloqueado:#A9B7BE;
  --azul-claro:#E3F5FC; --amarelo-claro:#FFF7BF; --vermelho:#B4232A;
  --fonte:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--preto);font-family:var(--fonte);font-size:16px;line-height:1.55}
button,input,select{font:inherit}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}
img{max-width:100%}
:focus-visible{outline:3px solid var(--azul-escuro);outline-offset:2px}
.sci{font-style:italic}

.topo{background:var(--amarelo)}
.topo-in{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo-b{background:none;border:0;padding:0;cursor:pointer;line-height:0}
.logo{height:34px;width:auto;display:block}
.quem{font-size:13px;text-align:right}
.quem button{background:none;border:0;padding:0;color:var(--preto);text-decoration:underline;cursor:pointer;font-size:13px}

.subnav{background:var(--amarelo);border-top:1px solid rgba(0,0,0,.08)}
.subnav-in{max-width:880px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voltar-inicio{background:none;border:0;padding:9px 0;color:var(--preto);font-weight:700;font-size:14px;cursor:pointer}
.nav{display:flex;gap:4px;overflow-x:auto}
.nav button{background:none;border:0;padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--preto);border-radius:6px 6px 0 0;white-space:nowrap}
.nav button[aria-current=page]{background:var(--papel)}
.secao-nome{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--azul-escuro)}

main{max-width:880px;margin:0 auto;padding:26px 16px 56px;display:grid;gap:24px}
main>*{min-width:0}
.titulo{color:var(--azul);font-weight:800;font-size:clamp(26px,6vw,36px)}
.sub{color:var(--apagado);max-width:62ch;margin-top:6px}
h2.sec{color:var(--azul);font-size:21px;font-weight:800}
.voltar{background:none;border:0;padding:0;color:var(--azul-escuro);font-weight:700;cursor:pointer;justify-self:start}
.btn{background:var(--azul-escuro);color:var(--branco);border:0;border-radius:6px;padding:12px 20px;font-weight:700;cursor:pointer;display:inline-block}
.btn:disabled{background:var(--bloqueado);cursor:not-allowed}
.btn.preto{background:var(--preto)}
.btn.perigo{background:var(--vermelho)}
.btn.sec{background:var(--branco);color:var(--azul-escuro);box-shadow:inset 0 0 0 2px var(--azul-escuro)}
.link{text-align:left;background:none;border:0;padding:0;color:var(--azul-escuro);text-decoration:underline;cursor:pointer}
.link.perigo{color:var(--vermelho)}
.carregando{min-height:70vh;display:grid;place-items:center;color:var(--apagado)}
.acoes{display:flex;gap:10px;flex-wrap:wrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{text-align:left;background:var(--branco);border:0;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 0 var(--linha);min-height:150px}
.card h3{font-size:20px;font-weight:800;color:var(--azul-escuro)}
.card p{font-size:14px;color:var(--apagado);flex:1}
.card-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--azul-escuro)}
.card-cta{font-weight:700;color:var(--azul)}
.card.off{cursor:default;opacity:.65;box-shadow:inset 0 0 0 1.5px var(--linha);background:transparent}
.card.off .card-tag{color:var(--apagado)}

.acesso{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--branco)}
.acesso-marca{background:var(--amarelo);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.acesso-marca h1{font-size:clamp(30px,5vw,42px);font-weight:800;color:var(--preto)}
.acesso-marca .logo{height:34px;align-self:flex-start}
.acesso-form{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.acesso-form.rolavel{justify-content:flex-start}
.acesso-form h2{color:var(--azul);font-weight:800;font-size:24px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:6px;background:var(--branco);color:var(--preto)}
input:disabled,select:disabled{background:var(--papel);color:var(--apagado)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.erro{background:var(--amarelo-claro);padding:10px 12px;font-size:14px;border-left:4px solid var(--preto)}
.dica{font-size:13px;color:var(--apagado)}
.form-card{background:var(--branco);padding:18px;border-radius:6px;display:grid;gap:14px;max-width:560px}

.proximo{background:var(--amarelo);padding:22px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-radius:6px}
.proximo>div{min-width:0;flex:1 1 260px}
.rot{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.proximo h2{font-size:24px;font-weight:800;color:var(--preto);margin-top:3px}
.barra{height:8px;background:var(--linha);overflow:hidden;border-radius:4px}
.barra i{display:block;height:100%;background:var(--azul)}
.resumo{display:grid;gap:7px;font-size:14px;color:var(--apagado)}

.trilha{list-style:none;margin:0;padding:0;display:grid}
.trilha li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:12px}
.trilha li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--linha)}
.trilha li.feita:not(:last-child)::before{background:var(--azul)}
.marco{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--branco);color:var(--bloqueado);box-shadow:inset 0 0 0 3px var(--linha);font-variant-numeric:tabular-nums}
.feita .marco{background:var(--azul);color:var(--branco);box-shadow:none}
.atual .marco{background:var(--amarelo);color:var(--preto);box-shadow:inset 0 0 0 3px var(--preto)}
.etapa-b{background:none;border:0;padding:6px 0 10px;text-align:left;width:100%;display:grid;gap:2px;color:inherit;min-width:0}
button.etapa-b{cursor:pointer}
button.etapa-b:hover h3{text-decoration:underline}
.etapa-b h3{font-size:19px;font-weight:700}
.etapa-b p{font-size:14px;color:var(--apagado)}
.bloq .etapa-b h3{color:var(--apagado)}
.est{font-size:12px;font-weight:700;color:var(--azul-escuro)}

.player{background:var(--azul-escuro);color:var(--branco);aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;text-align:center;border-radius:6px}
.video-wrap{width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.play{width:0;height:0;border-left:30px solid var(--amarelo);border-top:18px solid transparent;border-bottom:18px solid transparent}
.player h3{font-size:clamp(18px,4vw,24px);color:var(--branco)}
.player p{font-size:13px;opacity:.9}
.lista{display:grid;background:var(--branco);border-radius:6px;overflow:hidden}
.linha{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);justify-content:space-between;flex-wrap:wrap}
.linha:last-child{border-bottom:0}
.linha>div{min-width:0;flex:1 1 200px}
.linha.ativa{background:var(--azul-claro)}
.linha strong{display:block}
.meta{font-size:13px;color:var(--apagado)}
.check{display:flex;gap:7px;align-items:center;font-size:14px;margin:0;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--azul-escuro)}
.bloco{display:grid;gap:12px}

.perg{background:var(--branco);padding:16px;border:0;margin:0;border-radius:6px}
.perg legend{font-weight:700;padding:0;margin-bottom:10px}
.perg .op{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-weight:400;font-size:15px;cursor:pointer;margin:0}
.perg .op input{margin-top:4px;width:auto;accent-color:var(--azul-escuro)}
.mark{font-size:13px;font-weight:700;margin-top:8px}
.resultado{padding:16px;border-radius:6px}
.resultado.ok{background:var(--azul);color:var(--branco)}
.resultado.nao{background:var(--amarelo)}
.resultado h3{font-size:22px;font-weight:800}
.resultado.ok h3 b{color:var(--amarelo)}

.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--linha);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--preto);width:auto}
.chip[aria-pressed=true]{background:var(--azul-escuro);color:var(--branco);box-shadow:none}
.vazio{padding:20px;background:var(--branco);color:var(--apagado);border-radius:6px}

.cert{background:var(--azul);color:var(--branco);padding:clamp(24px,6vw,48px);display:grid;gap:14px;border-radius:6px}
.cert .rot{color:var(--amarelo)}
.cert h2{font-size:clamp(26px,6vw,40px);font-weight:800;color:var(--branco)}
.cert h2 b{color:var(--amarelo)}
.cert .slogan{font-weight:800;font-size:20px;margin-top:10px}
.cert .slogan b{color:var(--amarelo)}

.tab{overflow-x:auto;background:var(--branco);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--apagado);padding:10px 12px;border-bottom:2px solid var(--linha)}
td{padding:10px 12px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
.selo{font-size:12px;font-weight:700;padding:2px 8px;background:var(--azul-claro);color:var(--azul-escuro);border-radius:4px;white-space:nowrap}
.nota-admin{background:var(--amarelo-claro);border-left:4px solid var(--amarelo);padding:12px 14px;font-size:14px;border-radius:4px}
.perigo-box{background:#FBE9EA;border-left:4px solid var(--vermelho);padding:12px 14px;font-size:14px;border-radius:4px;display:grid;gap:10px}
.linha.col{flex-direction:column;align-items:stretch}
.linha audio{width:100%;margin-top:2px}
.sub-vid{font-size:12px;font-weight:700;color:var(--azul-escuro);letter-spacing:.07em;text-transform:uppercase;margin:14px 0 2px}
.sub-vid:first-child{margin-top:0}
.banner-precos{background:var(--amarelo);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.banner-precos div{min-width:0}
.banner-precos h3{font-size:19px;font-weight:800;color:var(--preto)}
.banner-precos p{font-size:13px;color:#6b5e00}
.precos-nota{background:var(--azul-claro);border-left:4px solid var(--azul);padding:12px 14px;border-radius:4px;font-size:14px;display:grid;gap:6px}
.precos-cap{font-size:13px;color:var(--apagado);margin-top:6px}
table.precos td.cult{font-weight:700;color:var(--azul-escuro);white-space:nowrap}
table.precos th.mes,table.precos td.mes{text-align:right;white-space:nowrap}
table.precos th.mes-on,table.precos td.mes-on{background:var(--amarelo-claro)}
table.precos tbody tr:hover td{background:var(--azul-claro)}
table.frete td.val{text-align:right;font-weight:700;white-space:nowrap}
.cond{display:grid;gap:7px;font-size:14px;color:var(--apagado)}
.cond li{margin-left:18px}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--preto);color:var(--branco);padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);z-index:20;border-radius:6px}

@media (max-width:640px){
  .acesso{grid-template-columns:1fr;min-height:0}
  .logo{height:28px}
  .nav button{padding:9px 8px;font-size:14px}
  .secao-nome{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando…</div></div>

<script>
const SB_URL="https://czebmkqbapltmjuhywkd.supabase.co";
const SB_KEY="__KEY__";
const LOGO="__LOGO__";
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true,autoRefreshToken:true}});

const sci=s=>`<span class="sci">${s}</span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const q=(p,ops,c)=>({p,ops,c});
// Provas de certificação (20 questões, geradas no NotebookLM a partir das fontes Barenbrug; 70% = 14)
const QUIZ_SABIA=[
  q("GENÉTICA E ORIGEM DO CULTIVAR O Cultivar Sabiá foi desenvolvido pelo programa de melhoramento genético de forrageiras tropicais da Barenbrug do Brasil. Em relação à sua base biológica, genealogia e método de seleção, assinale a alternativa correta:",["Trata-se de uma seleção massal pura de ecótipo silvestre de Brachiaria brizantha coletada no Cerrado brasileiro e registrada após dois anos de avaliações clonais.","É um híbrido interespecífico resultante do cruzamento artificial entre Brachiaria brizantha e Brachiaria ruziziensis, tendo sua seleção final fixada na 4ª geração de cruzamentos.","Trata-se de uma linhagem sintética obtida pela hibridação de Brachiaria humidicola com Brachiaria decumbens cv. Basilisk após seis retrocruzamentos sucessivos.","É uma cultivar resultante de mutação induzida por radiação sobre sementes comerciais de Brachiaria brizantha cv. Marandu, selecionada especificamente na 2ª geração."],1),
  q("VALIDAÇÃO OFICIAL E PROTOCOLOS DO MAPA Para atender às exigências regulatórias do Ministério da Agricultura e Pecuária (MAPA) para o Registro Nacional de Cultivares (RNC), quais ensaios obrigatórios foram conduzidos com o Cultivar Sabiá?",["Apenas ensaios de campo em parcelas isoladas por um ano, dispensando ensaios com animais por se tratar de planta apomítica.","Ensaios laboratoriais in vitro de digestibilidade ruminal durante 36 meses e avaliação sensorial com ovinos confinados.","Dois anos de ensaios de Valor de Cultivo e Uso (VCU) sob corte comparados a testemunhas comerciais, seguidos da etapa oficial de VCU sob pastejo contínuo para avaliação do desempenho animal.","Quatro anos de ensaios exclusivos de produção de sementes e germinação em câmara climática sem pastejo direto."],2),
  q("ACÚMULO DE FORRAGEM E DESEMPENHO ESTACIONAL VS. MARANDU Em ensaios oficiais conduzidos durante dois anos em cinco ambientes representativos do Brasil Central (Colinas do Tocantins/TO, Pontes e Lacerda/MT, UNEMAT/MT, Uberlândia/MG e Xinguara/PA), qual foi o comportamento produtivo do Sabiá em comparação ao cv. Marandu?",["Produziu exatamente a mesma massa anual, diferenciando-se apenas por menor exigência de adubação fosfatada.","Acumulou em média 18,11 t MS/ha/ano (+34% em relação aos 13,47 t MS/ha/ano do Marandu), superando a testemunha em +31% na época das águas e +42% na estação seca.","Apresentou produção 50% superior na estação chuvosa, porém com queda drástica e inferioridade de 25% na época da estiagem.","Obteve média de 25,50 t MS/ha/ano nas águas e estabilizou em apenas 5% de acúmulo no inverno em todas as regiões."],1),
  q("PRODUÇÃO DE FOLHAS VERDES NA SECA A perda drástica de qualidade da forragem no período de estiagem é o principal fator responsável pelo efeito 'boi sanfona'. Nos ensaios regionais, qual foi a entrega de lâminas foliares (folhas verdes) do Cultivar Sabiá no período seco em comparação ao Marandu?",["Entrega de +50% a mais de toneladas de matéria seca de lâmina foliar no período seco em relação ao Marandu.","Redução de 15% na proporção de folhas verdes, compensada por maior acúmulo de colmo fibroso.","Acúmulo de folhas idêntico ao Marandu, porém com maior teor de umidade no colmo principal.","Produção de lâminas foliares superior apenas quando submetido a irrigação por pivô central durante o inverno."],0),
  q("DISTRIBUIÇÃO ESTACIONAL ANUAL (% ÁGUAS VS. % SECA) A curva de estacionalidade de produção define a capacidade de suporte de uma fazenda ao longo do ano. Como se compara a distribuição percentual anual de forragem entre o Cultivar Sabiá e o Cultivar Marandu?",["Sabiá: 90% águas / 10% seca; Marandu: 70% águas / 30% seca.","Sabiá: 50% águas / 50% seca; Marandu: 50% águas / 50% seca.","Sabiá: cerca de 65% a 66% nas águas e 34% a 35% na seca; Marandu: cerca de 80% nas águas e apenas 19% a 20% na seca.","Sabiá: 40% nas águas e 60% na seca; Marandu: 85% nas águas e 15% na seca."],2),
  q("DESEMPENHO ANIMAL SOB PASTEJO E GANHO DE ARROBAS Nos ensaios de VCU sob pastejo com bovinos de corte, qual foi o ganho de produtividade animal médio nacional e o maior valor regional alcançado pelo Sabiá?",["Média de +2,0 @/ha/ano (+10%), com teto de 20 @/ha/ano em Uberlândia/MG.","Média de +7,0 @/ha/ano (+36,1% em ganho de carne), com teto produtivo de 38,5 @/ha/ano em Xinguara/PA (+11,1 @/ha/ano a mais que o Marandu).","Média de +15,0 @/ha/ano (+80%), com teto de 50 @/ha/ano no Tocantins.","Média de +4,5 @/ha/ano (+18%), atingindo no máximo 27,9 @/ha/ano em Pontes e Lacerda/MT."],1),
  q("POTENCIAL PRODUTIVO E RESPOSTA À ADUBAÇÃO NITROGENADA Em experimento avaliando o incremento de fertilização nitrogenada no Cultivar Sabiá ao elevar a dose de 50 kg de N/ha para 200 kg de N/ha, quais foram os resultados observados no acúmulo de biomassa?",["Incremento de apenas 10% na massa total, demonstrando baixa capacidade responsiva ao nitrogênio.","Ocorrência de acamamento precoce sem alteração estatística no acúmulo de lâminas foliares.","Incremento de 44,8% (cerca de 45%) no acúmulo total de forragem e de 77,5% (quase o dobro) no acúmulo de lâminas foliares.","Redução de 20% na relação folha/colmo em virtude do alongamento hipertrofiado dos entrenós."],2),
  q("RESISTÊNCIA BIOLÓGICA A CIGARRINHAS-DAS-PASTAGENS Em ensaios entomológicos controlados em gaiolas para mensuração de notas de dano por cigarrinhas (escala de 1 a 5, onde 1 = altamente resistente e 5 = altamente suscetível), como o Sabiá se comportou frente às espécies Notozulia entreriana e Mahanarva fimbriolata (cigarrinha-da-cana)?",["Apresentou nota 5 (morte total de perfilhos) para ambas as espécies, demonstrando alta suscetibilidade.","Apresentou nota 2 (altamente resistente com sintomas mínimos de clorose foliar), superando o Marandu (nota 3) e o Basilisk/Decumbens (nota 4) para Mahanarva.","Mostrou-se resistente à Notozulia, mas totalmente suscetível à Mahanarva fimbriolata com nota de dano 4.","Comportou-se de forma idêntica à Brachiaria decumbens cv. Basilisk, necessitando de pulverização química preventiva constante."],1),
  q("PASTEJO DIFERIDO (VEDAÇÃO DE PASTO) NO IFTO No ensaio de pastejo diferido conduzido pelo IFTO em Colinas do Tocantins (TO), simulando vedação iniciada em 20 de março ao longo de 168 dias de estiagem, qual foi o acúmulo de matéria seca alcançado pelo Sabiá?",["Produção entre 11 e 14,7 toneladas de MS/ha ao longo dos cortes periódicos, superando o Marandu e a B. decumbens.","Produção constante de apenas 5 toneladas de MS/ha devido à senescência precoce das touceiras aos 56 dias.","Produção inferior à Brachiaria decumbens após 84 dias de diferimento por perda excessiva de colmos basais.","Acúmulo máximo de 8 t MS/ha restrito ao corte inicial de 56 dias, caindo a zero aos 168 dias."],0),
  q("QUALIDADE DA FORRAGEM NO DIFERIMENTO PROLONGADO Ao final dos 168 dias de pastejo diferido no ensaio do IFTO, quais foram os diferenciais de proporção e acúmulo de lâminas foliares do Sabiá em relação às testemunhas (Marandu e Decumbens)?",["Proporção de folhas 50% menor, com acúmulo de folhas 10% inferior ao Marandu.","Mais de 100% de proporção de lâmina foliar e mais de 130% de acúmulo de matéria seca de folhas ao término da seca.","Ausência total de folhas verdes remanescentes, acumulando apenas bainhas e inflorescências secas.","Comportamento idêntico à Decumbens em massa de folhas, porém com colmos 40% mais lignificados."],1),
  q("BIOMASSA RADICULAR E RESISTÊNCIA À SECA (PAVESI & HENRIQUE) Nos dados de pesquisa de biomassa subterrânea e aérea sob diferimento (maio a outubro) conduzidos pelos professores Raphael Pavesi e Esdras Henrique (IFTO), como o Sabiá se destacou frente ao Marandu?",["Produziu menor massa de raízes (3,0 t MS/ha vs 5,0 t MS/ha do Marandu), concentrando energia apenas nas folhas.","Acumulou em média 6,4 t MS/ha de raízes vs 4,1 t MS/ha do Marandu (+56% ou +2,3 t/ha de raiz) e 3,2 t MS/ha de folhas vs 2,4 t do Marandu (+33%).","Apresentou sistema radicular pivotante profundo, porém com massa seca de raízes idêntica à do capim Marandu.","As raízes se degradaram integralmente no mês de agosto (140 dias de diferimento) em solos arenosos."],1),
  q("MANEJO DO PASTEJO ROTACIONADO Para maximizar a interceptação luminosa (95% de IL), evitar o alongamento de colmo e garantir rápida rebrota no pastejo rotacionado do Sabiá, quais são as alturas recomendadas de entrada e saída dos animais?",["Entrada a 50 cm e saída a 35 cm.","Entrada a 40 cm e saída a 25 cm.","Entrada a 30 cm e saída entre 15 e 20 cm.","Entrada a 20 cm e saída a 5 cm (pastejo rente ao solo)."],2),
  q("MANEJO EM PASTEJO CONTÍNUO E AJUSTE DE CARGA No sistema de pastejo contínuo com lotação variável, qual é a altura média de manejo alvo para o dossel do Sabiá e qual decisão operacional deve ser tomada caso o pasto ultrapasse os 30 cm de altura?",["Manter entre 10 e 15 cm; se ultrapassar 30 cm, deve-se retirar o gado e realizar roçada mecânica imediata.","Manter entre 25 e 30 cm; caso a altura média ultrapasse 30 cm, deve-se aumentar a carga animal (colocar mais animais) para colher o excedente de forragem antes que haja perda de qualidade.","Manter entre 40 e 50 cm; se ultrapassar 30 cm, deve-se suspender o fornecimento de sal mineral no cocho.","Manter a 15 cm contínuos; alturas acima de 30 cm indicam superpastejo e exigem adubação de cobertura."],1),
  q("PROFUNDIDADE DE SEMEADURA E EMERGÊNCIA A semeadura incorreta é uma das maiores causas de insucesso na implantação de pastagens. Qual é a regra estrita de profundidade para a deposição das sementes do Cultivar Sabiá?",["De 4 a 6 cm, para proteger as sementes contra a dessecação solar e ataque de pássaros.","De 1 a 2 cm de profundidade, nunca ultrapassando 2 cm para não retardar a emergência e não comprometer o estande de plantas.","Apenas na superfície sem nenhuma incorporação ou compactação, independentemente do implemento.","De 3 a 5 cm em solos arenosos e de 0,5 cm em solos argilosos pesados."],1),
  q("TAXAS DE SEMEADURA (KG/HA) E MÉTODOS DE PLANTIO A recomendação técnica da taxa de semeadura do Cultivar Sabiá varia de acordo com as condições de preparo de solo, tecnologia de maquinário e método de plantio. Quais são as taxas preconizadas?",["Taxa única de 5 kg/ha para qualquer condição de relevo e método de distribuição.","10 kg/ha para condição ideal (plantio em linha com boa regulagem); 12 kg/ha para condição intermediária; e 15 kg/ha para condições adversas, áreas de morro, semeadura a lanço ou via drone/avião.","20 kg/ha em linha e 30 kg/ha a lanço para compensar sementes sem tratamento.","8 kg/ha exclusivo para semeadura aérea e 18 kg/ha para plantio direto com dessecação prévia."],1),
  q("MOMENTO E MANEJO DO PRIMEIRO PASTEJO Após a emergência do Cultivar Sabiá, em quanto tempo deve ser realizado o primeiro pastejo e qual é a diretriz zootécnica correta para essa operação?",["Aos 30 dias após o plantio, utilizando vacas pesadas e touros para acamar todo o capim.","Apenas após 180 dias de plantio, quando as plantas já tiverem produzido sementes maduras.","Entre 60 e 90 dias após a emergência, utilizando animais jovens e leves para realizar o desponte do capim e estimular o perfilhamento basal sem arrancar as plantas.","Aos 120 dias, com taxa de lotação máxima para rebaixar o capim até 5 cm do solo."],2),
  q("RESTRIÇÕES AGRONÔMICAS CRÍTICAS E DRENAGEM Embora o Cultivar Sabiá seja altamente rústico e adaptável, existe uma contraindicação agronômica severa onde seu plantio NÃO deve ser realizado. Assinale-a:",["Solos com saturação por bases (V%) entre 50% e 60%.","Solos sujeitos a encharcamento prolongado, várzeas ou regiões com má drenagem onde a chuva acumulada ultrapassa 300 mm/mês sem escoamento (situações onde se indica B. humidicola).","Áreas com precipitação anual entre 1.000 mm e 1.500 mm no Centro-Oeste.","Sistemas de consórcio com milho safrinha em espaçamento entrelinhas de 50 cm."],1),
  q("EXIGÊNCIAS DE FERTILIDADE E CORREÇÃO DE SOLO Quais são os parâmetros químicos de fertilidade de solo recomendados para permitir a expressão do potencial genético do Cultivar Sabiá?",["Solos de baixíssima fertilidade com V% de 20%, P de 1 mg/dm³ e tolerância ilimitada a alumínio tóxico.","Solos de média a alta fertilidade, com saturação por bases (V%) entre 50% e 60%, teor de fósforo [P] mínimo de 5 mg/dm³ e potássio [K] entre 3% e 5% da CTC.","Solos agrícolas ultraexigentes com V% acima de 80%, semelhantes à alfafa irrigada.","Necessidade restrita de solos hidromórficos com alto teor de matéria orgânica não mineralizada."],1),
  q("DENSIDADE DE PERFILHAMENTO E FISIOLOGIA DO BOCADO Nos dados de pesquisa da Universidade Federal de Uberlândia (UFU), qual foi a contagem média de perfilhos do Sabiá em relação ao Marandu nas estações das águas e seca, e qual é o impacto disso no pastejo animal?",["Sabiá: 500 perfilhos/m² nas águas e 400 na seca; Marandu: 800 e 700; o gado precisa dar mais passos para encher o rúmen.","Sabiá: 850 perfilhos/m² nas águas e 760 na seca; Marandu: 760 nas águas e 600 na seca; mais pontos de crescimento aumentam a massa do bocado e fazem o animal caminhar menos para se alimentar.","Ambas as cultivares apresentaram exatamente 650 perfilhos/m² nas duas épocas do ano.","O Sabiá não produz perfilhos vegetativos na seca, emitindo exclusivamente perfilhos reprodutivos com sementes."],1),
  q("FLORESCIMENTO TARDIO E MANEJO NA TRANSIÇÃO ÁGUAS-SECA O Cultivar Sabiá apresenta florescimento tardio no Brasil Central (a partir de abril). Qual é a principal vantagem zootécnica e operacional dessa característica fenológica para o produtor?",["Permite colher sementes comerciais no auge do verão (janeiro), antes do florescimento das plantas invasoras.","Induz a lignificação antecipada do dossel, transformando as folhas em palhada seca antes de maio.","Reduz a perda de valor nutritivo da forragem no final do período chuvoso, mantendo colmos macios e folhas verdes durante a transição crítica entre águas e seca.","Impede que a planta responda a qualquer adubação nitrogenada realizada após o mês de fevereiro."],2)
 ];
const QUIZ_CAYANA=[
  q("A Brachiaria híbrida cv. Cayana foi desenvolvida através de um programa pioneiro de melhoramento genético de forrageiras tropicais no Brasil. Do ponto de vista botânico e genético, assinale a alternativa que descreve corretamente a genealogia e a obtenção dessa cultivar:",["Trata-se de um híbrido simples F1 resultante do cruzamento direto entre Brachiaria decumbens e Brachiaria humidicola.","É uma seleção massal intracultivar a partir de populações naturais de Brachiaria brizantha coletadas nas savanas africanas.","É um híbrido interespecífico resultante do cruzamento entre Brachiaria brizantha e Brachiaria ruziziensis, selecionado na 5ª geração de cruzamentos (F5) após múltiplos ciclos de seleção.","Consiste em uma mutação induzida por radiação aplicada sobre sementes pré-germinadas de Brachiaria brizantha cv. Marandu."],2),
  q("Para que um novo cultivar forrageiro seja devidamente registrado e comercializado no Brasil, o Ministério da Agricultura e Pecuária (MAPA) exige o cumprimento rigoroso de ensaios oficiais de Valor de Cultivo e Uso (VCU). Sobre o protocolo executado para o cv. Cayana, assinale a afirmação correta:",["Foram realizados exclusivamente ensaios em parcelas sob corte mecânico por 12 meses em casa de vegetação.","O desenvolvimento contemplou 2 anos de ensaios de VCU sob corte e, subsequentemente, 2 anos de ensaios de VCU sob pastejo com avaliação contínua de desempenho animal na Fazenda Experimental Capim Branco (UFU).","O registro oficial foi concedido por equiparação agronômica aos dados históricos do capim Basilisk, dispensando ensaios com animais.","Os ensaios de VCU sob pastejo foram realizados exclusivamente sob irrigação por pivô central com suplementação concentrada em confinamento."],1),
  q("O cv. Cayana é frequentemente caracterizado pelos pesquisadores como uma 'máquina de perfilar'. Em avaliações agronômicas comparativas no período das águas frente ao cv. Marandu, qual é a densidade de perfilhamento atingida pelo Cayana e qual sua implicação direta no manejo?",["Atinge até 985 perfilhos/m², superando o Marandu em cerca de 200 perfilhos/m², promovendo rápido fechamento de solo, forte supressão de plantas daninhas e maior densidade de pontos de crescimento.","Produz exatamente 450 perfilhos/m², apresentando menor densidade que o Marandu, porém com colmos mais grossos e fibrosos.","Atinge 1.500 perfilhos/m² exclusivamente no período de seca severa, cessando completamente a emissão de novos perfilhos durante o período chuvoso.","O perfilhamento é exclusivamente estolonífero subterrâneo, o que impede a apreensão forrageira por bovinos sob pastejo rotacionado."],0),
  q("A época de florescimento de uma gramínea forrageira afeta diretamente o valor nutricional do pasto no início do período seco. Em relação à fenologia do cv. Cayana no Brasil Central, assinale a alternativa correta:",["Apresenta florescimento precoce em dezembro e janeiro, exigindo dessecação imediata no início do verão.","Floresce abundantemente em fevereiro e março, com comportamento idêntico ao cv. Marandu e à B. decumbens.","Possui florescimento tardio, concentrado a partir de abril e maio, o que preserva a qualidade forrageira e reduz drasticamente a perda nutricional na transição das águas para a seca.","É uma planta completamente estéril que não desenvolve inflorescências sob nenhuma condição fotoperiódica."],2),
  q("Durante as avaliações estruturais de dossel sob pastejo, a cultivar Cayana destacou-se pela alta proporção de lâminas foliares em relação ao tecido de suporte (colmos/bainhas). Qual o impacto zootécnico direto dessa característica morfológica?",["Obriga o animal a despender maior tempo de ruminação devido ao excesso de lignina presente na lâmina foliar.","Favorece a facilidade de apreensão do bocado, maximizando a ingestão de matéria seca com menor gasto energético de pastejo e acelerando a passagem ruminal.","Reduz a taxa de lotação por hectare em 50% em decorrência da quebra prematura de colmos no pastejo contínuo.","Estimula o consumo preferencial de colmos maduros pelo gado em detrimento das folhas jovens."],1),
  q("Em ensaios oficiais de campo conduzidos sob condições edafoclimáticas favoráveis e alta fertilidade do solo, qual é a faixa de acúmulo de forragem (t de Matéria Seca/ha/ano) documentada para o cv. Cayana e como ela se compara às testemunhas?",["Produz entre 3,0 e 5,0 t MS/ha/ano, apresentando teto produtivo similar a pastagens nativas de campo sujo.","Produz entre 9,7 e 24,8 t MS/ha/ano, chegando a produzir até 8 a 9 toneladas de matéria seca a mais por hectare ao ano do que o cv. Marandu nos ensaios oficiais.","Atinge 45,0 t MS/ha/ano de matéria seca independentemente da realização de adubação ou do tipo de solo.","Acumula exatamente o mesmo volume de biomassa que a B. decumbens cv. Basilisk em todas as estações do ano."],1),
  q("Em experimentos de dose-resposta à adubação nitrogenada avaliando a aplicação de 50 kg/ha de N contra 200 kg/ha de N no cv. Cayana, quais foram os impactos percentuais observados no acúmulo total e na produção de folhas?",["O incremento de nitrogênio provocou intoxicação por nitrato sem aumento na produção de forragem.","A produção total de forragem elevou-se em 15%, enquanto a produção de lâminas foliares decresceu pela metade.","O acúmulo total de forragem aumentou em 63%, enquanto o acúmulo de lâminas foliares mais do que dobrou (+100%), comprovando elevada eficiência de conversão nutricional.","O nitrogênio aumentou apenas a produção de raízes profundas, mantendo constante a biomassa aérea."],2),
  q("A sazonalidade de produção de forragem é o principal fator causador do efeito 'boi sanfona'. No cv. Cayana, qual é a proporção média de distribuição de biomassa entre as épocas das águas e da seca e qual a vantagem sobre o Marandu?",["Produz 95% nas águas e apenas 5% na seca, paralisando totalmente a rebrota no outono.","Produz cerca de 70% nas águas e aproximadamente 30% na seca, mantendo até 10 pontos percentuais a mais de produção na seca quando comparado ao cv. Marandu.","Distribui exatamente 50% nas águas e 50% na seca de forma homogênea nos doze meses do ano.","A produção na seca é 100% constituída por colmos secos sem presença de lâminas foliares ativas."],1),
  q("Em ensaios entomológicos controlados avaliando a sobrevivência ninfal e danos por notas contra os gêneros Notozulia e Mahanarva, como se comportou o cv. Cayana em comparação às testemunhas?",["Foi classificado como altamente suscetível (nota máxima de dano/morte), com desempenho inferior à B. decumbens cv. Basilisk.","Demonstrou alta resistência (nota 1 a 2) contra Notozulia e resistência superior à Mahanarva (cigarrinha-da-cana), igualando-se ou superando cultivares resistentes consagrados como o Marandu.","É resistente apenas se forem realizadas pulverizações químicas quinzenais de inseticidas sistêmicos na área.","Apresenta tolerância temporária apenas contra pulgões, sendo completamente destruído por ninfas de Notozulia."],1),
  q("Na Fazenda Apoena (Mundo Novo/GO), o cv. Cayana foi submetido a condições reais de pressão de pragas e seca durante o período de março a setembro. Qual foi o resultado prático obtido?",["O pasto foi dizimado por cigarrinhas, forçando a venda emergencial de todo o rebanho.","Foi necessária a aplicação de quatro pulverizações de inseticidas para salvar o estande de plantas.","A fazenda optou por não pulverizar a área mesmo sob infestação regional de cigarrinhas, e o Cayana suportou a pressão sem perdas, mantendo 90 machos com taxa de lotação de 2,5 UA/ha na seca e ganho de 2 arrobas por cabeça.","Os animais perderam peso continuamente devido à rejeição forrageira provocada pela toxina das cigarrinhas."],2),
  q("A qualidade da dieta ingerida determina a taxa de conversão alimentar no rúmen. Quais são os índices oficiais médios de Proteína Bruta (PB) e Digestibilidade in vitro da Matéria Seca documentados para o cv. Cayana?",["PB de 4,0% a 6,0% na MS total; Digestibilidade de 45,0% a 50,0%.","PB de 11,9% a 13,1% na MS total (atingindo 13,6% na lâmina foliar); Digestibilidade entre 76,1% e 80,1% na MS total (atingindo 80,6% a 81,1% na lâmina foliar).","PB fixa de 22,0% com digestibilidade inferior a 30,0% devido ao acúmulo de sílica epidérmica.","PB de 8,0% exclusiva para colmos senescentes, com digestibilidade nula na lâmina foliar."],1),
  q("Nos ensaios oficiais de VCU sob pastejo conduzidos por dois anos na Universidade Federal de Uberlândia (UFU), qual foi o incremento de ganho de peso proporcionado pelo cv. Cayana em relação ao cv. Marandu?",["Produziu exatamente 1 arroba a menos por hectare devido à maior exigência em lotação.","Entregou 8 arrobas a mais por hectare ao ano, representando um acréscimo de 42,2% na produtividade de carne sob os mesmos recursos de adubação.","Aumentou a produção de carne em 150%, produzindo mais de 60 arrobas/ha/ano sem pastejo.","O ganho de peso foi idêntico ao do Marandu, diferenciando-se apenas na cor da forragem."],1),
  q("Ao analisar isoladamente o período de estiagem nos ensaios oficiais sob pastejo animal, como se comportou o cv. Cayana frente ao capim Marandu?",["O Cayana produziu 66% a mais de carne na época seca, entregando cerca de 4,75 @/ha contra 2,86 @/ha da testemunha (aproximadamente 2 @/ha a mais).","Os animais perderam 1,5 kg/dia no Cayana devido ao desfolhamento precoce das plantas.","A produção de carne na seca foi nula em ambos os cultivares devido à paralisação das pesagens.","O Marandu produziu o dobro de arrobas que o Cayana durante o período seco."],0),
  q("Em experimento de pastejo diferido (vedação de pasto em 20 de março) conduzido em Colinas do Tocantins (IFTO), quais atributos do cv. Cayana garantiram sua superioridade até setembro?",["Rápida lignificação que tornou o capim duro e impalátavel, impedindo o acamamento das touceiras.","Manutenção de massa seca de 10 a 14 t/ha com superioridade consistente na porcentagem de lâminas foliares (de 10% a 68% mais folhas) e mais de 40% de acúmulo de folhas na média das avaliações.","Florescimento precoce que produziu sementes para alimentação direta dos bovinos no cocho.","Secamento total da parte aérea simulando feno em pé sem valor protéico."],1),
  q("As sementes comerciais do cv. Cayana são fornecidas com tecnologia industrial exclusiva de tratamento e incrustação Yellow Jacket®. Quais componentes integram essa tecnologia e qual sua função agronômica?",["Corante vegetal inerte com a única finalidade de identificar a marca no momento do plantio.","Tratamento em camadas contendo pureza mínima de 95%, fungicidas, inseticidas de amplo espectro, bioestimulantes e complexo de macro e micronutrientes para acelerar o enraizamento e proteger a plântula.","Camada espessa de gesso agrícola que reduz o valor cultural da semente para menos de 40%.","Inoculante bacteriano exclusivo para fixação de nitrogênio em leguminosas de clima temperado."],1),
  q("Para a correta formação de pastagem com o cv. Cayana, quais são as recomendações oficiais de taxa de semeadura (kg/ha) e profundidade de deposição da semente no solo?",["Taxa de 3 a 5 kg/ha semeados a 5 a 8 cm de profundidade com arado de aiveca.","Taxa de 10 kg/ha para condições ideais, 12 kg/ha para condições intermediárias e 15 kg/ha para condições adversas, incorporados impreterivelmente na profundidade de 1 a 2 cm.","Taxa fixa de 30 kg/ha depositados exclusivamente na superfície sem nenhuma incorporação ou compactação.","Taxa de 2 kg/ha misturados com defensivo hormonal e enterrados a 10 cm."],1),
  q("Para maximizar a eficiência de colheita da forragem sem comprometer a estrutura e a rebrota vigorosa do dossel, quais são as alturas-alvo de manejo recomendadas para o cv. Cayana?",["Rotacionado: entrada a 50 cm e saída a 5 cm; Contínuo: manter o pasto entre 10 e 15 cm.","Rotacionado: entrada a 32 cm e saída entre 16 e 20 cm; Contínuo: manter o dossel na faixa de 30 a 35 cm.","Rotacionado: entrada a 20 cm e saída a 2 cm; Contínuo: manter acima de 60 cm para forçar tombamento.","O manejo da Cayana não se baseia em alturas, devendo ser desfolhado até o nível do solo em qualquer época."],1),
  q("O cv. Cayana é uma forrageira exigente em fertilidade e responsiva à intensificação. Para atingir seu teto produtivo de 24 t MS/ha/ano, quais são as metas mínimas de correção química do solo recomendadas pelo melhorista Dr. Ulisses Figueiredo?",["Saturação por bases (V%) entre 25% e 35%, Fósforo (P) abaixo de 2 ppm e Potássio (K) em 0,5% da CTC.","Saturação por bases (V%) acima de 60%, Fósforo (P) no solo de no mínimo 7 ppm e Potássio (K) representando de 3% a 5% da CTC.","Dispensa correção de calcário e adubação fosfatada, necessitando apenas de aplicação de micronutrientes foliares.","Exige obrigatoriamente solo hidromórfico ácido com saturação por alumínio (m%) superior a 40%."],1),
  q("Apesar de seus excepcionais índices zootécnicos, em quais ambientes o cv. Cayana possui restrição estrita de uso e NÃO deve ser indicado pelos consultores técnicos?",["Áreas de altitude acima de 500 metros com solos corrigidos e planos.","Solos sujeitos a encharcamento/alagamento temporário (baixa tolerância à má drenagem) e regiões semiáridas com menos de 800 mm de chuva anual ou mais de 6 meses de seca severa sem manejo.","Sistemas de integração lavoura-pecuária com milho safrinha em solos argilosos férteis.","Propriedades leiteiras que utilizam adubação nitrogenada pós-pastejo."],1),
  q("Em sistemas de Integração Lavoura-Pecuária (ILP) consorciando o cv. Cayana na entrelinha do milho safrinha, qual é a dinâmica de desenvolvimento inicial da forrageira e o manejo de dessecação preconizado?",["O Cayana tem crescimento inicial explosivo que abafa o milho nos primeiros 10 dias, inviabilizando qualquer consórcio.","Em milho espaçado a 50 cm, o sombreamento natural da cultura segura o capim (cujo crescimento inicial é mais tardio), dispensando herbicida; em espaçamentos largos (70-80 cm), maior incidência de luz exige monitoramento e possível subdoses de herbicida por precaução.","Deve-se dessecar totalmente a Cayana com dose cheia de glifosato antes da colheita do milho para não prejudicar as colheitadeiras.","O consórcio só funciona se o capim for semeado 45 dias antes da semeadura do milho."],1)
 ];
const QUIZ_CARCARA=[
  q("Sobre a classificação botânica e o histórico de melhoramento genético do cultivar Carcará desenvolvido pela Barenbrug, é correto afirmar:",["Trata-se de uma seleção massal tradicional de Brachiaria brizantha importada diretamente do continente africano.","É um híbrido intraespecífico de Megathyrsus maximus (syn. Panicum maximum) resultante de mais de 10 anos de rigorosos estudos laboratoriais e avaliações a campo.","Trata-se de uma variedade transgênica de Panicum com resistência introduzida quimicamente a herbicidas totais.","É um cruzamento interespecífico estéril entre Panicum e Brachiaria humidicola sem necessidade de manejo de fertilidade."],1),
  q("Durante as etapas experimentais que antecederam o lançamento comercial do Carcará, qual foi a metodologia oficial adotada para validação agronômica?",["Ensaios exclusivos de laboratório em casa de vegetação durante 6 meses, sem contato direto com pastejo ou animais.","Testes rápidos a lanço sem repetições nem delineamento experimental formal em uma única propriedade.","Protocolo sequencial em etapas compreendendo Fase C (ensaios sob corte regional de 2 anos), Fase G (ensaios de VCU sob pastejo com animais em parcelas de 2,0 ha) e Fase T (validação agronômica em escala de fazenda comercial).","Apenas levantamentos bibliográficos com base nas tabelas zootécnicas do cultivar Mombaça."],2),
  q("Nos ensaios regionais em múltiplos ambientes pelo Brasil (como Guaíra/SP, Araguaína/TO e Xinguara/PA), qual característica de adaptação a solos o Carcará comprovou:",["Exclusividade em solos hiperargilosos de várzea inundada com acidez extrema e sem calagem.","Ampla adaptabilidade e estabilidade de produção tanto em solos de textura argilosa quanto arenosa, desde que com as devidas correções de nutrientes.","Baixíssima resposta à adubação em solos corrigidos, exigindo apenas solos naturalmente inférteis.","Incompatibilidade total com regiões tropicais quentes de alta radiação solar."],1),
  q("Qual é a proposta de valor central e o posicionamento de mercado do Panicum híbrido cv. Carcará para a fazenda do produtor rural?",["Capim de baixo investimento focado exclusivamente em áreas marginais e pastagens extensivas degradadas sem adubação.","Forrageira de ciclo anual para cobertura temporária de inverno sem viabilidade zootécnica.","Ferramenta para intensificação e alta performance, focada em maximizar o acúmulo de lâminas foliares, o rendimento animal e a rentabilidade do sistema de produção.","Espécie voltada exclusivamente para a contenção de voçorocas e erosões em taludes de estradas."],2),

async function carregarCidades(uf){
  if(!uf||S.cidadesCache[uf]) return;
  S.cidadesCache[uf]="__LOADING__";
  try{
    const r=await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
    const j=await r.json();S.cidadesCache[uf]=j.map(x=>x.nome);
  }catch(e){ S.cidadesCache[uf]="__ERRO__"; }
}
function preloadCidades(perfil){
  schemaDoPerfil(perfil).filter(c=>c.t==="cidade").forEach(c=>{
    const uf=formAtual()[c.uf];
    if(uf&&!S.cidadesCache[uf]){ carregarCidades(uf).then(render); }
  });
}

/* ---------- boot ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){render();return;}
  await carregarUsuario(session.user);
  render();
}
async function carregarUsuario(u){
  S.user=u;
  let {data:prof}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(!prof){
    await sb.from("profiles").insert({id:u.id,nome:(u.email||"").split("@")[0],email:u.email});
    ({data:prof}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle());
  }
  S.profile=prof||{};S.perfil=(prof&&prof.perfil)||"RC";S.form=null;S.formAlvo="form";
  const {data:prog}=await sb.from("progresso").select("etapa,nota").eq("user_id",u.id);
  S.feitas=(prog||[]).map(r=>r.etapa);
  S.notas={};(prog||[]).forEach(r=>S.notas[r.etapa]=r.nota);
  S.secao=null;S.pag="hub";
}

    return `<div>${lbl}<select id="f_${c.k}" data-fk="${c.k}" ${dis} ${c.req?"required":""}>${inner}</select></div>`;

  if(c.t==="select") return `<div>${lbl}<select id="f_${c.k}" data-fk="${c.k}" ${c.req?"required":""}><option value="">Selecione…</option>${c.o.map(o=>`<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;

  const frete=FRETE.map(f=>`<tr><td><strong>${f.uf}</strong></td><td class="val">${f.f}</td><td class="val">${f.frac}</td></tr>`).join("");
  return `${voltar}
  <div><span class="rot">Safra 26/27 · Out/26-01</span><h1 class="titulo">Tabela de preços</h1><p class="sub">Preços ao produtor rural, em <strong>R$/kg</strong>. O <strong>mês de pagamento</strong> indica o preço de referência na tabela — destacado o mês atual (${PRECOS_MESES[PRECOS_MES_ATUAL]}).</p></div>
  <section class="bloco"><h2 class="sec">Preços ao produtor (R$/kg)</h2>
    <div class="tab"><table class="precos"><thead><tr><th>Cultivar</th><th>Código</th><th>Gênero/Categoria</th><th>Tratamento</th><th>Embalagem</th>${th}</tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="precos-cap">Tratamento da ruziziensis inclui nematicida biológico (Yellow Jacket®).</p></section>
  <section class="bloco"><h2 class="sec">Tabela de frete (R$/kg)</h2>
    <div class="tab"><table class="frete"><thead><tr><th>UF / Região</th><th class="val">Frete (R$/kg)</th><th class="val">Fracionado até 1.000 kg</th></tr></thead><tbody>${frete}</tbody></table></div></section>
  <div class="precos-nota"><strong>Condições gerais</strong>
    <div class="cond"><ul style="margin:0;padding:0;list-style:disc"><li>Preços <strong>CIF</strong> para cargas fechadas acima de 15 t (exceto Roraima). Volumes menores: <strong>FOB</strong> Guaíra–SP + frete da tabela acima.</li>
    <li>Entrega em fazenda somente com carga fechada e estradas em boas condições (anexar roteiro e km).</li>
    <li>Descontos por canal de vendas seguem a política vigente — consulte o responsável comercial da região.</li>
    <li>Inadimplência: multa de 2,0% + juros de mora de 2,0% ao mês, pro rata die.</li>
    <li>Esta tabela cancela as versões anteriores e pode ser revogada a qualquer momento, sem aviso prévio.</li></ul></div></div>
  <div class="acoes"><a class="btn sec" href="materiais/tabela-precos-out26.pdf" target="_blank" rel="noopener">Baixar PDF original ↗</a></div>`;
}
function vBase(){
  const b=S.busca.toLowerCase();
  const txtPlano=s=>String(s).replace(/<[^>]+>/g,"").toLowerCase();
  const mats=MATERIAIS.filter(x=>(S.fCult==="Todos"||x.c===S.fCult)&&(S.fTipo==="Todos"||x.tipo===S.fTipo)&&txtPlano(x.n).includes(b));
  const vids=VIDEOS_BASE.filter(x=>(S.fCult==="Todos"||x.c===S.fCult)&&(S.fTipo==="Todos"||S.fTipo==="Vídeo")&&txtPlano(x.t).includes(b));
  const vatual=S.baseVideo?VIDEOS_BASE.find(x=>x.yt===S.baseVideo):null;
  const chips=(a,sel,act)=>a.map(x=>`<button class="chip" data-a="${act}" data-v="${x}" aria-pressed="${sel===x}">${x}</button>`).join("");
  const mostraMat=S.fTipo==="Todos"||["Apostila","Podcast","Tabela"].includes(S.fTipo);
  const mostraVid=S.fTipo==="Todos"||S.fTipo==="Vídeo";
  const vidRow=x=>`<div class="linha ${x.yt===S.baseVideo?"ativa":""}"><div><strong>${x.t}</strong><span class="meta">${x.c} · Vídeo</span></div><button class="link" data-a="bvideo" data-v="${x.yt}">${x.yt===S.baseVideo?"Assistindo":"Assistir"}</button></div>`;
  let vidHTML="";
  if(vids.length){ VID_GRUPOS.forEach(g=>{const gl=vids.filter(v=>v.g===g); if(gl.length) vidHTML+=`<div class="sub-vid">${g}</div><div class="lista">${gl.map(vidRow).join("")}</div>`;}); }
  else vidHTML=`<div class="vazio">Nenhum vídeo encontrado.</div>`;
  return `<div><h1 class="titulo">Base de conhecimento</h1><p class="sub">Vídeos e materiais de apoio à venda dos híbridos, liberados desde o primeiro acesso.</p></div>
  <div class="banner-precos"><div><h3>Tabela de preços — Safra 26/27</h3><p>Preços ao produtor e frete por região, sempre à mão.</p></div><button class="btn preto" data-a="precos">Ver tabela</button></div>
  <div><label for="busca">Buscar na base</label><input id="busca" type="search" value="${esc(S.busca)}" placeholder="Ex.: Cayana, estresse hídrico, apostila, fazenda"></div>
  <div class="filtros">${chips(["Todos","Sabiá","Cayana","Carcará","Geral"],S.fCult,"fcult")}</div>
  <div class="filtros">${chips(["Todos","Vídeo","Apostila","Podcast","Tabela"],S.fTipo,"ftipo")}</div>
  ${mostraVid?`<section class="bloco"><h2 class="sec">Vídeos</h2>
    ${vatual?`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${vatual.yt}?rel=0" title="${esc(vatual.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:""}
    ${vidHTML}</section>`:""}
  ${mostraMat?`<section class="bloco"><h2 class="sec">Materiais</h2>
    <div class="lista" id="res-base">${mats.length?mats.map(matHTML).join(""):`<div class="vazio">Nenhum material encontrado.</div>`}</div></section>`:""}`;
}
function vCert(){
  return `<button class="voltar" data-a="pag" data-v="trilha">‹ Trilha</button><section class="cert"><span class="rot">Certificado de conclusão</span><h2>Academia de <b>Híbridos</b> Barenbrug</h2><p>Certificamos que <strong>${esc(S.profile.nome||S.user.email)}</strong> concluiu a trilha de Sabiá, Cayana e Carcará${S.notas.prova!=null?", com "+S.notas.prova+" acertos na prova final":""}.</p><p class="slogan">CULTIVE <b>CONFIANÇA</b></p></section>`;
}
function vCriarAcesso(){
  const r=S.novoAcesso;
  return `<section class="bloco"><h2 class="sec">Cadastrar pessoa</h2>
  <p class="sub" style="margin:0">Crie o acesso com nome, e-mail e perfil. O sistema gera uma senha provisória para você enviar à pessoa.</p>
  <form class="form-card" id="f-criar">
    <div><label for="n_nome">Nome completo *</label><input id="n_nome" required></div>
    <div><label for="n_email">E-mail *</label><input id="n_email" type="email" required></div>
    <div><label for="n_perfil">Perfil *</label><select id="n_perfil" required>${PERFIS.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("")}</select></div>
    ${S._erroCriar?`<div class="erro" role="alert">${esc(S._erroCriar)}</div>`:""}
    <div><button class="btn" type="submit">Criar acesso</button></div>
  </form>
  ${r?`<div class="nota-admin"><strong>Acesso criado.</strong> Envie estes dados para a pessoa — a senha aparece só uma vez:<br>E-mail: <strong>${esc(r.email)}</strong><br>Senha provisória: <strong>${esc(r.senha)}</strong></div>`:""}
  </section>`;
}
function vAcomp(){
  if(!S.equipe)return `<div class="carregando">Carregando equipe…</div>`;
  const nEtapa=x=>x.feitas>=ORDEM.length?"Concluiu":(ETAPAS[x.feitas]?ETAPAS[x.feitas].n:"—");
  const conc=S.equipe.filter(x=>x.feitas>=ORDEM.length).length;
  return `<div><h1 class="titulo">Acompanhamento</h1><p class="sub">${S.equipe.length} pessoas com acesso · ${conc} concluíram a trilha.</p></div>
  ${vCriarAcesso()}
  <section class="bloco"><h2 class="sec">Pessoas</h2><div class="tab"><table><thead><tr><th>Pessoa</th><th>Perfil</th><th>Etapa atual</th><th>Concluídas</th><th>Prova</th><th></th></tr></thead><tbody>${S.equipe.map(x=>`<tr><td>${esc(x.nome)}<br><span class="meta">${esc(x.email||"")}${x.telefone?" · "+esc(x.telefone):""}</span></td><td>${esc(x.perfil)}</td><td><span class="selo">${nEtapa(x)}</span></td><td>${x.feitas} de ${ORDEM.length}</td><td>${x.prova!=null?x.prova+" acertos":"—"}</td><td><button class="link" data-a="verusuario" data-v="${x.id}">Abrir</button></td></tr>`).join("")}</tbody></table></div></section>`;
}
async function carregarEquipe(){
  const {data:profs}=await sb.from("profiles").select("id,nome,email,perfil,telefone");
  const {data:prog}=await sb.from("progresso").select("user_id,etapa,nota");
  const porUser={};(prog||[]).forEach(r=>{(porUser[r.user_id]=porUser[r.user_id]||[]).push(r);});
  S.equipe=(profs||[]).map(p=>{const rs=porUser[p.id]||[];const prova=rs.find(r=>r.etapa==="prova");return {id:p.id,nome:p.nome||p.email,email:p.email,telefone:p.telefone,perfil:p.perfil,feitas:rs.length,prova:prova?prova.nota:null};})
    .sort((a,b)=>b.feitas-a.feitas);
}
function vUsuarioAdmin(){
  if(!S.adminUser)return `<div class="carregando">Carregando…</div>`;
  const u=S.adminUser,ehEu=u.id===S.user.id;
  return `<button class="voltar" data-a="pag" data-v="acomp">‹ Acompanhamento</button>
  <div><h1 class="titulo">${esc(S.adminForm.nome||u.email)}</h1><p class="sub">${esc(u.email)} · acesso de <strong>${esc(u.perfil)}</strong>. Edite os dados abaixo ou altere o perfil de acesso.</p></div>
  <form class="form-card" id="f-usuario">
    <div><label for="f_perfil">Perfil de acesso *</label><select id="f_perfil" data-fk="perfil" data-reperfil="1" required>${PERFIS.map(p=>`<option value="${esc(p)}" ${S.adminForm.perfil===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
    ${camposPerfil(S.adminForm.perfil)}
    ${S._erro?`<div class="erro" role="alert">${esc(S._erro)}</div>`:""}
    <div class="acoes"><button class="btn" type="submit">Salvar alterações</button></div>
  </form>
  <section class="bloco"><h2 class="sec">Excluir acesso</h2>
  ${ehEu?`<div class="nota-admin">Você não pode excluir o seu próprio acesso.</div>`
  :S.confirmExcluir
    ?`<div class="perigo-box"><strong>Tem certeza?</strong> Isso apaga o acesso de ${esc(S.adminForm.nome||u.email)} e todo o progresso dele. Não dá para desfazer.<div class="acoes"><button class="btn perigo" data-a="excluir-confirma">Sim, excluir</button><button class="btn sec" data-a="excluir-cancela">Cancelar</button></div></div>`
    :`<div class="perigo-box">Remove o acesso da pessoa e o progresso dela, de forma permanente.<div><button class="btn perigo" data-a="excluir">Excluir acesso</button></div></div>`}
  </section>`;
}
async function abrirUsuario(id){
  S.adminUser=null;S.adminForm=null;S.confirmExcluir=false;S._erro=null;S.pag="usuario";render();
  const {data:prof}=await sb.from("profiles").select("*").eq("id",id).maybeSingle();
  if(!prof){S._erro="Não foi possível abrir este usuário.";S.pag="acomp";render();return;}
  S.adminUser=prof;S.adminForm={...prof};S.formAlvo="adminForm";preloadCidades(prof.perfil);render();
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S.user){app.innerHTML=vLogin(S._erro);S._erro=null;return;}
  if(S.profile&&S.profile.precisa_trocar_senha){app.innerHTML=vTrocaSenha(S._erro);S._erro=null;return;}
  if(S.pag!=="usuario")S.formAlvo="form";
  const precisaForm=(!cadastroCompleto())||S.pag==="perfil";
  if(precisaForm&&!S.form){S.form={...S.profile};preloadCidades(S.perfil);}
  if(!cadastroCompleto()){app.innerHTML=vCadastroObrig();S._erro=null;return;}
  if(S.pag==="perfil"){app.innerHTML=cabecalho()+`<main>${vPerfil()}</main>`;return;}
  if(!S.secao){app.innerHTML=cabecalho()+`<main>${vHub()}</main>`;return;}
  if(S.secao==="academia"){
    if(S.pag==="usuario"){app.innerHTML=cabecalho()+subnavAcademia()+`<main>${vUsuarioAdmin()}</main>`;return;}
    const corpo={trilha:vTrilha,etapa:vEtapa,base:vBase,cert:vCert,acomp:vAcomp,precos:vPrecos}[S.pag]||(ehAdmin()?vAcomp:vTrilha);
    app.innerHTML=cabecalho()+subnavAcademia()+`<main>${corpo()}</main>`;
    if(S.pag==="acomp"&&!S.equipe){carregarEquipe().then(render);}
    return;
  }
  app.innerHTML=cabecalho()+`<main>${vHub()}</main>`;
}
const irPag=p=>{S.pag=p;S.res=null;S._erro=null;if(p!=="usuario"){S.formAlvo="form";}render();window.scrollTo(0,0);};
async function concluir(id,nota){
  if(!S.feitas.includes(id)){S.feitas.push(id);S.notas[id]=nota;
    await sb.from("progresso").upsert({user_id:S.user.id,etapa:id,nota},{onConflict:"user_id,etapa"});}
}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="visto")return;
  if(a==="sair"){await sb.auth.signOut();S={user:null,profile:null,perfil:null,feitas:[],notas:{},secao:null,pag:"hub",etapa:null,video:0,vistos:{},res:null,fCult:"Todos",fTipo:"Todos",busca:"",equipe:null,_erro:null,novoAcesso:null,_erroCriar:null,form:null,formAlvo:"form",cidadesCache:{},adminUser:null,adminForm:null,confirmExcluir:false};render();}
  if(a==="inicio"){S.secao=null;S.pag="hub";S.res=null;S._erro=null;S.novoAcesso=null;S._erroCriar=null;S.form=null;S.formAlvo="form";render();window.scrollTo(0,0);}
  if(a==="secao"){S.secao=v;S.pag=ehAdmin()?"acomp":"trilha";S.res=null;S.novoAcesso=null;S._erroCriar=null;render();window.scrollTo(0,0);}
  if(a==="perfil"){S.pag="perfil";S._erro=null;S.formAlvo="form";S.form={...S.profile};preloadCidades(S.perfil);render();window.scrollTo(0,0);}
  if(a==="pag")irPag(v);
  if(a==="abrir"){S.etapa=+v;S.video=0;irPag("etapa");}
  if(a==="video"){S.video=+v;render();}
  if(a==="mat")aviso("No lançamento, este botão abre o material.");
  if(a==="bvideo"){S.baseVideo=S.baseVideo===v?null:v;render();if(S.baseVideo)window.scrollTo(0,0);}
  if(a==="precos"){S.precosVolta=S.pag==="etapa"?"vender":"base";irPag("precos");}
  if(a==="pos-quiz")irPag(qtdFeitas()>=ORDEM.length?"cert":"trilha");
  if(a==="cert")irPag("cert");
  if(a==="fcult"){S.fCult=v;render();}
  if(a==="ftipo"){S.fTipo=v;render();}
  if(a==="verusuario"){abrirUsuario(v);}
  if(a==="excluir"){S.confirmExcluir=true;render();}
  if(a==="excluir-cancela"){S.confirmExcluir=false;render();}
  if(a==="excluir-confirma"){
    const id=S.adminUser.id,nome=S.adminForm.nome||S.adminUser.email;
    b.disabled=true;b.textContent="Excluindo…";
    const {data,error}=await sb.functions.invoke("excluir-usuario",{body:{id}});
    let erro=null;
    if(error){try{const bd=await error.context.json();erro=bd.error||"Não foi possível excluir.";}catch(_){erro="Não foi possível excluir. Tente de novo.";}}
    else if(data&&data.error){erro=data.error;}
    if(erro){S._erro=erro;S.confirmExcluir=false;render();return;}
    S.equipe=null;S.adminUser=null;S.adminForm=null;S.confirmExcluir=false;S.formAlvo="form";S.pag="acomp";render();aviso("Acesso de "+nome+" excluído.");
  }
});
document.addEventListener("change",async ev=>{
  const c=ev.target;
  if(c.dataset.a==="visto"){
    const id=ETAPAS_ON[S.etapa].id,k=+c.dataset.v;S.vistos[id]=S.vistos[id]||[];
    S.vistos[id]=c.checked?[...new Set([...S.vistos[id],k])]:S.vistos[id].filter(x=>x!==k);
    if(c.checked&&k+1<ETAPAS_ON[S.etapa].v.length)S.video=k+1;render();return;
  }
  if(c.dataset.fk){
    const F=formAtual();F[c.dataset.fk]=c.value;
    if(c.dataset.reperfil){render();return;}
    if(c.dataset.ufload){
      const sch=schemaDoPerfil(S.formAlvo==="adminForm"?S.adminForm.perfil:S.perfil);
      const dep=sch.find(x=>x.t==="cidade"&&x.uf===c.dataset.fk);
      if(dep)F[dep.k]="";
      await carregarCidades(c.value);render();
    }
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="busca"){S.busca=ev.target.value;const pos=ev.target.selectionStart;render();const i=document.getElementById("busca");if(i){i.focus();i.setSelectionRange(pos,pos);}return;}
  if(ev.target.dataset&&ev.target.dataset.fk){formAtual()[ev.target.dataset.fk]=ev.target.value;}
});
document.addEventListener("submit",async ev=>{
  const f=ev.target;ev.preventDefault();
  if(f.id==="f-login"){
    const email=f.querySelector("#email").value.trim();const senha=f.querySelector("#senha").value;
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){S._erro=/invalid login/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar. Tente de novo.";render();return;}
    const {data:{session}}=await sb.auth.getSession();await carregarUsuario(session.user);render();
  }
  if(f.id==="f-senha"){
    const s1=f.querySelector("#s1").value,s2=f.querySelector("#s2").value;
    if(s1!==s2){S._erro="As senhas não são iguais.";render();return;}
    if(s1.length<8){S._erro="Use pelo menos 8 caracteres.";render();return;}
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.auth.updateUser({password:s1});
    if(error){S._erro="Não foi possível salvar a senha. Tente de novo.";render();return;}
    await sb.from("profiles").update({precisa_trocar_senha:false}).eq("id",S.user.id);
    S.profile.precisa_trocar_senha=false;render();
  }
  if(f.id==="f-cadastro"){
    const schema=schemaDoPerfil(S.perfil);
    if(schema.some(c=>c.req&&!((S.form[c.k]||"").trim()))){S._erro="Preencha todos os campos obrigatórios (*).";render();window.scrollTo(0,0);return;}
    const dados={};schema.forEach(c=>{if(c.t!=="email_fixo")dados[c.k]=(S.form[c.k]||"").trim();});
    const eraObrig=!cadastroCompleto();
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.from("profiles").update(dados).eq("id",S.user.id);
    if(error){S._erro="Não foi possível salvar. Tente de novo.";render();return;}
    Object.assign(S.profile,dados);S.form={...S.profile};S._erro=null;
    if(eraObrig){S.secao=null;S.pag="hub";render();aviso("Cadastro completo. Bem-vindo!");}
    else{render();aviso("Dados salvos.");}
  }
  if(f.id==="f-usuario"){
    const perfil=S.adminForm.perfil;const schema=schemaDoPerfil(perfil);
    if(schema.some(c=>c.req&&!((S.adminForm[c.k]||"").trim()))){S._erro="Preencha todos os campos obrigatórios (*).";render();window.scrollTo(0,0);return;}
    const dados={perfil};schema.forEach(c=>{if(c.t!=="email_fixo")dados[c.k]=(S.adminForm[c.k]||"").trim();});
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Salvando…";
    const {error}=await sb.from("profiles").update(dados).eq("id",S.adminUser.id);
    if(error){S._erro="Não foi possível salvar. Tente de novo.";render();return;}
    Object.assign(S.adminUser,dados);S.equipe=null;S._erro=null;render();aviso("Dados atualizados.");
  }
  if(f.id==="f-criar"){
    const nome=f.querySelector("#n_nome").value.trim();
    const email=f.querySelector("#n_email").value.trim();
    const perfil=f.querySelector("#n_perfil").value;
    S._erroCriar=null;
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Criando…";
    const {data,error}=await sb.functions.invoke("criar-usuario",{body:{nome,email,perfil}});
    let erro=null;
    if(error){try{const bd=await error.context.json();erro=bd.error||"Não foi possível criar o acesso.";}catch(_){erro="Não foi possível criar o acesso. Tente de novo.";}}
    else if(data&&data.error){erro=data.error;}
    if(erro){S._erroCriar=erro;S.novoAcesso=null;render();return;}
    S.novoAcesso={email:data.email,senha:data.senha};S._erroCriar=null;S.equipe=null;render();
    return;
  }
  if(f.id==="f-quiz"){
    const id=f.dataset.id,lista=id==="prova"?PROVA:ETAPAS.find(e=>e.id===id).quiz,min=Math.ceil(lista.length*0.7);
    const fd=new FormData(f),resp=lista.map((_,i)=>+fd.get("p"+i)),ac=resp.filter((r,i)=>r===lista[i].c).length,ok=ac>=min;
    S.res={resp,ac,ok,min};if(ok)await concluir(id,ac);render();
    document.querySelector(".resultado")?.scrollIntoView({block:"center"});
  }
});
boot();
</script>
</body>
</html>
